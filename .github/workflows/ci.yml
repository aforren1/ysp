name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository; artifacts need no repo scope.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------- #
  # Headers: CMake builds every registered header's compile checks (C11,  #
  # C++17, no-threads, async), the tests/adapt/ tests and the examples,   #
  # warnings as errors, on all three platforms. ctest runs the checks and #
  # the tests. CMakeLists.txt decides which headers apply to which OS.    #
  # --------------------------------------------------------------------- #
  headers:
    name: Headers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # liblsl for ysp/net.h's tests, Windows and Linux (no official build
      # the standard library can unpack for macOS): tools/vendor_lsl.py
      # fetches v1.17.7 and checks the archive and each file by SHA-256.
      # Before Configure, so CMake adds compile_lsl_abi to ctest and points
      # the loopback test at it. The header itself never links it.
      - name: liblsl cache
        if: matrix.os != 'macos-latest'
        uses: actions/cache@v6
        with:
          path: ~/ysp-lsl-archives
          key: liblsl-${{ runner.os }}-${{ hashFiles('tools/vendor_lsl.py') }}

      - name: liblsl (fetched, verified)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/vendor_lsl.py --write --cache ~/ysp-lsl-archives

      # On Linux only, also fetch Tracy and build ysp/rt.h's YRT_TRACY
      # compile check against the real TracyC.h.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DYSP_FETCH_MINIAUDIO=ON -DYSP_FETCH_PL_MPEG=ON ${{ matrix.os == 'ubuntu-latest' && '-DYSP_TRACY_CHECK=ON' || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Compile checks
        run: ctest --test-dir build -C Release --output-on-failure

      # ysp/trials.h's jitter draws are integer arithmetic and must give the
      # same golden digests under any optimization (ctest above checks the
      # default build; MSVC /fp:fast was checked by hand).
      - name: Jitter digests under -O3 native and -Ofast
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = macOS ]; then native=-mcpu=native; else native=-march=native; fi
          for flags in "-O3 $native" "-Ofast" "-Ofast $native"; do
            cc -std=c11 $flags -Iinclude tests/adapt/trials_jitter_repro.c -o jitter_repro -lm
            ./jitter_repro
          done

      # tests/loopback/ needs two device names wired together, so CI can never
      # run it. Build it on one platform anyway, or it rots unnoticed.
      - name: Build loopback tests (build only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -B build-loopback -DCMAKE_BUILD_TYPE=Release -DYSP_BUILD_LOOPBACK=ON -DYSP_FETCH_MINIAUDIO=ON
          cmake --build build-loopback

      # The one loopback that needs no hardware: ysp/net.h against the fetched
      # liblsl, an outlet and an inlet in one process and in two (markers,
      # a 10 kHz stream, a stream that goes and comes back). About 30 s,
      # plus a configure and one target on Windows.
      - name: LSL loopback
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -B build-lsl -DYSP_BUILD_LOOPBACK=ON -DYSP_BUILD_EXAMPLES=OFF -DYSP_BUILD_TESTS=OFF
            cmake --build build-lsl --config Release --target net_loopback
            build-lsl/Release/net_loopback.exe --two --quick --seconds 3
          else
            build-loopback/net_loopback --two --quick --seconds 3
          fi

      # No hardware on CI. Each example must fail with its documented exit
      # code, not crash: a SIGSEGV or 0xC0000005 is a different number.
      - name: Run examples
        shell: bash
        run: |
          set -u
          if [ "$RUNNER_OS" = Windows ]; then bin=build/Release; else bin=build; fi
          # The runner's bash has -e set, so the expected nonzero exit must be
          # observed inside an `if`, where -e does not apply.
          expect() {
            local want=$1; shift
            local got=0
            if "$@"; then got=0; else got=$?; fi
            if [ "$got" -ne "$want" ]; then echo "::error::$* exited $got, expected $want"; exit 1; fi
          }
          if [ "$RUNNER_OS" != macOS ]; then
            expect 1 "$bin/parallel_trigger"           # no port: open fails
          fi
          expect 2 "$bin/serial_trigger"               # no args: usage
          expect 1 "$bin/serial_trigger" /dev/nothing  # open fails
          # rt_jitter needs no hardware and no privilege: a refused real-time
          # policy is one of its results, so it always exits 0. 40 short waits
          # per spin window keeps a loaded CI runner under a second.
          expect 0 "$bin/rt_jitter" 40 1000
          # rt_pump runs a fake inference job beside a 16 ms frame loop; 40
          # frames is under a second and needs nothing.
          expect 0 "$bin/rt_pump" 40
          # The event ring: a 30-frame CSV log, and a short benchmark run.
          expect 0 "$bin/rt_ring_csv" 30 rt_ring.csv
          expect 0 "$bin/rt_ring_bench" 100000 2 200
          # The adaptive-method examples simulate their observer, so they
          # need nothing and exit 0. The benches print their own numbers.
          expect 0 "$bin/stair_sim"
          expect 0 "$bin/quest_sim"
          expect 0 "$bin/quest_qcsf"
          expect 0 "$bin/quest_bench"
          expect 0 "$bin/quest_async" 20 1      # 20 trials, one frame each
          expect 0 "$bin/aep_sim"
          expect 0 "$bin/aep_bench"
          expect 0 "$bin/aep_audiometric"   # no args: the small configuration
          expect 0 "$bin/aep_async"
          expect 0 "$bin/aep_optimize"
          expect 0 "$bin/aep_pairwise"
          # The trial sequencer's examples simulate their observer.
          expect 0 "$bin/trials_mocs"
          expect 0 "$bin/trials_interleave"
          expect 0 "$bin/trials_save_rows" --sim   # writes its data file and reads it back
          # The timeline's examples simulate their display.
          expect 0 "$bin/timeline_trial"
          expect 0 "$bin/timeline_tracking"    # checks its own errors
          expect 0 "$bin/timeline_bench" 500   # a 2 ms frame budget
          # The color example on its nominal display; color_bench is built, not run.
          expect 0 "$bin/color_convert"
          expect 2 "$bin/color_convert" a b    # usage
          # The RDK bench in its short form: it runs, it does not time anything.
          expect 0 "$bin/rdk_bench" --quick
          expect 2 "$bin/rdk_bench" --bogus
          # The outline examples need a font file: without one, usage and
          # "no font here" exits (the bench is built, not timed).
          expect 2 "$bin/outline_font"
          expect 3 "$bin/outline_bench" 1 no-such-font-directory
          # The audio example on miniaudio's null device: no sound hardware.
          expect 0 "$bin/audio_tone" --null
          expect 2 "$bin/audio_tone" --bogus
          # PTB's sound schedule demos on the null device; 1 if a record is off its plan (about 9 s).
          expect 0 "$bin/audio_schedule" --null
          expect 2 "$bin/audio_schedule" --db -10
          # Capture (v0.5.0): the null input; the simulated loop, an output and an
          # input on one timer thread, for the latency, the first sound after a
          # silence (with and without a gate in the sink) and a voice RT. Each is
          # 1 when its measured result is off the loop's.
          expect 0 "$bin/audio_capstats" --null --seconds 2
          expect 0 "$bin/audio_loopback_latency" --sim --clicks 10 --every-ms 200
          expect 2 "$bin/audio_loopback_latency" --db 0
          expect 0 "$bin/audio_first_sound" --sim
          expect 0 "$bin/audio_first_sound" --sim --sim-gate-ms 20
          expect 0 "$bin/audio_voice_rt" --sim --trials 3
          # The rig profile (ysp/rigfile.h) in a folder of the runner's, never
          # the user's: a simulated output latency stored into it, then
          # the CLI on it; a second --new must not replace it.
          rig="$RUNNER_TEMP/rig"
          expect 0 "$bin/device_out_latency" --sim --n 20 --warmup 1 --file "$RUNNER_TEMP/out_latency.txt" --store --rig-dir "$rig"
          expect 0 "$bin/rigfile_profile" --dir "$rig"
          expect 0 "$bin/rigfile_profile" --dir "$rig" --bind resp xid serial:0403:6001:FT4ABC12:
          expect 0 "$bin/rigfile_profile" --dir "$rig" --rig second --new "second rig"
          expect 1 "$bin/rigfile_profile" --dir "$rig" --rig second --new again
          expect 0 "$bin/rigfile_profile" --dir "$rig" --list
          expect 2 "$bin/rigfile_profile" --bogus
          expect 0 "$bin/rigfile_profile" --dir "$rig" --bind ref lsl lsl:Data::LabStreamer:
          expect 2 "$bin/rigfile_profile" --dir "$rig" --bind ref lsl serial:0403:6001::
          # ysp/net.h loads liblsl at run time; the fetched copy is not on the
          # loader's path, so each program must say so and exit with its
          # code, not crash.
          expect 2 "$bin/net_marker_send"
          expect 2 "$bin/net_stream_view" --list

  # --------------------------------------------------------------------- #
  # Extra Linux toolchains and flag sets, one matrix entry each:           #
  #   clang        - a second compiler; the headers are warning-free on    #
  #                  both or the build fails (-Werror).                    #
  #   sanitizers   - ASan + UBSan over the compile checks and the          #
  #                  examples, which is where the OS calls actually run.   #
  #   nothreads-cxx- the Y<X>_NO_THREADS path as C++17. CMake builds it  #
  #                  as C only, and the defines reach the .cpp compile     #
  #                  checks through CMAKE_CXX_FLAGS without a new target.  #
  #                  A transport macro also sets YRT_NO_THREADS, but a   #
  #                  command-line define reaches ysp/rt.h first in the     #
  #                  compile check that includes it directly, so name all  #
  #                  three: define both of a pair, or neither.             #
  # --------------------------------------------------------------------- #
  linux-extra:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang
            cc: clang
            cxx: clang++
            cflags: ""
            cxxflags: ""
          - name: sanitizers
            cc: gcc
            cxx: g++
            cflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            cxxflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          - name: nothreads-cxx
            cc: gcc
            cxx: g++
            cflags: ""
            cxxflags: "-DYSER_NO_THREADS -DYPAR_NO_THREADS -DYRT_NO_THREADS"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # A sanitizer report must not be mistaken for an example's documented
      # exit code (1 and 2 are both expected results below), so give it a
      # number of its own. halt_on_error makes UBSan stop instead of logging.
      ASAN_OPTIONS: exitcode=42
      LSAN_OPTIONS: exitcode=42
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:exitcode=42
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DYSP_FETCH_MINIAUDIO=ON -DYSP_FETCH_PL_MPEG=ON \
            -DCMAKE_C_FLAGS="${{ matrix.cflags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build

      - name: Compile checks
        run: ctest --test-dir build --output-on-failure

      - name: Run examples
        if: matrix.name == 'sanitizers'
        shell: bash
        run: |
          set -u
          expect() {
            local want=$1; shift
            local got=0
            if "$@"; then got=0; else got=$?; fi
            if [ "$got" -ne "$want" ]; then echo "::error::$* exited $got, expected $want"; exit 1; fi
          }
          expect 1 build/parallel_trigger           # no port: open fails
          expect 2 build/serial_trigger             # no args: usage
          expect 1 build/serial_trigger /dev/nothing
          expect 0 build/rt_jitter 40 1000
          expect 0 build/rt_pump 40
          expect 0 build/rt_ring_csv 30 rt_ring.csv
          # The adaptive examples' numerics run instrumented through the
          # tests/adapt/ programs under ctest above; the two cheap examples
          # cover the example code itself. aep_sim and the benches are too
          # slow under ASan in Debug to be worth a second run.
          expect 0 build/stair_sim
          expect 0 build/quest_sim
          expect 0 build/quest_async 20 1
          expect 0 build/trials_mocs
          expect 0 build/trials_interleave
          expect 0 build/trials_save_rows --sim
          expect 0 build/timeline_trial
          expect 0 build/timeline_tracking
          expect 0 build/color_convert
          expect 0 build/audio_tone --null
          expect 0 build/audio_loopback_latency --sim --clicks 10 --every-ms 200

  # --------------------------------------------------------------------- #
  # MinGW: the headers carry explicit MinGW handling (no #pragma           #
  # comment(lib), its own intrinsics), which no other job compiles. Build  #
  # the compile checks only; the examples are covered elsewhere.           #
  # --------------------------------------------------------------------- #
  mingw:
    name: MinGW (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Before checkout: every `run` below uses the shell it installs.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DYSP_BUILD_EXAMPLES=OFF -DYSP_FETCH_MINIAUDIO=ON -DYSP_FETCH_PL_MPEG=ON

      - name: Build compile checks
        run: cmake --build build

      - name: Compile checks
        run: ctest --test-dir build --output-on-failure

  # --------------------------------------------------------------------- #
  # The core pack tool (docs/pack.md 5.1): YSP_BUILD_PACK without the     #
  # layout stack, with only lodepng fetched. Its test builds every kind   #
  # but glyph runs, checks the refusal of glyph runs, and verifies; then  #
  # the CLI on the test's packs. The Screen job compares its core pack    #
  # with the full tool's byte for byte.                                    #
  # --------------------------------------------------------------------- #
  pack-core:
    name: Pack tool, core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: lodepng cache
        uses: actions/cache@v6
        with:
          path: ~/ysp-pack-files
          key: lodepng-${{ hashFiles('tools/vendor_pack.py') }}

      - name: lodepng (fetched, verified)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/vendor_pack.py --write --cache ~/ysp-pack-files

      - name: Configure, build, test and verify
        shell: bash
        run: |
          set -eu
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DYSP_BUILD_PACK=ON -DYSP_BUILD_EXAMPLES=OFF
          cmake --build build --config Release --target ypak test_pack_tool test_pack_import
          ctest --test-dir build -C Release -R "pack_tool|pack_import" --output-on-failure
          if [ "$RUNNER_OS" = Windows ]; then bin=build/pack/Release; else bin=build/pack; fi
          "$bin/ypak" verify build/pack/pack_tool_work/corpus.ysppak
          "$bin/ypak" verify build/pack/pack_tool_work/core.ysppak
          "$bin/ypak" list build/pack/pack_tool_work/core.ysppak > /dev/null
          if "$bin/ypak" bogus x; then echo "::error::ypak bogus exited 0"; exit 1; fi

  # --------------------------------------------------------------------- #
  # WebAssembly: the computation headers (stair, quest, aep, trials,       #
  # timeline, color, pack, json)                                           #
  # claim to need nothing but libm, and ysp/rt.h claims a platform branch  #
  # is all wasm needs. Compile the compile checks with emcc, threads off,  #
  # and run them under node. Nothing here is a timing claim.               #
  # --------------------------------------------------------------------- #
  wasm:
    name: WebAssembly (emscripten)
    runs-on: ubuntu-latest
    # The same image the headers were checked in locally, so the two runs
    # are the same toolchain.
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile checks and tests under emcc
        shell: bash
        run: |
          set -eu
          # set -e ignores a failure on the left of &&, so `emcc ... && node`
          # passed when emcc failed. An explicit exit is never ignored.
          emcc() { command emcc "$@" || exit $?; }
          # The handles are large and the tests keep them on the stack, so
          # give wasm a real stack, and an initial memory that holds it;
          # growth covers the arenas. With -pthread emcc turns its growth
          # advisory into an error under -Werror, hence the -Wno.
          W="-O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wfloat-conversion -Werror -Iinclude -sSTACK_SIZE=16MB -sINITIAL_MEMORY=64MB -sALLOW_MEMORY_GROWTH=1 -Wno-pthreads-mem-growth"
          T="-pthread -sPROXY_TO_PTHREAD=1 -sEXIT_RUNTIME=1"
          # ysp/rt.h: with threads (the pump and the worker run under node),
          # without (they refuse to start, and say so), and compiled out.
          emcc $W $T -o rt_c.js tests/compile/rt.c && node rt_c.js
          emcc $W    -o rt_nothr.js tests/compile/rt.c && node rt_nothr.js
          emcc $W -DYRT_NO_THREADS -o rt_off.js tests/compile/rt.c && node rt_off.js
          emcc $W $T -o rt_test.js tests/adapt/rt_test.c && node rt_test.js
          emcc $W $T -o rt_pump.js examples/rt/pump.c && node rt_pump.js 40
          emcc $W $T -o rt_ring_csv.js examples/rt/ring_csv.c && node rt_ring_csv.js 30 > /dev/null
          for h in stair quest aep table json pack trials timeline color; do
            emcc $W -o "compile_$h.js" "tests/compile/$h.c" && node "compile_$h.js"
            emcc $W -o "test_$h.js" "tests/adapt/${h}_test.c" && node "test_$h.js"
          done
          # The async layers on the pump, the point of the ysp/rt.h branch.
          emcc $W $T -DYQST_ASYNC  -o test_quest_async.js tests/adapt/quest_test.c && node test_quest_async.js
          emcc $W $T -DYAEP_ASYNC -o test_aep_async.js    tests/adapt/aep_test.c    && node test_aep_async.js
          # ysp/audio.h: the core test runs (it has a device thread); the
          # header with miniaudio's Web Audio backend is compiled, not run,
          # because node has no Web Audio. miniaudio's EM_ASM needs -std=gnu11.
          emcc $W $T -o test_audio.js tests/adapt/audio_test.c && node test_audio.js
          curl -sL -o miniaudio.h https://raw.githubusercontent.com/mackron/miniaudio/0.11.25/miniaudio.h
          echo "ac7af4de748b7e26b777f37e01cee313a308a7296a3eb080e2906b320cc55c89  miniaudio.h" | sha256sum -c -
          emcc -O2 -std=gnu11 -Wall -Wextra -Wpedantic -Wshadow -Wfloat-conversion -Werror -Iinclude -I. -c -o compile_audio.o tests/compile/audio.c
          # ysp/gfx.h without SDL: the compile check on the simulated display
          # and the test's CPU half run; node has no GL, so its GL half says so.
          emcc $W -DYSCR_NO_SDL -o compile_gfx.js tests/compile/gfx.c && node compile_gfx.js
          emcc $W -o test_gfx.js tests/adapt/gfx_test.c && node test_gfx.js
          # ysp/video.h on the simulated display: with a decode thread, without
          # one (it decodes inside the frame call), and with pl_mpeg compiled.
          emcc $W $T -DYSCR_NO_SDL -DYVID_NO_PL_MPEG -o compile_video.js tests/compile/video.c && node compile_video.js
          emcc $W -DYSCR_NO_SDL -DYVID_NO_PL_MPEG -o compile_video_inline.js tests/compile/video.c && node compile_video_inline.js
          emcc $W $T -o test_video.js tests/adapt/video_test.c && node test_video.js
          curl -sL -o pl_mpeg.h https://raw.githubusercontent.com/phoboslab/pl_mpeg/c871f2be022ece7ef4f64230b4fb8e1fb9eb6023/pl_mpeg.h
          echo "3a8cb30c83c2a1147719c30fe0c8b93da2987aa43140077c575b39aaa75fc2c9  pl_mpeg.h" | sha256sum -c -
          emcc -O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wfloat-conversion -Werror -Iinclude -I. -DYSCR_NO_SDL -c -o compile_video_plm.o tests/compile/video.c

      # ysp/screen.h's WEB backend and the demos on it (docs/web.md): the
      # site Pages deploys, built here with this job's emsdk so a header
      # change that breaks them fails here. No browser runs here: the
      # pages were checked in Chrome by hand and headless (docs/web.md).
      - name: Web demos (examples/web/build.sh)
        shell: bash
        run: sh examples/web/build.sh web_site

      # pack/layout and its test (docs/layout.md), as the player's
      # WebAssembly build will compile them: the vendored libraries with
      # their warnings off, the glue and the test with ours. No fonts here:
      # the corpus check says it skipped them; the order checks run.
      - name: Layout sources cache
        uses: actions/cache@v6
        with:
          path: ~/ysp-layout-tarballs
          key: layout-${{ hashFiles('third_party/MANIFEST.sha256', 'third_party/patches/*', 'tools/vendor_layout.py') }}

      - name: Layout sources (fetched by commit, patched, verified)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/vendor_layout.py --write --cache ~/ysp-layout-tarballs

      - name: Layout library under emcc
        shell: bash
        run: |
          set -eu
          emcc() { command emcc "$@" || exit $?; }
          em++() { command em++ "$@" || exit $?; }
          T=third_party
          W="-O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wfloat-conversion -Werror -Iinclude"
          mkdir -p lo
          em++ -O2 -std=c++17 -fno-exceptions -fno-rtti -w -c $T/harfbuzz/src/harfbuzz.cc -o lo/hb.o
          emcc -O2 -w -DSB_CONFIG_UNITY -I$T/sheenbidi/Headers -I$T/sheenbidi/Source -c $T/sheenbidi/Source/SheenBidi.c -o lo/sb.o
          for f in linebreak linebreakdata linebreakdef wordbreak graphemebreak eastasianwidthdef emojidef unibreakbase unibreakdef; do
            emcc -O2 -w -c $T/libunibreak/src/$f.c -o lo/ub_$f.o
          done
          emcc -O2 -w -I$T/budouxc/include -c $T/budouxc/src/budoux.c -o lo/bx.o
          for f in attribute_collection attributes common editor editor_rules font_collection icon_collection layout rich_layout rich_text text; do
            emcc -O2 -w -std=gnu17 -I$T/skribidi/include -I$T/skribidi/src -I$T/harfbuzz/src -I$T/sheenbidi/Headers \
              -I$T/libunibreak/src -I$T/budouxc/include -c $T/skribidi/src/skb_$f.c -o lo/skb_$f.o
          done
          P=$(for f in skribidi-0001-bidi-run-merge skribidi-0002-l1-trailing-whitespace; do
                printf 'sha256:%s,' "$(sha256sum $T/patches/$f.patch | cut -c1-64)"; done)
          emcc $W -isystem $T/skribidi/include -isystem $T/harfbuzz/src -DYLAY_PATCHES="\"${P%,}\"" -c pack/layout.c -o lo/ysp_layout.o
          emcc $W -Ipack -isystem $T/skribidi/include -DYSCR_NO_SDL -DYLAY_TEST_DIR='"tests/layout"' -DYLAY_TEST_FONTS='"/no-fonts"' -c tests/layout/layout_test.c -o lo/test.o
          # HarfBuzz needs the C++ library: link with em++.
          em++ -O2 -sNODERAWFS=1 -sSTACK_SIZE=16MB -sINITIAL_MEMORY=64MB -sALLOW_MEMORY_GROWTH=1 -o lo/test_layout.js lo/*.o
          node lo/test_layout.js

  # --------------------------------------------------------------------- #
  # Python: cibuildwheel builds one abi3 wheel (Limited API, cp38+) per     #
  # platform for each binding package. Add a directory to the matrix when  #
  # a binding lands; exclude the platforms its header does not support.    #
  # --------------------------------------------------------------------- #
  python-wheels:
    name: Python ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [ysp_parallel, ysp_serial, ysp_stair, ysp_quest, ysp_aep, ysp_trials, ysp_color, ysp_rdk]
        exclude:
          - os: macos-latest      # ysp/parallel.h #errors on macOS
            package: ysp_parallel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # cibuildwheel builds from the package directory alone, so every header
      # the extension compiles must sit in include/ysp/ next to setup.py: the package's header
      # and ysp/rt.h, which the transport headers include and the adaptive
      # headers' async layers include, and ysp/table.h, which ysp/trials.h
      # includes. A package gets the ones it never reads; staging them
      # unconditionally keeps this step one line.
      - name: Stage headers into the package (isolated build needs them locally)
        shell: bash
        run: p=${{ matrix.package }} && d=bindings/python/$p/include/ysp && mkdir -p $d && cp include/ysp/${p#ysp_}.h include/ysp/rt.h include/ysp/table.h $d/

      - name: Build & test wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: bindings/python/${{ matrix.package }}
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.os }}
          path: wheelhouse/*.whl

  # --------------------------------------------------------------------- #
  # Octave: build every MEX with mkoctfile and smoke-test.                #
  # --------------------------------------------------------------------- #
  octave-mex:
    name: Octave 7.3 MEX
    runs-on: ubuntu-latest
    # Pin Octave 7.3.0 via Debian bookworm (the target version). This is also
    # deterministic and avoids the liboctave-dev -> octave-dev package rename
    # that newer distros made (octave-dev is correct on bookworm and noble).
    container: debian:bookworm
    steps:
      - name: Install Octave 7.3 + build tools
        run: |
          apt-get update
          # ca-certificates is required for actions/checkout's HTTPS git fetch
          # (the bare bookworm image has none, and --no-install-recommends would
          # not pull it in transitively).
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential octave octave-dev
          octave-cli --version | head -1

      - uses: actions/checkout@v7

      - name: Build MEX
        working-directory: bindings/mex
        run: octave-cli -q --eval "build"

      # The runner has no parallel or serial hardware, so both opens must fail.
      # Check the identifier, not just that something was raised: a bad
      # argument, a bad handle or a crash in the dispatcher would otherwise
      # pass for the expected failure.
      - name: Smoke test (list ports; open is expected to fail on CI)
        working-directory: bindings/mex
        run: |
          octave-cli -q --eval "
            % Both MEX files build on ysp/rt.h, so both read one clock.
            % A gap of seconds would mean two clocks, not a slow runner.
            ts = ysp_serial('now');
            tp = ysp_parallel('now');
            printf('library clock: %.6f s (serial), %.6f s (parallel)\n', ts, tp);
            if abs(tp - ts) > 1
              error('ysp:smoke', 'the two MEX clocks disagree by %.6f s', tp - ts);
            end
            ports = ysp_parallel('list');
            printf('detected %d parallel port(s)\n', numel(ports));
            opened = false;
            try
              h = ysp_parallel('open');
              ysp_parallel('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'ysp_parallel:open')
                error('ysp:smoke', 'expected ysp_parallel:open, got ''%s'': %s', e.identifier, e.message);
              end
              printf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            ports = ysp_serial('list');
            printf('detected %d serial port(s)\n', numel(ports));
            opened = false;
            try
              h = ysp_serial('open', '/dev/nothing');
              ysp_serial('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'ysp_serial:open')
                error('ysp:smoke', 'expected ysp_serial:open, got ''%s'': %s', e.identifier, e.message);
              end
              printf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            accepted = false;
            try
              ysp_serial('read', uint64(123456), 1, 0);
              accepted = true;
            catch e
              if ~strcmp(e.identifier, 'ysp_serial:handle')
                error('ysp:smoke', 'expected ysp_serial:handle, got ''%s''', e.identifier);
              end
              printf('unknown handle rejected: %s\n', e.message);
            end
            if accepted, error('ysp:smoke', 'an unknown handle was accepted'); end"

      # The four adaptive bindings simulate their observers, so their test
      # script needs no hardware. Locally it passes in Octave 10 and MATLAB
      # R2023a (bindings/mex/README.md); this runs it on the pinned 7.3.
      - name: Adaptive bindings test (test_mex.m)
        working-directory: bindings/mex
        run: octave-cli -q --eval "test_mex"

      - name: Color binding test (test_mex_color.m)
        working-directory: bindings/mex
        run: octave-cli -q --eval "test_mex_color"

      - uses: actions/upload-artifact@v7
        with:
          name: octave-mex-bookworm
          path: bindings/mex/ysp_*.mex*

  # --------------------------------------------------------------------- #
  # MATLAB: install MATLAB, build every MEX, and smoke-test.              #
  # https://github.com/matlab-actions                                     #
  # --------------------------------------------------------------------- #
  # MathWorks licenses MATLAB on hosted runners for public repositories with
  # no setup. A private fork fails here with "Unable to find a license" and
  # needs a batch licensing token in the MLM_LICENSE_TOKEN secret
  # (https://www.mathworks.com/help/install/ug/matlab-batch-licensing-token.html).
  matlab-mex:
    name: MATLAB MEX
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Build MEX + smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('bindings/mex');
            build;
            % Both MEX files build on ysp/rt.h, so both read one clock.
            % A gap of seconds would mean two clocks, not a slow runner.
            ts = ysp_serial('now');
            tp = ysp_parallel('now');
            fprintf('library clock: %.6f s (serial), %.6f s (parallel)\n', ts, tp);
            if abs(tp - ts) > 1
              error('ysp:smoke', 'the two MEX clocks disagree by %.6f s', tp - ts);
            end
            ports = ysp_parallel('list');
            fprintf('detected %d parallel port(s)\n', numel(ports));
            % Check the identifier, not just that something was raised: a bad
            % argument or a crash in the dispatcher would otherwise pass for
            % the expected no-hardware failure.
            opened = false;
            try
              h = ysp_parallel('open');
              ysp_parallel('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'ysp_parallel:open')
                error('ysp:smoke', 'expected ysp_parallel:open, got ''%s'': %s', e.identifier, e.message);
              end
              fprintf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            ports = ysp_serial('list');
            fprintf('detected %d serial port(s)\n', numel(ports));
            opened = false;
            try
              h = ysp_serial('open', '/dev/nothing');
              ysp_serial('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'ysp_serial:open')
                error('ysp:smoke', 'expected ysp_serial:open, got ''%s'': %s', e.identifier, e.message);
              end
              fprintf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            accepted = false;
            try
              ysp_serial('read', uint64(123456), 1, 0);
              accepted = true;
            catch e
              if ~strcmp(e.identifier, 'ysp_serial:handle')
                error('ysp:smoke', 'expected ysp_serial:handle, got ''%s''', e.identifier);
              end
              fprintf('unknown handle rejected: %s\n', e.message);
            end
            if accepted, error('ysp:smoke', 'an unknown handle was accepted'); end

      - name: Adaptive bindings test (test_mex.m)
        uses: matlab-actions/run-command@v3
        with:
          command: cd('bindings/mex'); test_mex

      - name: Color binding test (test_mex_color.m)
        uses: matlab-actions/run-command@v3
        with:
          command: cd('bindings/mex'); test_mex_color

      - uses: actions/upload-artifact@v7
        with:
          name: matlab-mex-linux
          path: bindings/mex/ysp_*.mex*

  # --------------------------------------------------------------------- #
  # ysp/screen.h: the one header with an external dependency, SDL3. The   #
  # headers job builds only its SDL-free test; this job gets SDL3 3.4.0   #
  # pinned (Windows: the release zips, checked by SHA-256; Linux and      #
  # macOS: the release-3.4.0 tag, built once and cached) and builds the   #
  # compile checks, the test and the examples, and on Windows the MinGW   #
  # compile checks too. No runner has a display worth timing, so the      #
  # examples run on the simulated display. ysp/gfx.h, on ysp/screen.h,    #
  # builds here too, and its pixel test renders offscreen on software GL: #
  # Mesa llvmpipe on Linux, ANGLE's WARP and SwiftShader on Windows (from #
  # a pinned Electron zip, checked by SHA-256, cached). Nothing here is a  #
  # timing claim.                                                         #
  # --------------------------------------------------------------------- #
  screen:
    name: Screen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VERSION: 3.4.0
      ELECTRON_VERSION: v38.8.6   # ANGLE 2.1.25848 (git 85cc0e0b9cc3)
    steps:
      - uses: actions/checkout@v7

      # ysp/gfx.h's test loads EGL at run time: Mesa's, with llvmpipe.
      # DejaVu Sans is the system font ygfx_text_make() looks for on Linux:
      # without it trial_keyboard's instruction screen is blank. macOS
      # installs nothing: ygfx_text_make() takes the Arial or Helvetica
      # that macOS ships.
      - name: Mesa EGL and a font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri fonts-dejavu-core

      - name: ANGLE cache (Windows)
        if: runner.os == 'Windows'
        id: anglecache
        uses: actions/cache@v6
        with:
          path: ~/angle
          key: angle-electron-${{ env.ELECTRON_VERSION }}-v1

      - name: ANGLE (Windows, from the Electron release zip by checksum)
        if: runner.os == 'Windows' && steps.anglecache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eu
          curl -sfLo electron.zip "https://github.com/electron/electron/releases/download/$ELECTRON_VERSION/electron-$ELECTRON_VERSION-win32-x64.zip"
          echo "366ae2b4aa9e6bc89b98c8b5831d46303e45cd49b2970c2b3921de5f2fcfc2e1  electron.zip" | sha256sum -c -
          unzip -q -o electron.zip libEGL.dll libGLESv2.dll d3dcompiler_47.dll vk_swiftshader.dll vk_swiftshader_icd.json vulkan-1.dll -d ~/angle
          rm electron.zip

      - name: ANGLE path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "YSCR_ANGLE_DIR=$(cygpath -w ~/angle)" >> "$GITHUB_ENV"
          echo "YGFX_TEST_DEVICES=warp,swiftshader" >> "$GITHUB_ENV"

      - name: SDL3 (Windows, release zips by checksum)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          base=https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION
          curl -sfLo sdl-vc.zip "$base/SDL3-devel-$SDL_VERSION-VC.zip"
          curl -sfLo sdl-mingw.zip "$base/SDL3-devel-$SDL_VERSION-mingw.zip"
          echo "4489ba0070b8ce047b8717e4b71fa7e35ac71362e7a6bb2a90a7a27f624b3d5d  sdl-vc.zip" | sha256sum -c -
          echo "ac22b9b0556e2f59059c9219245cd0bf73fdef4c5c4b35a601d9dc85c72661ea  sdl-mingw.zip" | sha256sum -c -
          unzip -q sdl-vc.zip -d "$RUNNER_TEMP/vc"
          unzip -q sdl-mingw.zip -d "$RUNNER_TEMP/mingw"
          echo "SDL3_DIR=$RUNNER_TEMP/vc/SDL3-$SDL_VERSION/cmake" >> "$GITHUB_ENV"
          echo "SDL3_MINGW=$RUNNER_TEMP/mingw/SDL3-$SDL_VERSION/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      - name: SDL3 cache (Linux, macOS)
        if: runner.os != 'Windows'
        id: sdlcache
        uses: actions/cache@v6
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      # A console build on Linux: the checks and the simulated display need no
      # X11 or Wayland, and the runner has neither's development packages.
      - name: SDL3 (Linux, macOS, tag release-3.4.0)
        if: runner.os != 'Windows' && steps.sdlcache.outputs.cache-hit != 'true'
        run: |
          set -eu
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL.git sdl-src
          extra=""
          if [ "$RUNNER_OS" = Linux ]; then extra="-DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON"; fi
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" $extra
          cmake --build sdl-build -j4
          cmake --install sdl-build

      - name: SDL3 path (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          echo "SDL3_DIR=$HOME/sdl3/lib/cmake/SDL3" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/sdl3/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/sdl3/lib" >> "$GITHUB_ENV"

      - name: Layout sources cache (Windows, Linux)
        if: runner.os != 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/ysp-layout-tarballs
          key: layout-${{ hashFiles('third_party/MANIFEST.sha256', 'third_party/patches/*', 'tools/vendor_layout.py') }}

      # The vendored trees are not in git: fetched by commit SHA, patched,
      # and checked file by file against third_party/MANIFEST.sha256.
      - name: Layout sources (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/vendor_layout.py --write --cache ~/ysp-layout-tarballs

      # lodepng, stb_image and pl_mpeg for the pack tool (docs/pack.md), each at a commit,
      # each checked by SHA-256 (tools/vendor_pack.py).
      - name: lodepng cache (Windows, Linux)
        if: runner.os != 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/ysp-pack-files
          key: lodepng-${{ hashFiles('tools/vendor_pack.py') }}

      - name: lodepng (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/vendor_pack.py --write --cache ~/ysp-pack-files

      # miniaudio for the two response examples with a sound (null device).
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL3_DIR="$SDL3_DIR" -DYSP_BUILD_LOOPBACK=ON -DYSP_FETCH_MINIAUDIO=ON -DYSP_FETCH_PL_MPEG=ON ${{ runner.os != 'macOS' && '-DYSP_BUILD_LAYOUT=ON -DYSP_BUILD_PACK=ON' || '' }}

      # The Headers job has no SDL3, so a screen, gfx or video program left
      # out of this list is compiled nowhere on CI. ctest below runs every
      # test that matches its pattern, built or not.
      - name: Build
        run: cmake --build build --config Release --target compile_screen_c compile_screen_cxx compile_screen_com test_screen screen_hello screen_flipstats screen_input screen_abort screen_gamma screen_sync_check screen_loopback compile_gfx_c compile_gfx_cxx test_gfx gfx_hello gfx_trial gfx_load gfx_calib gfx_bench gfx_gallery gfx_text gfx_gratings gfx_luminance_bits gfx_clut_sync gfx_filtered_noise gfx_gaze_contingent gfx_capture gfx_rdk gfx_rdk_bench trial_rdk compile_video_c compile_video_cxx compile_video_com test_video video_play video_bench video_check test_response_sdl test_input_sdl trial_keyboard trial_same_different trial_srt trial_adjustment trial_mouse_tracking trial_audio_keyboard trial_stop_signal trial_sternberg trial_2afc_adaptive trial_two_keyboards audio_av_sync web_tutorial web_rdk_staircase web_selftest web_av_sync

      # ysp/gfx.h's pixel checks must run where software GL exists; macOS has
      # no EGL, so its test runs the CPU checks only.
      - name: Compile checks and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" != macOS ]; then export YGFX_TEST_REQUIRE_GL=1; fi
          ctest --test-dir build -C Release -R "screen|gfx|video|response_sdl|input_sdl" --output-on-failure

      - name: Run examples (simulated display)
        shell: bash
        run: |
          set -u
          if [ "$RUNNER_OS" = Windows ]; then bin=build/Release; else bin=build; fi
          expect() {
            local want=$1; shift
            local got=0
            if "$@"; then got=0; else got=$?; fi
            if [ "$got" -ne "$want" ]; then echo "::error::$* exited $got, expected $want"; exit 1; fi
          }
          expect 0 "$bin/screen_hello" --sim
          expect 0 "$bin/screen_flipstats" --sim --frames 120
          # the sync guard: synced on the simulated display; fired (exit 3)
          # on a simulated swap path with vsync forced off
          expect 0 "$bin/screen_sync_check" --sim
          expect 3 "$bin/screen_sync_check" --sim-vsync-off
          expect 2 "$bin/screen_hello" --bogus
          expect 2 "$bin/screen_loopback"       # no args: usage
          # ysp/gfx.h on the simulated display: its null backend draws nothing.
          expect 0 "$bin/gfx_hello" --sim --frames 30
          expect 0 "$bin/gfx_trial" --sim
          # ysp/response.h: the keyboard trial with a synthetic participant; 1 if a trial does not come out as scripted.
          expect 0 "$bin/trial_keyboard" --sim --out "$RUNNER_TEMP/trial_keyboard.csv"
          expect 2 "$bin/trial_keyboard" --bogus
          # The jsPsych-style response examples, each with a synthetic participant (about 90 s in all).
          expect 0 "$bin/trial_same_different" --sim --out "$RUNNER_TEMP/trial_same_different.csv"
          expect 0 "$bin/trial_srt" --sim --out "$RUNNER_TEMP/trial_srt.csv"
          expect 0 "$bin/trial_adjustment" --sim --out "$RUNNER_TEMP/trial_adjustment.csv" --traj "$RUNNER_TEMP/trial_adjustment_trajectory.csv"
          expect 0 "$bin/trial_mouse_tracking" --sim --out "$RUNNER_TEMP/trial_mouse_tracking.csv" --traj "$RUNNER_TEMP/trial_mouse_tracking_trajectory.csv"
          expect 0 "$bin/trial_mouse_tracking" --sim --raw-mice --out "$RUNNER_TEMP/trial_mouse_tracking_raw.csv" --traj "$RUNNER_TEMP/trial_mouse_tracking_raw_trajectory.csv"
          expect 0 "$bin/trial_audio_keyboard" --sim --out "$RUNNER_TEMP/trial_audio_keyboard.csv"
          expect 0 "$bin/trial_stop_signal" --sim --out "$RUNNER_TEMP/trial_stop_signal.csv"
          # PTB's KbQueue per keyboard: two players on synthetic keyboards; 1 if a race comes out wrong (about 20 s).
          expect 0 "$bin/trial_two_keyboards" --sim --out "$RUNNER_TEMP/trial_two_keyboards.csv"
          expect 2 "$bin/trial_two_keyboards" --sim --one-keyboard
          # PTB's PsychPortAudioTimingTest: flash and click records, synthetic board edges; 1 if a trial is off (about 12 s).
          expect 0 "$bin/audio_av_sync" --sim --csv "$RUNNER_TEMP/audio_av_sync.csv"
          expect 2 "$bin/audio_av_sync" --sim --board serial:16C0:0483::
          # PsychoPy's staircase demos: a staircase and QUEST+ against a simulated observer; 1 if a row
          # or an estimate is off (about 35 s).
          expect 0 "$bin/trial_2afc_adaptive" --sim --out "$RUNNER_TEMP/trial_2afc_adaptive.csv"
          expect 2 "$bin/trial_2afc_adaptive" --method bogus
          # PsychoPy's dots.py as a trial; 1 if a row is off or a replay from the steps file differs (about 15 s).
          expect 0 "$bin/trial_rdk" --sim --out "$RUNNER_TEMP/trial_rdk.csv" --steps "$RUNNER_TEMP/trial_rdk_steps.csv"
          # PsychoPy's Sternberg demo: digits from a font or the bitmap font, SOAs from flip records (about 27 s).
          expect 0 "$bin/trial_sternberg" --sim --out "$RUNNER_TEMP/trial_sternberg.csv"
          # The web demos, natively (docs/web.md): scripted rows, a staircase against an observer, the loop.
          expect 0 "$bin/web_tutorial" --sim --out "$RUNNER_TEMP/web_tutorial.csv"
          expect 0 "$bin/web_rdk_staircase" --sim
          expect 0 "$bin/web_selftest" --sim --frames 120
          expect 2 "$bin/web_selftest" --frames 1
          expect 0 "$bin/web_av_sync" --sim
          expect 2 "$bin/web_av_sync" --lead 9
          expect 2 "$bin/trial_sternberg" --bogus
          expect 2 "$bin/trial_srt" --blocks SX
          expect 0 "$bin/gfx_load" --sim --gabors 10 --dots 100 --seconds 1
          expect 0 "$bin/gfx_calib"                 # no args: the synthetic display
          expect 0 "$bin/gfx_gallery" --sim         # each page once; 1 if a tile's draw is refused
          expect 2 "$bin/gfx_gallery" --page 9
          # Slug text: system fonts where the runner has them, else the bitmap font; 1 if a draw or setup step is refused.
          expect 0 "$bin/gfx_text" --sim
          expect 0 "$bin/gfx_text" --sim --font no-such-font.ttf --cjk no-such-font.ttc
          expect 2 "$bin/gfx_text" --page 9
          expect 2 "$bin/gfx_hello" --bogus
          expect 2 "$bin/gfx_bench" --device bogus
          # ysp/rdk.h through ysp/gfx.h: each page, two trials replayed from their logs (1 if a digest differs).
          expect 0 "$bin/gfx_rdk" --sim
          expect 2 "$bin/gfx_rdk" --bogus
          expect 2 "$bin/gfx_rdk_bench" --device bogus
          # USER shaders on timeline tracks; 1 if a draw is refused or the counterphase track is off.
          expect 0 "$bin/gfx_gratings" --sim
          expect 2 "$bin/gfx_gratings" --tf 0
          expect 0 "$bin/gfx_luminance_bits" --sim   # the output stage modeled: 8-bit, two dithers, PseudoGray
          expect 0 "$bin/gfx_clut_sync" --sim        # set_lut between frames only; flip records
          expect 0 "$bin/gfx_filtered_noise" --sim   # FFT round trip, band power, cost
          expect 0 "$bin/gfx_gaze_contingent" --sim  # synthetic gaze: latency and placement
          # capture on the simulated display: the null backend's black frames, to files
          # through the writer thread, and by the pump without it (3 if a count is off)
          expect 0 "$bin/gfx_capture" --sim --frames 60 --every 3 --out capture_sim/f
          expect 0 "$bin/gfx_capture" --sim --frames 60 --mark 5 --slots 12 --manual --out capture_sim/m
          expect 2 "$bin/gfx_capture" --every -1
          expect 2 "$bin/gfx_clut_sync" --os-ramp    # needs --fullscreen
          # ysp/video.h: a generated frame sequence, plain, QOI and I420.
          expect 0 "$bin/video_play" --sim
          expect 0 "$bin/video_play" --sim --qoi --frames 20
          expect 0 "$bin/video_play" --sim --yuv --size 64x48 --frames 20
          expect 0 "$bin/video_bench" --size 64x48 --reps 3
          expect 2 "$bin/video_play" --bogus

      # pack/layout (docs/layout.md): the vendored Skribidi and
      # HarfBuzz, the glue's test, and gfx_layout on the simulated display.
      # Windows runners have the corpus fonts (another version than the
      # reference's is skipped by its hash); Linux runners have none, so the
      # test runs its order checks on the font it writes.
      - name: Layout (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -eu
          cmake --build build --config Release --target test_layout gfx_layout trial_stroop
          ctest --test-dir build -C Release -R layout --output-on-failure
          if [ "$RUNNER_OS" = Windows ]; then bin=build/pack/Release; else bin=build/pack; fi
          "$bin/gfx_layout" --sim
          "$bin/gfx_layout" --sim --fonts no-such-dir
          if "$bin/gfx_layout" --page 9; then echo "::error::gfx_layout --page 9 exited 0"; exit 1; fi
          # PsychoPy's Stroop demos with a synthetic participant (about 30 s);
          # without a font (Linux runners) the trials run with no text drawn.
          "$bin/trial_stroop" --sim --out "$RUNNER_TEMP/trial_stroop.csv"

      # The pack tool (docs/pack.md): its test builds a pack of every kind,
      # verifies, rebuilds and appends it, and compares every entry with
      # tests/pack/corpus.sha256, so each OS and compiler must make the same
      # bytes. Then the CLI on the test's pack. About half a minute a job.
      - name: Pack tool (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -eu
          cmake --build build --config Release --target test_pack_tool test_pack_import ypak trial_images
          ctest --test-dir build -C Release -R "pack_tool|pack_import" --output-on-failure
          if [ "$RUNNER_OS" = Windows ]; then bin=build/pack/Release; else bin=build/pack; fi
          "$bin/ypak" verify build/pack/pack_tool_work/corpus.ysppak
          "$bin/ypak" list build/pack/pack_tool_work/corpus.ysppak > /dev/null
          if "$bin/ypak" bogus x; then echo "::error::ypak bogus exited 0"; exit 1; fi
          # trial_images (rig_spec 15.5): the pack path end to end, its pack
          # built from PNGs made in code, on the simulated display.
          "$bin/ypak" verify build/pack/trial_images.ysppak
          "$bin/trial_images" --sim --out "$RUNNER_TEMP/trial_images.csv"

      # The core tool beside the full one (docs/pack.md 5.1): the same
      # description gives the same bytes, each tool verifies the other's
      # packs, and the core tool refuses to rebuild a pack with glyph runs.
      - name: Pack tool, core against full (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -eu
          cmake -B build-core -DCMAKE_BUILD_TYPE=Release -DYSP_BUILD_PACK=ON -DYSP_BUILD_EXAMPLES=OFF
          cmake --build build-core --config Release --target ypak test_pack_tool test_pack_import
          ctest --test-dir build-core -C Release -R "pack_tool|pack_import" --output-on-failure
          if [ "$RUNNER_OS" = Windows ]; then full=build/pack/Release core=build-core/pack/Release; else full=build/pack core=build-core/pack; fi
          cmp build/pack/pack_tool_work/core.ysppak build-core/pack/pack_tool_work/core.ysppak
          "$full/ypak" verify build-core/pack/pack_tool_work/corpus.ysppak
          "$core/ypak" verify build/pack/pack_tool_work/corpus.ysppak
          "$core/ypak" verify build/pack/trial_images.ysppak
          "$core/ypak" rebuild build/pack/pack_tool_work/core.ysppak --sources build/pack/pack_tool_work
          if "$core/ypak" rebuild build/pack/pack_tool_work/corpus.ysppak --sources build/pack/pack_tool_work; then
            echo "::error::the core ypak rebuilt a pack with glyph runs"; exit 1
          fi

      # The runner's MinGW-w64 gcc, warnings as errors, on the same sources.
      - name: MinGW compile checks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          export PATH="/c/mingw64/bin:$PATH"
          W="-Wall -Wextra -Wpedantic -Wshadow -Wfloat-conversion -Werror -O2 -Iinclude -I$SDL3_MINGW/include"
          gcc -std=c11 $W -o mingw_c.exe tests/compile/screen.c -L"$SDL3_MINGW/lib" -lSDL3
          g++ -std=c++17 $W -o mingw_cxx.exe tests/compile/screen.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_test.exe tests/adapt/screen_test.c
          g++ -std=c++17 $W -o mingw_com.exe tests/compile/screen_com.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_gfx_c.exe tests/compile/gfx.c -L"$SDL3_MINGW/lib" -lSDL3
          g++ -std=c++17 $W -o mingw_gfx_cxx.exe tests/compile/gfx.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_gfx_test.exe tests/adapt/gfx_test.c
          cp "$SDL3_MINGW/bin/SDL3.dll" .
          # `;`, not `&&`: set -e ignores a failure on the left of &&.
          ./mingw_c.exe; ./mingw_cxx.exe; ./mingw_test.exe; ./mingw_com.exe
          ./mingw_gfx_c.exe; ./mingw_gfx_cxx.exe; YGFX_TEST_REQUIRE_GL=1 ./mingw_gfx_test.exe
          gcc -std=c11 $W -DYVID_NO_PL_MPEG -o mingw_video_c.exe tests/compile/video.c -L"$SDL3_MINGW/lib" -lSDL3
          g++ -std=c++17 $W -DYVID_NO_PL_MPEG -o mingw_video_cxx.exe tests/compile/video.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_video_test.exe tests/adapt/video_test.c
          g++ -std=c++17 $W -o mingw_video_com.exe tests/compile/video_com.cpp -L"$SDL3_MINGW/lib" -lSDL3
          ./mingw_video_c.exe; ./mingw_video_cxx.exe; ./mingw_video_test.exe; ./mingw_video_com.exe
