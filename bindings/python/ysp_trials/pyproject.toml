[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-trials"
version = "0.6.0.1"  # ysp/trials.h v0.6.0, binding change 1 (the CPython 3.10 floor); tests/test_trials.py checks it against __version__
description = "Trial sequencing for psychophysics: orders, constraints, interleaved adaptive tracks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.trials; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
test-command = "python -c \"import ysp.trials as pt; t = pt.Trials(n_conditions=3, reps=2, order=pt.ORDER_FULL_RANDOM, rng=1); print('ok', t.schedule())\""

[tool.cibuildwheel.macos]
archs = ["universal2"]
