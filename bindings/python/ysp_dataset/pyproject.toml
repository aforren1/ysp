[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-dataset"
version = "0.2.0.1"  # ysp/dataset.h v0.2.0, binding change 1 (the CPython 3.10 floor); tests/test_dataset.py checks it against __version__
description = "A session's data set for psychophysics: session.json, trial, frame, event, clock and stream tables, a zip"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.dataset; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
test-command = "python -c \"import os, tempfile, ysp.dataset as yds; d = os.path.join(tempfile.mkdtemp(), 's'); ds = yds.Dataset(d, [('x', 'int')]); ds.write_trial(x=1); print('ok', ds.finish(), len(ds.zip()))\""

[tool.cibuildwheel.macos]
archs = ["universal2"]
