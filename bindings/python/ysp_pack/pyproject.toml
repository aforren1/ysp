[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-pack"
version = "0.4.0"  # must equal ysp/pack.h's YPAK_VERSION_STRING; tests/test_pack.py checks it
description = "Read and verify ysp packs: store-only zip, 4 KiB aligned entries, XXH64 chunk hashes, SHA-256 manifest"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.pack; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp38-abi3 wheel tag, so one build per
# platform serves every supported CPython. cibuildwheel >= 4 has no cp38 build
# interpreter, so build on cp39; the wheel is still cp38-abi3.
build = "cp39-*"
skip = "*-musllinux_*"
test-command = "python -c \"import ysp.pack as yp; print('ok', yp.__version__, hex(yp.xxh64(b'abc')))\""

[tool.cibuildwheel.macos]
archs = ["universal2"]
