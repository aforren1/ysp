[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-rdk"
version = "0.3.0.1"  # ysp/rdk.h v0.3.0, binding change 1 (the CPython 3.10 floor); tests/test_rdk.py checks it against __version__
description = "Random dot kinematograms that regenerate bit for bit: the analysis side of ysp/rdk.h"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
# The outputs are NumPy arrays (numpy.frombuffer over the extension's bytes);
# the module imports NumPy on the first output, not at import.
dependencies = ["numpy"]

# The C extension is declared in setup.py (Extension) as ysp.rdk; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
# The whole test runs on every platform: the golden digests must be equal on
# Linux, macOS arm64 and Windows, or the binding (or the header) has a bug.
test-requires = ["pytest", "numpy"]
test-command = "pytest {package}/tests -q"

[tool.cibuildwheel.macos]
archs = ["universal2"]
