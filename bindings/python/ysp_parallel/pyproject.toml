[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-parallel"
version = "0.4.0.1"  # ysp/parallel.h v0.4.0 plus binding revision 1 (times in seconds); tests/test_parallel.py checks it against __version__
description = "Parallel-port access (data/status/control, blocking and async pulses)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.parallel; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so ysp-serial installs
# next to this distribution without either one owning the namespace.

[tool.cibuildwheel]
# The extension is abi3 (Limited API): setup.py forces a cp38-abi3 wheel tag
# (py_limited_api="cp38"), so it installs on CPython 3.8+ regardless of which
# interpreter builds it. We build on cp39 because cibuildwheel >=4 no longer
# ships a cp38 build interpreter (3.8 is EOL); the resulting wheel is still
# cp38-abi3. One build per platform serves every supported CPython.
build = "cp39-*"
# macOS has no parallel port and the library #errors there; CI runs Linux + Windows.
skip = "*-musllinux_*"
# The tests need no port: the argument checks run before any device call.
test-requires = ["pytest"]
test-command = "pytest {package}/tests -q"

[tool.cibuildwheel.linux]
# Ensure the Linux UAPI headers (<linux/ppdev.h>) are present in the manylinux
# image; they normally are (glibc-headers pulls them in), this is belt-and-braces.
before-all = "yum install -y kernel-headers || dnf install -y kernel-headers || true"
