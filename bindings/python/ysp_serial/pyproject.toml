[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-serial"
version = "0.6.2.1"  # ysp/serial.h v0.6.2, binding change 1 (the CPython 3.10 floor; 0.5.0.1 was times in seconds, 0.5.0.2 the async reader); tests/test_serial.py checks it against __version__
description = "Serial-port byte I/O for trigger and response boxes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.serial; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so ysp-parallel
# installs next to this distribution without either one owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
# The tests need no port: the argument checks run before any device call.
test-requires = ["pytest"]
test-command = "pytest {package}/tests -q"

[tool.cibuildwheel.windows]
# 64-bit only: no 32-bit Windows 11, MATLAB and ysp-vis are 64-bit, and
# a 32-bit CPython on a lab rig is rare (docs/bindings.md); cibuildwheel's
# default would add an x86 wheel.
archs = ["AMD64"]

[tool.cibuildwheel.macos]
# One wheel for Intel and Apple silicon. cibuildwheel cross-compiles the
# x86_64 half on an arm64 runner and runs the test-command on the native half.
archs = ["universal2"]
