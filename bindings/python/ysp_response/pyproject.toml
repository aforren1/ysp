[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-response"
version = "0.7.0.1"  # ysp/response.h v0.7.0, binding change 1 (the CPython 3.10 floor); tests/test_response.py checks it against __version__
description = "The response of a trial from any input device: choices, the window, RT from the stimulus onset and the timing quality of both"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.response; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
test-command = "python -c \"import ysp.response as yr; c = yr.Collector(['f', 'j'], duration=1.5); c.arm(1.0); c.set_onset(1.0); c.key(1.4, 'j'); print('ok', c.finish().rt)\""

[tool.cibuildwheel.windows]
# 64-bit only: no 32-bit Windows 11, MATLAB and ysp-vis are 64-bit, and
# a 32-bit CPython on a lab rig is rare (docs/bindings.md); cibuildwheel's
# default would add an x86 wheel.
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["universal2"]
