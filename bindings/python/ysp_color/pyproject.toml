[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-color"
version = "0.4.0"  # must equal ysp/color.h's YCOL_VERSION_STRING; tests/test_color.py checks it
description = "Color on calibrated displays: calibration, conversions, gamut questions, participant luminance"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.color; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp38-abi3 wheel tag, so one build per
# platform serves every supported CPython. cibuildwheel >= 4 has no cp38 build
# interpreter, so build on cp39; the wheel is still cp38-abi3.
build = "cp39-*"
skip = "*-musllinux_*"
test-command = "python -c \"import ysp.color as pc; c = pc.Calibration.nominal([(0.64, 0.33), (0.3, 0.6), (0.15, 0.06), (0.3127, 0.329)], 80, 2.2); x = pc.Context(c, (0.5, 0.5, 0.5)); print('ok', x.to_rgb(pc.hex('#3366cc'))[0])\""

[tool.cibuildwheel.macos]
archs = ["universal2"]
