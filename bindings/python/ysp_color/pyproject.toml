[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-color"
version = "0.4.0.1"  # ysp/color.h v0.4.0, binding change 1 (the CPython 3.10 floor); tests/test_color.py checks it against __version__
description = "Color on calibrated displays: calibration, conversions, gamut questions, participant luminance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.color; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
test-command = "python -c \"import ysp.color as pc; c = pc.Calibration.nominal([(0.64, 0.33), (0.3, 0.6), (0.15, 0.06), (0.3127, 0.329)], 80, 2.2); x = pc.Context(c, (0.5, 0.5, 0.5)); print('ok', x.to_rgb(pc.hex('#3366cc'))[0])\""

[tool.cibuildwheel.windows]
# 64-bit only: no 32-bit Windows 11, MATLAB and ysp-vis are 64-bit, and
# a 32-bit CPython on a lab rig is rare (docs/bindings.md); cibuildwheel's
# default would add an x86 wheel.
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["universal2"]
