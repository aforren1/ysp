[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ysp-box"
version = "0.3.1.1"  # ysp/box.h v0.3.1, binding change 1 (the CPython 3.10 floor); tests/test_box.py checks it against __version__
description = "Response and trigger box protocols: captured bytes to input events and clock pairs, and output bytes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"

# The C extension is declared in setup.py (Extension) as ysp.box; this file
# just pins the build backend so `pip install .` works. `ysp` is a PEP 420
# implicit namespace package: no __init__.py is shipped, so the other ysp-*
# distributions install next to this one without either owning the namespace.

[tool.cibuildwheel]
# abi3 (Limited API): setup.py forces a cp310-abi3 wheel tag, so one build per
# platform serves every supported CPython. The wheel is built on cp310 and
# tested there and on cp314: cibuildwheel tests an abi3 wheel it has built on
# the later versions it is asked for instead of building again.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
# The decoder takes untrusted bytes, so the whole test (random bytes and
# refused arguments among it) runs on every platform.
test-requires = ["pytest"]
test-command = "pytest {package}/tests -q"

[tool.cibuildwheel.windows]
# 64-bit only: no 32-bit Windows 11, MATLAB and ysp-vis are 64-bit, and
# a 32-bit CPython on a lab rig is rare (docs/bindings.md); cibuildwheel's
# default would add an x86 wheel.
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["universal2"]
