# ysp/sig.h mutants (docs/sig.md, "Tests, fuzzing and mutations"). Mutant
# 00 is a control with no effect; it must survive. The saturation mutants
# (70, 71) run the test built with UBSan: without it an overflow is silent.
header = "ysp/sig.h"

[test.sig]
source = "tests/adapt/sig_test.c"
compiler = "gcc"
flags = ["-std=c99", "-O2", "-w"]
libs = ["-lm"]
timeout = 60

[test.sig_ubsan]
source = "tests/adapt/sig_test.c"
compiler = "gcc"
flags = ["-std=c99", "-O1", "-w", "-fsanitize=undefined", "-fno-sanitize-recover=all"]
libs = ["-lm"]
timeout = 60

[[mutant]]
id = "00"
name = "control: no change (must pass)"
test = "sig"
expect = "survived"
why = "Control: a change with no effect. The test must pass, so a failure here means the setup is wrong, not the header."
find = '#define YSIG_VERSION_PATCH 0'
replace = '#define YSIG_VERSION_PATCH 0 '

[[mutant]]
id = "01"
name = "integrate: counts truncated, not rounded"
test = "sig"
why = "A negative count of -3.0 read as -2: the hand drifts toward the origin, off the exact count sum."
find = 'dc = (int64_t)(v < 0 ? v - 0.5 : v + 0.5);'
replace = 'dc = (int64_t)(v + 0.5);'

[[mutant]]
id = "02"
name = "tier: the better of two, not the worse"
test = "sig"
why = "A value from a tier-1 and a tier-3 source would claim tier 1 (principle 6, F20)."
find = 'return ra >= rb ? (ra == 4'
replace = 'return ra <= rb ? (ra == 4'

[[mutant]]
id = "03"
name = "meta: t from the older input"
test = "sig"
why = "A value read at a past time would carry its older part's time."
find = '        if (pick < 0 || in[j]->t > in[pick]->t) pick = j;'
replace = '        if (pick < 0 || in[j]->t < in[pick]->t) pick = j;'

[[mutant]]
id = "04"
name = "meta: t_oldest from the newer input"
test = "sig"
why = "The age of the oldest part (F20) would be lost."
find = 'if (in[j]->t_oldest < o->t_oldest) {'
replace = 'if (in[j]->t_oldest > o->t_oldest) {'

