name = "reset: the fed time moved to the reset's"
test = "sig"
why = "A reset at a planned onset would make the next poll look late (review N2)."
find = '''    g->n_hit = g->n_der = 0;
    g->pass++;'''
replace = '''    g->n_hit = g->n_der = 0;
    g->t_fed = t;
    g->pass++;'''

[[mutant]]
id = "83"
name = "meta: a frame takes the changed input"
test = "sig"
why = "A join's time would go back to a standing view's sample (review N3)."
find = '    if (mode != 0) changed = 0;'
replace = '    (void)0;'

[[mutant]]
id = "84"
name = "sink: time may go back"
test = "sig"
why = "A record, emit or detect would move back in time."
find = '    if (t < n->sink_t) { g->st.time_clamped++; return n->sink_t; }'
replace = '    (void)0;'

[[mutant]]
id = "85"
name = "sink: last time kept across resets"
test = "sig"
why = "After a reset to an earlier time every sink would hold the old trial's time."
find = '        n->sink_t = INT64_MIN;'
replace = '        (void)0;'

[[mutant]]
id = "76"
name = "history: a generator's input not computed at t"
test = "sig"
why = "value_at of a hand plus a perturbation would keep the perturbation of the last sample (review Q2)."
find = 'if ((a->flags[id] & (YSIG__F_MULTI | YSIG__F_FRAME)) && op < YSIG_OP_COUNT'
replace = 'if ((a->flags[id] & YSIG__F_MULTI) && op < YSIG_OP_COUNT'

[[mutant]]
id = "70"
name = "saturation: no low clamp in a difference"
test = "sig_ubsan"
why = "t - lag at INT64_MIN + 10 overflows: undefined behavior (review ub.c). Caught by the UBSan build of the test."
find = '''    if (b > 0 && a < INT64_MIN + b) return INT64_MIN;
    return a - b;'''
replace = '    return a - b;'

[[mutant]]
id = "71"
name = "saturation: no high clamp in a sum"
test = "sig_ubsan"
why = "A hold's start + hold at INT64_MAX - 5 overflows. Caught by the UBSan build."
find = '''    if (b > 0 && a > INT64_MAX - b) return INT64_MAX;
    if (b < 0 && a < INT64_MIN - b) return INT64_MIN;
    return a + b;'''
replace = '''    if (b < 0 && a < INT64_MIN - b) return INT64_MIN;
    return a + b;'''
