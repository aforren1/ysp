# ysp/device.h mutants: brackets, the map, the lifecycle, identify, keys;
# since v0.2.0 the outputs, the trigger channel and roles.
# The test runs simulated devices on a virtual clock (about 2 s with the
# thread part). docs/device.md lists the results.
header = "ysp/device.h"

[test.device]
source = "tests/adapt/device_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lsetupapi", "-lm"]
timeout = 120

[[mutant]]
id = "dev-01"
name = "answers without their bracket"
test = "device"
why = "An answer's width is the bracket; width 0 claims a pair as good as a frame's."
find = '''                w = t - dev->probe_t0;'''
replace = '''                w = 0;'''

[[mutant]]
id = "dev-02"
name = "events at their read time"
test = "device"
why = "The device's clock is the point: a read time carries the USB path's delay."
find = '''                e->t = m;
                e->unc_us = ydev__unc(dev, &fi);'''
replace = '''                (void)m;
                e->unc_us = ydev__unc(dev, &fi);'''

[[mutant]]
id = "dev-03"
name = "events mapped before their pairs"
test = "device"
why = "The pairs of a read go into the fit first, so its events map through them."
find = '''        yrt_fit_get(&dev->fit, &fi);
        mapped = fi.ready;'''
replace = '''        yrt_fit_get(&dev->fit, &fi);
        mapped = fi.ready && dev->st.pairs > (uint64_t)o.n_pair + 100000u;'''

[[mutant]]
id = "dev-04"
name = "no silence check"
test = "device"
why = "Some USB-serial drivers never fail a read after an unplug; silence is the only sign."
find = '''        if (dev->d.silent_ns > 0 && t - dev->st.last_rx_ns > dev->d.silent_ns) ydev__lose(dev, YDEV_WHY_SILENT);'''
replace = ''

[[mutant]]
id = "dev-05"
name = "no gap record"
test = "device"
why = "The log must say when events could not arrive."
find = '''        ydev__rec(dev, (uint16_t)YDEV_REC_GAP, &u);'''
replace = '''        (void)u;'''

[[mutant]]
id = "dev-06"
name = "the fit kept across a reconnect"
test = "device"
why = "A device's clock can reset on power-up; the old map would put every later event far off."
find = '''    (void)yrt_fit_open(&dev->fit, &fd);'''
replace = '''    if (dev->st.opens <= 1) (void)yrt_fit_open(&dev->fit, &fd);'''

[[mutant]]
id = "dev-07"
name = "any device identifies"
test = "device"
why = "A wrong device at the key must fail before the session, not give garbage."
find = '''    return -1;
}

/* --- outputs'''
replace = '''    return 1;
}

/* --- outputs'''

[[mutant]]
id = "dev-08"
name = "keys case-sensitive"
test = "device"
why = "Windows upper-cases instance ids; a key typed in lower case must still match."
find = '''        if (tolower((unsigned char)*a) != tolower((unsigned char)*b)) return false;'''
replace = '''        if (*a != *b) return false;'''

[[mutant]]
id = "dev-09"
name = "an empty field is not a wildcard"
test = "device"
why = "\"serial:16C0:0483::\" must match any Teensy whatever its serial number."
find = '''        if (fp[0] && !ydev__ieq(fp, fk)) return false;'''
replace = '''        if (!ydev__ieq(fp, fk)) return false;'''

[[mutant]]
id = "dev-10"
name = "no clamp"
test = "device"
why = "An event cannot happen after it was read; a map past the read time is fit error."
find = '''                if (m > t) { m = t; dev->st.clamped++; }'''
replace = '''                if (m > t) dev->st.clamped++;'''

[[mutant]]
id = "dev-11"
name = "a stale answer matched"
test = "device"
why = "An answer must match the pending query, or its width is from another query's write."
find = '''            if (o.pair[i].probe && o.pair[i].probe == dev->probe_pending) {'''
replace = '''            if (o.pair[i].probe) {'''
expect = "survived"
note = "The simulated boards answer every query before the next one, so no answer is stale; equivalent in this test. Kept as a control."

[[mutant]]
id = "dev-12"
name = "the uncertainty from the spread"
test = "device"
why = "The answers' spread (15 ms behind an FTDI timer) is not the map's error (about 1 ms)."
find = '''    int64_t ns = (int64_t)ybox_ns_per_tick(dev->d.family) + (fi->width_ns > 0 ? fi->width_ns : fi->spread_ns);'''
replace = '''    int64_t ns = (int64_t)ybox_ns_per_tick(dev->d.family) + fi->spread_ns;'''

[[mutant]]
id = "dev-13"
name = "a set keeps a pending trailing edge"
test = "device"
why = "A set means \"hold this\": a stale 0 from an earlier pulse must not undo it."
find = '''    if (dev->trail_token) {
        /* a set means "hold this"; a pulse moves the one trailing edge */
        dev->trail_token = 0;'''
replace = '''    if (dev->trail_token && pulse) {
        /* a set means "hold this"; a pulse moves the one trailing edge */
        dev->trail_token = 0;'''

[[mutant]]
id = "dev-14"
name = "the trailing edge writes the code again"
test = "device"
why = "A pulse ends at the idle code 0."
find = '''        if (dev->out_ready) rc = ydev__put(dev, 0, 0, &t0, &t1);'''
replace = '''        if (dev->out_ready) rc = ydev__put(dev, dev->out_code, 0, &t0, &t1);'''

[[mutant]]
id = "dev-15"
name = "the trailing edge at the leading write"
test = "device"
why = "The width starts at the leading write: a deadline without it gives no pulse."
find = '''            dev->trail_at = t1 + width_ns;'''
replace = '''            dev->trail_at = t1;'''

[[mutant]]
id = "dev-16"
name = "XID width never sent"
test = "device"
why = "An XID box keeps its last mp: a set after a pulse would pulse, a pulse after a set would hold."
find = '''        if (ms != dev->xid_width_ms) {'''
replace = '''        if (0) {'''

[[mutant]]
id = "dev-17"
name = "a fixed-width box takes any width"
test = "device"
why = "A BioSemi interface ends every code after 8 ms; a 2 ms request must be refused, not logged as 2 ms."
find = '''        rc = YDEV_ERR_ARG;   /* the device ends every code after its own width */'''
replace = '''        rc = YDEV_OK;        /* the device ends every code after its own width */'''

[[mutant]]
id = "dev-18"
name = "both modem lines written every time"
test = "device"
why = "Setting RTS must not touch DTR: each line can be its own output."
find = '''        r = dev->tr.lines(dev->conn, code, code ^ dev->out_code);'''
replace = '''        r = dev->tr.lines(dev->conn, code, 3u);'''

[[mutant]]
id = "dev-19"
name = "modem lines left as the open set them"
test = "device"
why = "yser_open() raises DTR and RTS by default; an output must start idle."
find = '''    dev->out_code = fam == YBOX_LINES ? 3u : 0u;   /* lines: write both, whatever the open left */'''
replace = '''    dev->out_code = 0u;   /* lines: write both, whatever the open left */'''

[[mutant]]
id = "dev-20"
name = "no 0 after the open"
test = "device"
why = "A box that holds a byte can hold a code from the last session."
find = '''    if (fam == YBOX_TRIGGERBOX || fam == YBOX_PARALLEL || fam == YBOX_LINES || (fam == YBOX_MMBTS && dev->d.latched))
        (void)ydev_out_set(dev, 0);'''
replace = '''    (void)fam;'''

[[mutant]]
id = "dev-21"
name = "a held code left at the stop"
test = "device"
why = "A latching box must not hold a trigger code after the session."
find = '''    if (dev->out_code != 0 && ydev__fixed_ns(dev) == 0) (void)ydev_out_set(dev, 0);'''
replace = ''

[[mutant]]
id = "dev-22"
name = "the flip deadline not recorded"
test = "device"
why = "Deadline to write is the trigger's lateness; without it the log cannot show it."
find = '''                     YDEV_OUT_FLIP, deadline_ns);'''
replace = '''                     YDEV_OUT_FLIP, 0);'''

[[mutant]]
id = "dev-23"
name = "a pulse at the screen's close"
test = "device"
why = "ysp/screen.h flushes pending triggers at close; a callback should not pulse then."
find = '''    if (info->flags & YSCR_TRIG_FLUSHED) return;   /* the screen's close: no pulse then */'''
replace = ''

[[mutant]]
id = "dev-24"
name = "reports at their read time"
test = "device"
why = "The board's own time of the pin change is the point; the read time carries the USB path."
find = '''            int64_t m = mapped ? yrt_fit_map(&dev->fit, o.out_ticks) : t;'''
replace = '''            int64_t m = t;'''

[[mutant]]
id = "dev-25"
name = "a role gets a new index after a restart"
test = "device"
why = "The data file joins events and records by role index; it must not change in a session."
find = '''        int i = ydev_role_index(r, dev->d.role);'''
replace = '''        int i = 0;'''

[[mutant]]
id = "dev-26"
name = "the caller's key kept, not copied (v0.3.0)"
test = "device"
why = "The reader thread reads the key again at every reconnect; a caller's buffer that is gone by then makes the device unfindable."
find = '''    dev->d.key = dev->key_buf;'''
replace = ''

[[mutant]]
id = "dev-27"
name = "a wait on a FAILED instance waits out its timeout (v0.3.0)"
test = "device"
why = "A wrong device never runs: the wait must end at once with the reason, not hang the session start for the whole timeout."
find = '''        if (s == YDEV_FAILED || s == YDEV_CLOSED) return ydev__wait_fail(dev, YDEV_ERR_STATE, s);'''
replace = '''        if (s == YDEV_CLOSED) return ydev__wait_fail(dev, YDEV_ERR_STATE, s);'''

[[mutant]]
id = "dev-28"
name = "the wait's message overwrites the wrong-device reason (v0.3.0)"
test = "device"
why = "ydev_error() after a failed wait must say why the device failed, which the reader thread wrote."
find = '''    if (state != YDEV_FAILED || !dev->err[0])'''
replace = '''    if (1)'''
