# ysp/device.h mutants: brackets, the map, the lifecycle, identify, keys;
# since v0.2.0 the outputs, the trigger channel and roles.
# The test runs simulated devices on a virtual clock (about 2 s with the
# thread part). docs/device.md lists the results.
header = "ysp/device.h"

[test.device]
source = "tests/adapt/device_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lsetupapi", "-lm"]
timeout = 120

[[mutant]]
id = "dev-01"
name = "answers without their bracket"
test = "device"
why = "An answer's width is the bracket; width 0 claims a pair as good as a frame's."
find = '''                w = t - dev->probe_t0;'''
replace = '''                w = 0;'''

[[mutant]]
id = "dev-02"
name = "events at their read time"
test = "device"
why = "The device's clock is the point: a read time carries the USB path's delay."
find = '''                e->t = m;
                e->unc_us = ydev__unc(dev, &fi);'''
replace = '''                (void)m;
                e->unc_us = ydev__unc(dev, &fi);'''

[[mutant]]
id = "dev-03"
name = "events mapped before their pairs"
test = "device"
why = "The pairs of a read go into the fit first, so its events map through them."
find = '''        yrt_fit_get(&dev->fit, &fi);
        mapped = fi.ready;'''
replace = '''        yrt_fit_get(&dev->fit, &fi);
        mapped = fi.ready && dev->st.pairs > (uint64_t)o.n_pair + 100000u;'''

[[mutant]]
id = "dev-04"
name = "no silence check"
test = "device"
why = "Some USB-serial drivers never fail a read after an unplug; silence is the only sign."
find = '''        if (dev->d.silent_ns > 0 && t - dev->st.last_rx_ns > dev->d.silent_ns) ydev__lose(dev, YDEV_WHY_SILENT);'''
replace = ''

[[mutant]]
id = "dev-05"
name = "no gap record"
test = "device"
why = "The log must say when events could not arrive."
find = '''        ydev__rec(dev, (uint16_t)YDEV_REC_GAP, &u);'''
replace = '''        (void)u;'''

[[mutant]]
id = "dev-06"
name = "the fit kept across a reconnect"
test = "device"
why = "A device's clock can reset on power-up; the old map would put every later event far off."
find = '''    (void)yrt_fit_open(&dev->fit, &fd);'''
replace = '''    if (dev->st.opens <= 1) (void)yrt_fit_open(&dev->fit, &fd);'''

[[mutant]]
id = "dev-07"
name = "any device identifies"
test = "device"
why = "A wrong device at the key must fail before the session, not give garbage."
find = '''    return -1;
}

/* --- outputs'''
replace = '''    return 1;
}

/* --- outputs'''

[[mutant]]
id = "dev-08"
name = "keys case-sensitive"
test = "device"
why = "Windows upper-cases instance ids; a key typed in lower case must still match."
find = '''        if (tolower((unsigned char)*a) != tolower((unsigned char)*b)) return false;'''
replace = '''        if (*a != *b) return false;'''

[[mutant]]
id = "dev-09"
name = "an empty field is not a wildcard"
test = "device"
why = "\"serial:16C0:0483::\" must match any Teensy whatever its serial number."
find = '''        if (fp[0] && !ydev__ieq(fp, fk)) return false;'''
replace = '''        if (!ydev__ieq(fp, fk)) return false;'''

[[mutant]]
id = "dev-10"
name = "no clamp"
test = "device"
why = "An event cannot happen after it was read; a map past the read time is fit error."
find = '''                if (m > t) { m = t; dev->st.clamped++; }'''
replace = '''                if (m > t) dev->st.clamped++;'''

[[mutant]]
id = "dev-11"
name = "a stale answer matched"
test = "device"
why = "An answer must match the pending query, or its width is from another query's write."
find = '''            if (o.pair[i].probe && o.pair[i].probe == dev->probe_pending) {'''
replace = '''            if (o.pair[i].probe) {'''
expect = "survived"
note = "The simulated boards answer every query before the next one, so no answer is stale; equivalent in this test. Kept as a control."

[[mutant]]
id = "dev-12"
name = "the uncertainty from the spread"
test = "device"
why = "The answers' spread (15 ms behind an FTDI timer) is not the map's error (about 1 ms)."
find = '''    int64_t ns = (int64_t)ybox_ns_per_tick(dev->d.family) + (fi->width_ns > 0 ? fi->width_ns : fi->spread_ns);'''
replace = '''    int64_t ns = (int64_t)ybox_ns_per_tick(dev->d.family) + fi->spread_ns;'''

[[mutant]]
id = "dev-13"
name = "a set keeps a pending trailing edge"
test = "device"
why = "A set means \"hold this\": a stale 0 from an earlier pulse must not undo it."
find = '''    if (dev->trail_token) {
        /* a set means "hold this"; a pulse moves the one trailing edge */
        dev->trail_token = 0;'''
replace = '''    if (dev->trail_token && pulse) {
        /* a set means "hold this"; a pulse moves the one trailing edge */
        dev->trail_token = 0;'''

[[mutant]]
id = "dev-14"
name = "the trailing edge writes the code again"
test = "device"
why = "A pulse ends at the idle code 0."
find = '''        if (dev->out_ready) rc = ydev__put(dev, 0, 0, &t0, &t1);'''
replace = '''        if (dev->out_ready) rc = ydev__put(dev, dev->out_code, 0, &t0, &t1);'''

[[mutant]]
id = "dev-15"
name = "the trailing edge at the leading write"
test = "device"
why = "The width starts at the leading write: a deadline without it gives no pulse."
find = '''            dev->trail_at = yser_pulse_off_at_ns(t0, t1, width_ns, dev->d.min_hold_ns);'''
replace = '''            dev->trail_at = t1;'''

[[mutant]]
id = "dev-16"
name = "XID width never sent"
test = "device"
why = "An XID box keeps its last mp: a set after a pulse would pulse, a pulse after a set would hold."
find = '''        if (ms != dev->xid_width_ms) {'''
replace = '''        if (0) {'''

[[mutant]]
id = "dev-17"
name = "a fixed-width box takes any width"
test = "device"
why = "A BioSemi interface ends every code after 8 ms; a 2 ms request must be refused, not logged as 2 ms."
find = '''        rc = YDEV_ERR_ARG;   /* the device ends every code after its own width */'''
replace = '''        rc = YDEV_OK;        /* the device ends every code after its own width */'''

[[mutant]]
id = "dev-18"
name = "both modem lines written every time"
test = "device"
why = "Setting RTS must not touch DTR: each line can be its own output."
find = '''        r = dev->tr.lines(dev->conn, code, code ^ dev->out_code);'''
replace = '''        r = dev->tr.lines(dev->conn, code, 3u);'''

[[mutant]]
id = "dev-19"
name = "modem lines left as the open set them"
test = "device"
why = "yser_open() raises DTR and RTS by default; an output must start idle."
find = '''    dev->out_code = fam == YBOX_LINES ? 3u : 0u;   /* lines: write both, whatever the open left */'''
replace = '''    dev->out_code = 0u;   /* lines: write both, whatever the open left */'''

[[mutant]]
id = "dev-20"
name = "no 0 after the open"
test = "device"
why = "A box that holds a byte can hold a code from the last session."
find = '''    if (fam == YBOX_TRIGGERBOX || fam == YBOX_PARALLEL || fam == YBOX_LINES || (fam == YBOX_MMBTS && dev->d.latched))
        (void)ydev_out_set(dev, 0);'''
replace = '''    (void)fam;'''

[[mutant]]
id = "dev-21"
name = "a held code left at the stop"
test = "device"
why = "A latching box must not hold a trigger code after the session."
find = '''    if (dev->out_code != 0 && ydev__fixed_ns(dev) == 0) (void)ydev_out_set(dev, 0);'''
replace = ''

[[mutant]]
id = "dev-22"
name = "the flip deadline not recorded"
test = "device"
why = "Deadline to write is the trigger's lateness; without it the log cannot show it."
find = '''                     YDEV_OUT_FLIP, deadline_ns, NULL);'''
replace = '''                     YDEV_OUT_FLIP, 0, NULL);'''

[[mutant]]
id = "dev-23"
name = "a pulse at the screen's close"
test = "device"
why = "ysp/screen.h flushes pending triggers at close; a callback should not pulse then."
find = '''    if (info->flags & YSCR_TRIG_FLUSHED) return;   /* the screen's close: no pulse then */'''
replace = ''

[[mutant]]
id = "dev-24"
name = "reports at their read time"
test = "device"
why = "The board's own time of the pin change is the point; the read time carries the USB path."
find = '''            int64_t m = mapped ? yrt_fit_map(&dev->fit, o.out_ticks) : t;'''
replace = '''            int64_t m = t;'''

[[mutant]]
id = "dev-25"
name = "a role gets a new index after a restart"
test = "device"
why = "The data file joins events and records by role index; it must not change in a session."
find = '''        int i = ydev_role_index(r, dev->d.role);'''
replace = '''        int i = 0;'''

[[mutant]]
id = "dev-26"
name = "the caller's key kept, not copied (v0.3.0)"
test = "device"
why = "The reader thread reads the key again at every reconnect; a caller's buffer that is gone by then makes the device unfindable."
find = '''    dev->d.key = dev->key_buf;'''
replace = ''

[[mutant]]
id = "dev-27"
name = "a wait on a FAILED instance waits out its timeout (v0.3.0)"
test = "device"
why = "A wrong device never runs: the wait must end at once with the reason, not hang the session start for the whole timeout."
find = '''        if (s == YDEV_FAILED || s == YDEV_CLOSED) return ydev__wait_fail(dev, YDEV_ERR_STATE, s);'''
replace = '''        if (s == YDEV_CLOSED) return ydev__wait_fail(dev, YDEV_ERR_STATE, s);'''

[[mutant]]
id = "dev-28"
name = "the wait's message overwrites the wrong-device reason (v0.3.0)"
test = "device"
why = "ydev_error() after a failed wait must say why the device failed, which the reader thread wrote."
find = '''    if (state != YDEV_FAILED || !dev->err[0])'''
replace = '''    if (1)'''

[[mutant]]
id = "dev-29"
name = "a host-timed width from the leading write's return (v0.3.1)"
test = "device"
why = "Over USB the code arrives during the leading write: from its return, a pulse was 0.34 to 0.42 ms long at the device (docs/serial.md, Pulses)."
find = '''            dev->trail_at = yser_pulse_off_at_ns(t0, t1, width_ns, dev->d.min_hold_ns);'''
replace = '''            dev->trail_at = t1 + width_ns;'''

[[mutant]]
id = "dev-30"
name = "no hold after the leading write (v0.3.1)"
test = "device"
why = "A width shorter than a stalled leading write would put both codes in one USB packet: a pulse of 0 us."
find = '''            dev->trail_at = yser_pulse_off_at_ns(t0, t1, width_ns, dev->d.min_hold_ns);'''
replace = '''            dev->trail_at = yser_pulse_off_at_ns(t0, t1, width_ns, 0);'''

[[mutant]]
id = "dev-31"
name = "the parallel port gets the USB hold (v0.3.1)"
test = "device"
why = "An outb does not wait in a USB queue; a 0.1 ms parallel pulse must stay 0.1 ms."
find = '''    if (dev->d.min_hold_ns == 0 && dev->d.family != YBOX_PARALLEL) dev->d.min_hold_ns = YSER_DEFAULT_MIN_HOLD_NS;'''
replace = '''    if (dev->d.min_hold_ns == 0) dev->d.min_hold_ns = YSER_DEFAULT_MIN_HOLD_NS;'''

[[mutant]]
id = "dev-32"
name = "a negative hold accepted (v0.3.1)"
test = "device"
why = "A negative hold moves the trailing write before the leading write's return."
find = '''    if (desc->min_hold_ns < 0) YDEV__FAIL("desc.min_hold_ns must be >= 0");'''
replace = ''

# ysp/serial.h has no list of its own: its tests need a port. The rule of
# yser_pulse_off_at_ns() is pure, and device_test reaches it through
# ysp/device.h.

[[mutant]]
id = "dev-33"
name = "yser_pulse_off_at_ns() from the return (serial.h v0.6.1)"
test = "device"
file = "ysp/serial.h"
why = "The rule both pulse calls and ysp/device.h share: from the onset write's start."
find = '''    int64_t a = yser__after(start_ns, width_ns), b = yser__after(return_ns, min_hold_ns);'''
replace = '''    int64_t a = yser__after(return_ns, width_ns), b = yser__after(return_ns, min_hold_ns);'''

[[mutant]]
id = "dev-34"
name = "yser_pulse_off_at_ns() takes the earlier time (serial.h v0.6.1)"
test = "device"
file = "ysp/serial.h"
why = "The hold is a floor: the later of the two times."
find = '''    return a > b ? a : b;'''
replace = '''    return a < b ? a : b;'''

# --- the parameter tables (v0.4.0) -------------------------------------------

[[mutant]]
id = "dp-01"
name = "baud 0 left as 0 in the handle"
test = "device"
why = "The table says a zero baud is the family's rate; the handle states the rate it opens."
find = '''    if (dev->d.baud == 0 && dev->d.family != YBOX_PARALLEL) dev->d.baud = ybox_default_baud(dev->d.family);'''
replace = '''    (void)0;'''

[[mutant]]
id = "dp-02"
name = "MMBT-S baud default 115200"
test = "device"
why = "The MMBT-S's firmware fixes 9600; a profile checked against 115200 would open it wrong."
find = '''YDEV__P_BAUD(9600)'''
replace = '''YDEV__P_BAUD(115200)'''

[[mutant]]
id = "dp-03"
name = "XID bracket default 1.3 ms"
test = "device"
why = "XID answers wait in the FTDI latency timer: open makes its max_width_ns 20 ms."
find = '''YDEV__P_WIDTH(2e7)'''
replace = '''YDEV__P_WIDTH(1.3e6)'''

[[mutant]]
id = "dp-04"
name = "parallel table without min_hold_ns"
test = "device"
why = "The parallel port's pulses are host-timed: the family reads min_hold_ns."
find = '''    YDEV__P_PULSE(1e10, YDEV__PULSE_DOC), YDEV__P_HOLD(0, 0),'''
replace = '''    YDEV__P_PULSE(1e10, YDEV__PULSE_DOC),'''

[[mutant]]
id = "dp-05"
name = "a table for no family"
test = "device"
why = "ydev_params() gives NULL for what is not a YBOX_ family, so a loader refuses it."
find = '''    default: break;
    }
#undef YDEV__ROWS'''
replace = '''    default: YDEV__ROWS(ydev__params_xid);
    }
#undef YDEV__ROWS'''

[[mutant]]
id = "dp-06"
name = "kind values without user"
test = "device"
why = "The kind row lists every yin_kind a desc can name (all but keyboard, which 0 cannot be)."
find = '''"mouse=1,touch=2,pen=3,gamepad=4,box=5,eye=6,sync=7,user=8" }'''
replace = '''"mouse=1,touch=2,pen=3,gamepad=4,box=5,eye=6,sync=7" }'''

[[mutant]]
id = "dp-07"
name = "photodiode kind default BOX"
test = "device"
why = "A zero kind on PHOTO is SYNC: a photodiode edge is no response."
find = '''YDEV__P_KIND(YIN_KIND_SYNC)'''
replace = '''YDEV__P_KIND(YIN_KIND_BOX)'''

# --- response rules (v0.5) --------------------------------------------------

[[mutant]]
id = "rule-01"
name = "window start exclusive"
test = "device"
why = "A press at onset + min_rt is a response in ysp/response.h; the rule must fire for it too."
find = '''    if (r->info.armed && e->t >= r->from && e->t < r->until) {'''
replace = '''    if (r->info.armed && e->t > r->from && e->t < r->until) {'''

[[mutant]]
id = "rule-02"
name = "window end inclusive"
test = "device"
why = "A press at onset + duration is LATE in ysp/response.h; a code for it would mark a response the data does not have."
find = '''    if (r->info.armed && e->t >= r->from && e->t < r->until) {'''
replace = '''    if (r->info.armed && e->t >= r->from && e->t <= r->until) {'''

[[mutant]]
id = "rule-03"
name = "no fire limit"
test = "device"
why = "The first response ends a trial: a second press must not put a second response code in the EEG."
find = '''        if (r->d.max_fires < 0 || r->info.fired < (r->d.max_fires ? r->d.max_fires : 1)) {'''
replace = '''        if (1) {'''

[[mutant]]
id = "rule-04"
name = "max_fires 0 means two"
test = "device"
why = "0 is the jsPsych default, one response per trial."
find = '''(r->d.max_fires ? r->d.max_fires : 1)'''
replace = '''(r->d.max_fires ? r->d.max_fires : 2)'''

[[mutant]]
id = "rule-05"
name = "repeats fire"
test = "device"
why = "An OS key repeat is a held key, not a press (ysp/response.h R1)."
find = '''e->type != YIN_PRESS || (e->flags & YIN_REPEAT)) return 0;'''
replace = '''e->type != YIN_PRESS) return 0;'''

[[mutant]]
id = "rule-06"
name = "any device"
test = "device"
why = "Two participants' boxes, or a box and a keyboard, are different choices."
find = '''(!c->device || c->device == e->device)'''
replace = '''(1)'''

[[mutant]]
id = "rule-07"
name = "an arm keeps the count"
test = "device"
why = "Each trial gets its own response code; a count kept across arms would send none after the first trial."
find = '''        r->info.fired = 0;
        r->info.over = 0;'''
replace = '''        r->info.over = 0;'''

[[mutant]]
id = "rule-08"
name = "window arms"
test = "device"
why = "A disarmed rule stays quiet until the next arm: the frame loop moves the window every frame, also between trials."
find = '''    if (r->info.armed) { r->from = from; r->until = until; }'''
replace = '''    r->info.armed = 1; r->from = from; r->until = until;'''

[[mutant]]
id = "rule-09"
name = "record without the press's t"
test = "device"
why = "i64[3] is what the data file subtracts: write start minus the press is the trigger's lag."
find = '''    rc = ydev__out(out, r->ch[k].code, w, YDEV_OUT_RULE, e->t, &oi);'''
replace = '''    rc = ydev__out(out, r->ch[k].code, w, YDEV_OUT_RULE, 0, &oi);'''

[[mutant]]
id = "rule-10"
name = "the reader skips the rule"
test = "device"
why = "desc.rule is the input-thread path; without the call the code waits for the frame loop again."
find = '''            if (dev->d.rule) (void)ydev_rule_input(dev->d.rule, e);'''
replace = '''            (void)0;'''

[[mutant]]
id = "rule-11"
name = "an old fire's info in a new arm"
test = "device"
why = "The frame thread reads the info for the trial it armed; a write that ends after a re-arm belongs to the trial before."
find = '''    if (arm == r->arms) {
        if (slot < YDEV_RULE_FIRES) r->fires[slot].result = rc;'''
replace = '''    if (arm) {
        if (slot < YDEV_RULE_FIRES) r->fires[slot].result = rc;'''

[[mutant]]
id = "rule-12"
name = "glue: no minimum RT"
test = "device"
file = "ysp/response.h"
why = "A press before minimum_valid_rt is an anticipation in the collector: no response code."
find = '''    *from = c->onset.t_ns + c->min_rt_ns;'''
replace = '''    *from = c->onset.t_ns;'''

[[mutant]]
id = "rule-13"
name = "glue: no deadline"
test = "device"
file = "ysp/response.h"
why = "A press at or after onset + duration is LATE in the collector."
find = '''    if (c->duration_ns > 0) *until = c->onset.t_ns + c->duration_ns;'''
replace = '''    (void)0;'''

[[mutant]]
id = "rule-14"
name = "glue: open after a response ended it"
test = "device"
file = "ysp/response.h"
why = "After the response that ends the window, presses are AFTER_END: with persist or a lost fire, the rule must not send a code for them."
find = '''    if (c->status == YRSP_ENDED && c->ended_by != 2) return;'''
replace = '''    if (c->status == YRSP_ENDED && c->ended_by == 99) return;'''

[[mutant]]
id = "rule-15"
name = "glue: closed at the deadline"
test = "device"
file = "ysp/response.h"
why = "A press stamped before the deadline and read after it counts in the collector, so its code still goes."
find = '''    if (c->status == YRSP_ENDED && c->ended_by != 2) return;'''
replace = '''    if (c->status == YRSP_ENDED) return;'''

[[mutant]]
id = "rule-16"
name = "a fire keeps choice 0"
test = "device"
why = "The collector checks the code's choice against the response's."
find = '''                f->choice = k;'''
replace = '''                f->choice = 0;'''

[[mutant]]
id = "rule-17"
name = "a fire's result stays pending"
test = "device"
why = "A failed write is no code in the EEG; pending counts as sent."
find = '''        if (slot < YDEV_RULE_FIRES) r->fires[slot].result = rc;'''
replace = '''        (void)0;'''

[[mutant]]
id = "rule-18"
name = "glue: every fire written"
test = "device"
file = "ysp/response.h"
why = "A failed write must reach the collector as not written."
find = '''        s[k].written = (uint8_t)(f[k].result == YDEV_OK || f[k].result == YDEV_RULE_PENDING);'''
replace = '''        s[k].written = 1;'''

# test_thread waits on the reader's progress, not on 1.2 s of wall time
# (2026-10-22). Its checks must still see a reader that never queries.

[[mutant]]
id = "ld-01"
name = "no timer queries by default"
test = "device"
why = "probe_ns 0 means 100 ms; with no queries the box clock is never fitted. test_thread fails at its wait."
find = '''    if (dev->d.probe_ns == 0) dev->d.probe_ns = 100000000;'''
replace = '''    if (dev->d.probe_ns == 0) dev->d.probe_ns = -1;'''

# v0.5.1: times near INT64_MAX (docs/device.md, "Times without end").

[[mutant]]
id = "ovf-01"
name = "the wait's deadline is the plain sum"
test = "device"
why = "now + INT64_MAX overflows: the wait for RUNNING with INT64_MAX timed out at the first look."
find = '''    end = ydev__after(ydev__now(dev), timeout_ns > 0 ? timeout_ns : 0);'''
replace = '''    end = ydev__now(dev) + (timeout_ns > 0 ? timeout_ns : 0);'''

[[mutant]]
id = "ovf-02"
name = "only INT64_MAX itself saturates"
test = "device"
why = "Any sum past INT64_MAX saturates: the test waits with INT64_MAX - 1 ms too."
find = '''    return d > 0 && t > INT64_MAX - d ? INT64_MAX : t + d;'''
replace = '''    return d == INT64_MAX ? INT64_MAX : t + d;'''

[[mutant]]
id = "ovf-03"
name = "a loss's retry is the plain sum"
test = "device"
why = "retry_ns INT64_MAX is never: after a loss the board is back at once, and the plain sum reopened it."
find = '''    dev->next_try = ydev__after(ydev__now(dev), dev->d.retry_ns);'''
replace = '''    dev->next_try = ydev__now(dev) + dev->d.retry_ns;'''

[[mutant]]
id = "ovf-04"
name = "an open's retry is the plain sum"
test = "device"
why = "retry_ns INT64_MAX is never: an open that failed was tried again at every poll."
find = '''    dev->next_try = ydev__after(now, dev->d.retry_ns);'''
replace = '''    dev->next_try = now + dev->d.retry_ns;'''

[[mutant]]
id = "ovf-05"
name = "the next probe is the plain sum"
test = "device"
why = "probe_ns INT64_MAX: one query, then none; the plain sum queried at every poll."
find = '''    dev->next_probe = ydev__after(now, dev->d.probe_ns);'''
replace = '''    dev->next_probe = now + dev->d.probe_ns;'''

[[mutant]]
id = "ovf-06"
name = "XID's width rounded before the cap"
test = "device"
why = "width_ns + 500000 overflows for INT64_MAX: the box got 1 ms, not its longest width. Survives here: gcc -O2 folds the overflowing sum into the comparison and gets the cap. MSVC wraps it, and the test fails there (checked 2026-10-27: 1 failing check); UBSan reports it."
expect = "survived"
find = '''    if (width_ns >= (int64_t)4294967 * 1000000) return 4294967u;   /* and no overflow below */
'''
replace = ''''''

[[mutant]]
id = "ovf-07"
name = "a refused width rounded"
test = "device"
why = "width_ns + 500 overflows for INT64_MAX: the record of a refused pulse had a negative width."
find = '''            : rc == YDEV_OK ? (width_ns + 500) / 1000 * 1000 : width_ns;'''
replace = '''            : (width_ns + 500) / 1000 * 1000;'''

[[mutant]]
id = "ovf-08"
name = "yser_pulse_off_at_ns() is the plain sum (serial.h v0.6.2)"
test = "device"
file = "ysp/serial.h"
why = "start + INT64_MAX overflows into the past: the 0 of a host-timed pulse without end came at once."
find = '''    return d > 0 && t > INT64_MAX - d ? INT64_MAX : t + d;'''
replace = '''    return t + d;'''

[[mutant]]
id = "ovf-09"
name = "yser_pulse_off_at_ns(): only INT64_MAX itself saturates (serial.h v0.6.2)"
test = "device"
file = "ysp/serial.h"
why = "Any sum past INT64_MAX saturates: the test pulses INT64_MAX - 1 ms wide too."
find = '''    return d > 0 && t > INT64_MAX - d ? INT64_MAX : t + d;'''
replace = '''    return d == INT64_MAX ? INT64_MAX : t + d;'''

[[mutant]]
