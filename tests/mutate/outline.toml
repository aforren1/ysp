# ysp/outline.h mutants (docs/outline.md, "Mutations"). The test runs
# with YOL_TEST_QUICK set, so the Windows fonts are not read.
header = "ysp/outline.h"

[test.outline]
source = "tests/adapt/outline_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 300
env = { YOL_TEST_QUICK = "1" }

[[mutant]]
id = "01"
name = "line piece direction"
test = "outline"
why = "A line's direction sets the winding it adds; reversed, every fill with lines comes out wrong."
find = 'return yol__add_piece(w, cur, (int8_t)(s[5] > s[1] ? 1 : -1), set, 1);'
replace = 'return yol__add_piece(w, cur, (int8_t)(s[5] > s[1] ? -1 : 1), set, 1);'

[[mutant]]
id = "02"
name = "end heights not merged"
test = "outline"
why = "Arc ends a few ulps off their line leave pieces 1e-17 tall; without the merge the boundary does not close."
find = 'while (b < 2 * (size_t)w.npc && yk[b].k - last <= w.eps_y) {'
replace = 'while (b < 2 * (size_t)w.npc && yk[b].k - last <= 0) {'

[[mutant]]
id = "03"
name = "coincident merge removed"
test = "outline"
why = "Shared and opposite edges (composites, abutting shapes, stroke elements) must cancel as one edge."
find = 'while (g < nlive && fabs(act[g].xa - act[i].xa) <= w.eps_x'
replace = 'while (0 && g < nlive && fabs(act[g].xa - act[i].xa) <= w.eps_x'

[[mutant]]
id = "04"
name = "no quartic crossings"
test = "outline"
why = "Curve crossings must split the strips, or the order inside a strip is wrong and so is the fill."
find = '    n = yol__roots4(c, 0, 1, fmax(1e-13, 1e-13 * m), r, 8, 0);'
replace = '    n = 0 * yol__roots4(c, 0, 1, fmax(1e-13, 1e-13 * m), r, 8, 0);'

[[mutant]]
id = "05"
name = "no line-line crossing"
test = "outline"
why = "Two straight pieces crossing must split the strip too (stroke elements are mostly lines)."
find = '''
            ys[0] = y;
            return 1;'''
replace = '''
            ys[0] = y;
            return 0;'''

[[mutant]]
id = "06"
name = "crossing kept off the arc"
test = "outline"
expect = "survived"
note = "Equivalent for results: an extra event line only adds a strip. Cost only."
why = "A root on Q's conic but off its arc is not a crossing."
find = '        if (fabs(yol__qx(Q, u) - x) > 1e-7 * w->ext) continue;'
replace = '        if (0) continue;'

[[mutant]]
id = "07"
name = "order by top only"
test = "outline"
expect = "survived"
note = "Equivalent for results: the middle x decides the same ties; the bottom-x step saves computing it. Cost only."
why = "The order at a strip's bottom breaks ties at its top before the middle x is computed."
find = '''
    if (fabs(a->xb - b->xb) > w->eps_x) return a->xb > b->xb;
'''
replace = ''

[[mutant]]
id = "08"
name = "horizontal union not difference"
test = "outline"
why = "A horizontal boundary is where inside-above and inside-below differ, not where either is inside."
find = '        st = ia != ib; dir = ib ? 1 : -1;'
replace = '        st = ia || ib; dir = ib ? 1 : -1;'

[[mutant]]
id = "09"
name = "endpoint unification removed"
test = "outline"
why = "A crossing's two pieces give x values a few ulps apart; without one point there the contour does not close."
find = '''
                if (*px - xr > w->eps_x) xr = *px;
                else *px = xr;'''
replace = '                xr = *px;'

[[mutant]]
id = "10"
name = "chain closes on y only"
test = "outline"
why = "A contour closes on its start point, both coordinates."
find = '            if (s->x1 == sx && s->y1 == sy) break;'
replace = '            if (s->y1 == sy) break;'

[[mutant]]
id = "11"
name = "pair set always seen"
test = "outline"
why = "Each adjacent pair's crossings must be computed the first time it is adjacent."
find = '        if ((*tab)[k] == 0) { (*tab)[k] = key; (*count)++; return 1; }'
replace = '        if ((*tab)[k] == 0) { (*tab)[k] = key; (*count)++; return 0; }'

[[mutant]]
id = "12"
name = "even-odd as nonzero"
test = "outline"
why = "fill-rule evenodd must leave nested same-direction contours as rings."
find = '    int a = rule == YOL_EVENODD ? (w0 & 1) : (w0 != 0);'
replace = '    int a = w0 != 0;'

[[mutant]]
id = "13"
name = "difference as union"
test = "outline"
why = "INSET is the fill minus the stroke."
find = '    if (op == YOL__OP_DIFF) return a && w1 == 0;'
replace = '    if (op == YOL__OP_DIFF) return a || w1 != 0;'

[[mutant]]
id = "14"
name = "accumulation terms swapped"
test = "outline"
why = "Each cell takes dy - A and the next takes A; swapped, coverage is wrong in every edge pixel."
find = '                row[(size_t)cx] += dy - A; row[(size_t)cx + 1] += A;'
replace = '                row[(size_t)cx] += A; row[(size_t)cx + 1] += dy - A;'

[[mutant]]
id = "15"
name = "xdy coefficient"
test = "outline"
why = "The closed-form integral of x dy along a quadratic has 1/6 in its middle term: area and coverage depend on it."
find = '    return 0.5 * x0 * d1 + (x0 * d2 + 2 * x1 * d1 + 2 * x1 * d2 + x2 * d1) / 6.0 + 0.5 * x2 * d2;'
replace = '    return 0.5 * x0 * d1 + (x0 * d2 + 2 * x1 * d1 + 2 * x1 * d2 + x2 * d1) / 4.0 + 0.5 * x2 * d2;'

[[mutant]]
id = "16"
name = "row 0 dropped"
test = "outline"
why = "The first row of an image holds coverage too."
find = '        if (cy >= 0 && cy < h) {'
replace = '        if (cy >= 1 && cy < h) {'

[[mutant]]
id = "17"
name = "residue not snapped"
test = "outline"
why = "The prefix sum leaves 1e-16 past the last edge; empty pixels must store 0."
find = '''
                if (v < 1e-13) v = 0;
'''
replace = ''

[[mutant]]
id = "18"
name = "U8 truncates"
test = "outline"
why = "U8 stores floor(255 c + 0.5), not a truncation."
find = '                case YOL_ALPHA_U8: o[x] = (uint8_t)floor(v * 255.0 + 0.5); break;'
replace = '                case YOL_ALPHA_U8: o[x] = (uint8_t)floor(v * 255.0); break;'

[[mutant]]
id = "19"
name = "cubic piece count halved bound"
test = "outline"
why = "The cubic-to-quadratic count follows the proven bound; a smaller count breaks the stated tolerance."
find = '    double n = ceil(cbrt(sqrt(3.0) / 36.0 * d3 / tol));'
replace = '    double n = ceil(cbrt(sqrt(3.0) / 72.0 * d3 / tol));'

[[mutant]]
id = "20"
name = "cubic control midpoint"
test = "outline"
why = "The quadratic's control is (3 (C1 + C2) - (A + B)) / 4; the midpoint of C1 and C2 misses the cubic."
find = '        ctrl[0] = (3 * (C1[0] + C2[0]) - (A[0] + B[0])) * 0.25;'
replace = '        ctrl[0] = (C1[0] + C2[0]) * 0.5;'

[[mutant]]
id = "21"
name = "arc step too coarse"
test = "outline"
why = "Arc pieces must keep their radial error within the tolerance."
find = '    double c = (1 + e) - sqrt((1 + e) * (1 + e) - 1);'
replace = '    double c = (1 + 4 * e) - sqrt((1 + 4 * e) * (1 + 4 * e) - 1);'

[[mutant]]
id = "22"
name = "implied midpoint skipped"
test = "outline"
why = "TrueType's implied on-curve point between two off-curve points."
find = '                        double mx = 0.5 * (cx + qx), my = 0.5 * (cy + qy);'
replace = '                        double mx = qx, my = qy;'

[[mutant]]
id = "23"
name = "flag repeat one short"
test = "outline"
why = "A TrueType flag repeat count repeats that many more times."
find = '                while (r-- && i < np) flags[i++] = (uint8_t)v;'
replace = '                while (r-- > 1 && i < np) flags[i++] = (uint8_t)v;'

[[mutant]]
id = "24"
name = "x short vector sign"
test = "outline"
why = "A short x delta's sign comes from flag bit 4."
find = '            if (v & 2) { if (q + 1 > end) goto past; x += (v & 16) ? (int32_t)d[q] : -(int32_t)d[q]; q += 1; }'
replace = '            if (v & 2) { if (q + 1 > end) goto past; x += (v & 16) ? -(int32_t)d[q] : (int32_t)d[q]; q += 1; }'

[[mutant]]
id = "25"
name = "composite 2 x 2 transposed"
test = "outline"
why = "A composite's 2 x 2 is xscale, scale01, scale10, yscale."
find = '''
                t[0] = yol__s16(d + q) / 16384.0; t[1] = yol__s16(d + q + 2) / 16384.0;
                t[2] = yol__s16(d + q + 4) / 16384.0;'''
replace = '''
                t[0] = yol__s16(d + q) / 16384.0; t[2] = yol__s16(d + q + 2) / 16384.0;
                t[1] = yol__s16(d + q + 4) / 16384.0;'''

[[mutant]]
id = "26"
name = "hintmask bytes not skipped"
test = "outline"
why = "hintmask's mask bytes follow the operator; read as numbers they corrupt the glyph."
