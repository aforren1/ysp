# player/host.c mutants: the real host checks (tests/player/mut_test.c).
header = "host.c"

[test.player]
source = "tests/player/mut_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-DYSCR_NO_SDL", "-DPIN_A0=\"x3b4a1c5afe219da5\"", "-I$YSP_MINIAUDIO"]
libs = ["-lm", "-lpthread", "-ldl"]
timeout = 300
env = { YPL_REPO = "{repo}" }
env_default = { YPL_BIN = "{repo}/build/linux", YPAK = "{repo}/build/linux/pack/ypak" }


[test.real]
source = "tests/player/mut_real.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-I$YSP_SDL3/include", "-I$YSP_MINIAUDIO"]
libs = ["-L$YSP_SDL3/lib", "-Wl,-rpath,$YSP_SDL3/lib", "-lSDL3", "-lm", "-lpthread", "-ldl"]
timeout = 900
env = { YPL_REPO = "{repo}" }
env_default = { YPL_BIN = "{repo}/build/linux" }
[[mutant]]
id = "h-01"
name = "only the first leaf is checked"
test = "player"
why = "A template's ops are checked at each leaf's extremes."
find = '''    for (li = 0; li < n_leaves && rc == 0; li++) {'''
replace = '''    for (li = 0; li < 1 && rc == 0; li++) {'''

[[mutant]]
id = "h-02"
name = "the unbound role passes in a real run"
test = "player"
why = "The stand-in applies only to --sim."
find = '''        if (role->required && !p->args.sim) {'''
replace = '''        if (0) {'''

[[mutant]]
id = "h-03"
name = "the wrong family passes"
test = "player"
why = "A role binds only a family it lists."
find = '''    snprintf(msg, cap, "the rig binds it to family '%s', which the role does not list", r->family);
    return 1;'''
replace = '''    return 0;'''

[[mutant]]
id = "h-04"
name = "the dry open is skipped"
test = "player"
why = "An impossible constraint must fail at load."
find = '''    if (!ytr_open(&t, &d)) {
        snprintf(msg, cap, "%s", ytr_error(&t));
        ytr_close(&t);
        return 1;
    }'''
replace = ''''''

[[mutant]]
id = "hr-01"
env = { YPL_REAL_CASES = "oddball" }
name = "a keyboard role unbound in the rig is refused"
test = "real"
why = "An input role that lists the keyboard takes it in a real run; it needs no binding."
find = '''                if (strcmp(role->family[i], "keyboard") == 0) return 0;'''
replace = '''                if (0) return 0;'''

[[mutant]]
id = "h-v2-01"
name = "a version 2 template's ops checked"
test = "player"
why = "experiment.h 0.3.0 reads version 2; check_ops met until in events and said 'unknown step' before the by-name refusal (player_test.py t_v2_refused)."
find = '''    if (d->format_version > PL_FORMAT_VERSION) return 0;'''
replace = ''''''
