# ysp/rt.h mutants: the device clock fit (DEVICE CLOCK FIT, v0.6.0) and the
# per-user folders (PER-USER FOLDERS, v0.7.0). The test runs the fit's and
# the folders' part of tests/adapt/rt_test.c only (YRT_TEST_FIT_ONLY),
# which takes about a second. docs/rt.md lists the results. The dir-
# mutants run on Windows, where the runner runs; dir-10 is POSIX code
# (see its note).
header = "ysp/rt.h"

[test.fit]
source = "tests/adapt/rt_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w", "-DYRT_TEST_FIT_ONLY"]
libs = ["-lm"]
timeout = 120

[test.rt]
source = "tests/adapt/rt_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 600

[[mutant]]
id = "fit-01"
name = "upper hull"
test = "fit"
why = "LATE pairs are late, never early: the map must run under the points, not over them."
find = 'if ((x2 - x1) * (y3 - y1) - (y2 - y1) * (x3 - x1) <= 0.0) h--; else break;'
replace = 'if ((x2 - x1) * (y3 - y1) - (y2 - y1) * (x3 - x1) >= 0.0) h--; else break;'

[[mutant]]
id = "fit-02"
name = "first hull edge"
test = "fit"
why = "The least summed gap is the edge that spans the mean x (Moon et al. 1999); the first edge rests on the oldest points only."
find = '            while (j + 1 < h - 1 && YRT__X(hull[j + 1]) <= xm) j++;'
replace = '            (void)xm;'

[[mutant]]
id = "fit-03"
name = "offset from the whole window"
test = "fit"
why = "Before the slope is fitted, an offset from old points carries the drift the nominal slope ignores."
find = '            if (f->py[(i + i0) % N] < from) continue;'
replace = '            (void)from;'

[[mutant]]
id = "fit-04"
name = "the later pair of a bucket"
test = "fit"
why = "A bucket keeps its least late pair; keeping the latest one puts the USB delay into the map."
find = '            if ((double)(y - f->py[i]) < (double)(x - f->px[i]) * f->d.ns_per_tick) {'
replace = '            if ((double)(y - f->py[i]) > (double)(x - f->px[i]) * f->d.ns_per_tick) {'

[[mutant]]
id = "fit-05"
name = "UNBIASED sum without its count"
test = "fit"
why = "A bucket's mean divides by the pairs in it."
find = '''            f->uy += (double)(y - f->uy0);
            f->un++;'''
replace = '''            f->uy += (double)(y - f->uy0);'''

[[mutant]]
id = "fit-06"
name = "never restart"
test = "fit"
why = "A box whose timer was reset (XID e5) must start a new epoch, or every later event maps far off."
find = '    if (omax - omin > f->d.restart_ns) return rc;'
replace = '    if (omax - omin >= 0) return rc;'

[[mutant]]
id = "fit-07"
name = "the hold drops its first pair"
test = "fit"
why = "The hold is timed from its first pair; at 100 pairs a second, eight pairs never span 1 s (the bug found on 2026-10-08)."
find = '        for (i = 2; i < 8; i++) {'
replace = '        for (i = 1; i < 8; i++) {'

[[mutant]]
id = "fit-08"
name = "no stall tolerance"
test = "fit"
why = "A burst of late pairs after an OS stall is not a clock reset: the hold must last restart_hold_ns."
find = '    if (n < 2 || f->pend_y[n - 1] - f->pend_y[0] < f->d.restart_hold_ns) return rc;'
replace = '    if (n < 2) return rc;'

[[mutant]]
id = "fit-09"
name = "wide brackets taken"
test = "fit"
why = "A bracket wider than max_width_ns bounds the device's time too loosely to use."
find = '    if (f->d.mode == YRT_FIT_BRACKET && (width_ns < 0 || width_ns > f->d.max_width_ns)) {'
replace = '    if (f->d.mode == YRT_FIT_BRACKET && (width_ns < 0 || width_ns > 2 * f->d.max_width_ns)) {'

[[mutant]]
id = "fit-10"
name = "no forward wrap"
test = "fit"
why = "micros() wraps every 71.6 minutes; a counter past the wrap must unwrap forward."
find = '''    if (d > half) u -= m;
    else if (d < -half) u += m;'''
replace = '''    if (d > half) u -= m;'''

[[mutant]]
id = "fit-11"
name = "no CLOCK records"
test = "fit"
why = "The thinned pairs in the log are what an offline refit of the session reads."
find = '''            yrt__fit_record(f, (uint16_t)YRT_KIND_CLOCK, (f->head + f->n - 1) % N);
            closed = true;'''
replace = '''            closed = true;'''

[[mutant]]
id = "fit-12"
name = "no FIT record at the first pair"
test = "fit"
why = "The log must hold the map that stamped the first events of an epoch."
find = '        if (first || closed) yrt__fit_record(f, (uint16_t)YRT_KIND_FIT, 0);'
replace = '        if (closed) yrt__fit_record(f, (uint16_t)YRT_KIND_FIT, 0);'

[[mutant]]
id = "fit-13"
name = "anchor at the oldest point"
test = "fit"
why = "The map's anchor x and host time must be the same point of the line."
find = '    f->fx = x0 + (int64_t)xl;'
replace = '    f->fx = x0;'

[[mutant]]
id = "fit-14"
name = "truncating bucket division"
test = "fit"
why = "A pair stamped before the epoch's first pair is in bucket -1, not bucket 0."
find = '    if (a % b != 0 && a < 0) q--;'
replace = '    (void)0;'

[[mutant]]
id = "fit-15"
name = "slope at once"
test = "fit"
why = "A slope from a short span is worse than the drift it corrects (ysp/audio.h measured it)."
find = '    if (n >= 2 && f->py[il] - y0 >= f->d.slope_span_ns) {'
replace = '    if (n >= 2) {'

[[mutant]]
id = "fit-16"
name = "spread as the median"
test = "fit"
why = "The spread is the p99 distance from the map, the bound a source entry starts from."
find = '    kth = (99 * n + 99) / 100 - 1;'
replace = '    kth = n / 2;'

[[mutant]]
id = "fit-17"
name = "a normal pair keeps the hold"
test = "fit"
why = "Held pairs that a normal pair contradicts were outliers; kept, they could restart the fit later."
find = '''        f->rejected += (uint32_t)f->pend_n;
        f->pend_n = 0;'''
replace = '''        f->rejected += (uint32_t)f->pend_n;'''

# --- per-user folders (v0.7.0) ---------------------------------------------------

[[mutant]]
id = "dir-01"
name = "CONFIG from LOCALAPPDATA"
test = "fit"
why = "A rig profile is kept, so it belongs in the roaming config folder, not in the cache that the OS may clear."
find = '''        DWORD k = GetEnvironmentVariableW(kind == YRT_DIR_CACHE ? L"LOCALAPPDATA" : L"APPDATA", w, 512);'''
replace = '''        DWORD k = GetEnvironmentVariableW(L"LOCALAPPDATA", w, 512);'''

[[mutant]]
id = "dir-02"
name = ".. accepted"
test = "fit"
why = "A subdir with .. leaves the ysp folder, perhaps for one other users can write."
find = '''            if (len == 2 && s[start] == '.' && s[start + 1] == '.') return false;'''
replace = ''

[[mutant]]
id = "dir-03"
name = "a relative APPDATA accepted"
test = "fit"
why = "A relative base depends on the working directory: absolute or none."
find = '''        if (k == 0 || k >= 512 || !((k >= 3 && w[1] == L':' && (w[2] == L'\\' || w[2] == L'/')) || (w[0] == L'\\' && w[1] == L'\\')))'''
replace = '''        if (k == 0 || k >= 512)'''

[[mutant]]
id = "dir-04"
name = "subdir slashes kept on Windows"
test = "fit"
why = "One separator in a Windows path, so the path compares and prints as Windows gives it."
find = '''        for (i = 0; i < m; i++) out[n++] = subdir[i] == '/' ? sep : subdir[i];'''
replace = '''        for (i = 0; i < m; i++) out[n++] = subdir[i];'''

[[mutant]]
id = "dir-05"
name = "trailing separators kept"
test = "fit"
why = "A variable that ends in a slash must not give a doubled separator."
find = '''        while (k > 3 && (w[k - 1] == L'\\' || w[k - 1] == L'/')) w[--k] = L'\0';
        m = WideCharToMultiByte(CP_UTF8, 0, w, -1, out, (int)(cap < 0x7FFFFFFF ? cap : 0x7FFFFFFF), NULL, NULL);
        if (m <= 1 || yrt__dir_tail('''
replace = '''        m = WideCharToMultiByte(CP_UTF8, 0, w, -1, out, (int)(cap < 0x7FFFFFFF ? cap : 0x7FFFFFFF), NULL, NULL);
        if (m <= 1 || yrt__dir_tail('''

[[mutant]]
id = "dir-06"
name = "no room for the NUL"
test = "fit"
why = "cap counts the NUL: a path of exactly cap bytes does not fit."
find = '''    if (need + 1u > cap) return 0;'''
replace = '''    if (need > cap) return 0;'''

[[mutant]]
id = "dir-07"
name = "the ANSI code page"
test = "fit"
why = "A user name with accents must come out as UTF-8, the encoding every ysp path takes."
find = '''        m = WideCharToMultiByte(CP_UTF8, 0, w, -1, out, (int)(cap < 0x7FFFFFFF ? cap : 0x7FFFFFFF), NULL, NULL);
        if (m <= 1 || yrt__dir_tail('''
replace = '''        m = WideCharToMultiByte(CP_ACP, 0, w, -1, out, (int)(cap < 0x7FFFFFFF ? cap : 0x7FFFFFFF), NULL, NULL);
        if (m <= 1 || yrt__dir_tail('''

[[mutant]]
id = "dir-08"
name = "empty names accepted"
test = "fit"
why = "A leading slash makes subdir absolute on POSIX; a doubled one hides a mistake."
find = '''            if (n > 0 && len == 0) return false;'''
replace = ''

[[mutant]]
id = "dir-09"
name = "backslash and colon accepted"
test = "fit"
why = "On Windows a backslash or a colon in subdir can name another root (c:x)."
find = '''        if (i < n && (c < 0x20u || c == '\\' || c == ':')) return false;'''
replace = '''        if (i < n && c < 0x20u) return false;'''

[[mutant]]
id = "dir-10"
name = "a folder all users can write accepted"
test = "fit"
why = "Anyone who can write the folder can plant a cache entry with a correct hash; /tmp must be refused."
find = '''                bad = stat(out, &st) == 0 && ((st.st_mode & S_IWOTH) != 0 || (st.st_uid != me && st.st_uid != 0));'''
replace = '''                bad = stat(out, &st) == 0 && st.st_uid != me && st.st_uid != 0;'''
expect = "survived"
note = "POSIX code, so the Windows runner cannot reach it. Killed by hand on WSL2 (gcc 11.4) on 2026-10-08: the /tmp cases of rt_test_userdir.h fail."

[[mutant]]
id = "conv-01"
name = "fit open takes a zero tick"
test = "fit"
why = "A zero ns_per_tick is what every fit call reads as not open: an open that accepts it gives a fit that refuses every pair without a word."
find = '''    if (!(d->ns_per_tick > 0.0) || d->tick_bits > 64u) {'''
replace = '''    if (d->tick_bits > 64u) {'''

[[mutant]]
id = "conv-02"
name = "fit close keeps the map"
test = "fit"
why = "A closed handle must refuse pairs and report no map, as a zeroed one does."
find = '''    if (f) memset(f, 0, sizeof *f);'''
replace = '''    (void)f;'''

# v0.9.0: the virtual clock (VIRTUAL CLOCK; tests/adapt/rt_test_virtual.h,
# which the fit-only build runs too).

[[mutant]]
id = "vc-01"
name = "now reads the real clock"
test = "fit"
why = "On the virtual clock every time the headers read must be the virtual one, or a --sim run mixes clocks."
find = '''int64_t yrt_now_ns(void) {
    if (yrt__rload(&yrt__v_on)) return yrt__ld64(&yrt__v_now);'''
replace = '''int64_t yrt_now_ns(void) {'''

[[mutant]]
id = "vc-02"
name = "the driver's wait sleeps on real time"
test = "fit"
why = "The driver's wait is what moves the virtual clock; a real sleep leaves it standing and the SIM grid never advances."
find = '''int64_t yrt_sleep_until(int64_t deadline_ns, int64_t spin_ns) {
    if (yrt__rload(&yrt__v_on)) return yrt__v_wait(deadline_ns);'''
replace = '''int64_t yrt_sleep_until(int64_t deadline_ns, int64_t spin_ns) {'''

[[mutant]]
id = "vc-03"
name = "any thread moves the clock"
test = "fit"
why = "Only the driver may move the clock: a worker's wait that moved it would make the time depend on which thread ran first."
find = '''    if (yrt__v_is_driver()) { yrt__v_advance(deadline); return 0; }'''
replace = '''    { yrt__v_advance(deadline); return 0; }'''

[[mutant]]
id = "vc-04"
name = "ties in the last slot's order"
test = "fit"
why = "Timers due at once run in the order they were set, so a run repeats exactly; the reverse order changes what a block sees."
find = '''            if (yrt__v_t[i].fn && (k < 0 || yrt__v_t[i].at < at)) { k = i; at = yrt__v_t[i].at; }'''
replace = '''            if (yrt__v_t[i].fn && (k < 0 || yrt__v_t[i].at <= at)) { k = i; at = yrt__v_t[i].at; }'''

[[mutant]]
id = "vc-05"
name = "a timer sees the wait's deadline"
test = "fit"
why = "A timer runs at its own time: an audio block stamped with the end of the wait would land a frame late."
find = '''        if (at > yrt__ld64(&yrt__v_now)) yrt__st64(&yrt__v_now, at);
        {'''
replace = '''        if (to > yrt__ld64(&yrt__v_now)) yrt__st64(&yrt__v_now, to);
        {'''

[[mutant]]
id = "vc-06"
name = "every timer is one shot"
test = "fit"
why = "A periodic timer (the null device's blocks) returns its next time; dropping it stops the device after one block."
find = '''                if (next > now) yrt__v_t[k].at = next;
                else yrt__v_t[k].fn = NULL;'''
replace = '''                (void)next;
                yrt__v_t[k].fn = NULL;'''

[[mutant]]
id = "vc-07"
name = "a past deadline is on time"
test = "fit"
why = "A wait whose deadline has passed returns its lateness, on either clock; 0 hides a late frame loop."
find = '''    if (now >= deadline) return now - deadline;
    if (yrt__v_is_driver())'''
replace = '''    if (now >= deadline) return 0;
    if (yrt__v_is_driver())'''

[[mutant]]
id = "vc-08"
name = "the worker waits on real time"
test = "fit"
why = "A job's deadline is a virtual time: against the real clock it is long past and the job runs before the clock reaches it."
find = '''        if (yrt__rload(&yrt__v_on)) {
            /* VIRTUAL CLOCK: the job runs once the driver has moved the'''
replace = '''        if (0) {
            /* VIRTUAL CLOCK: the job runs once the driver has moved the'''

[[mutant]]
id = "vc-09"
name = "ring stamps on real time"
test = "fit"
why = "A record stamped at the push must be on the clock the rest of the run's records are on."
find = '''    t_ns = ev->t_ns ? ev->t_ns : yrt__clock();'''
replace = '''    t_ns = ev->t_ns ? ev->t_ns : (int64_t)yrt__now();'''

[[mutant]]
id = "vc-10"
name = "cancel does nothing"
test = "fit"
why = "A closed device cancels its timer; a timer left set calls into freed memory."
find = '''    if (id < 0 || id >= YRT_VIRTUAL_TIMERS || !yrt__v_is_driver()) return;
    yrt__v_t[id].fn = NULL;'''
replace = '''    (void)id;'''

[[mutant]]
id = "vc-11"
name = "a second begin restarts the clock"
test = "fit"
why = "A second begin would move the clock back under every time already taken."
find = '''    if (yrt__rload(&yrt__v_on)) return YRT_ERR_STATE;
    memset(yrt__v_t, 0, sizeof yrt__v_t);'''
replace = '''    memset(yrt__v_t, 0, sizeof yrt__v_t);'''

[[mutant]]
id = "vc-12"
name = "a wait in a timer runs the timers"
test = "fit"
why = "A wait inside a timer would run the same timer again, at the same time, without end."
find = '''    for (; !yrt__v_busy;) {'''
replace = '''    for (;;) {'''

[[mutant]]
id = "vc-13"
name = "the real read follows the virtual clock"
test = "fit"
why = "A cost read on the virtual clock must be real: through yrt_now_ns() a draw takes 0 and a wait the jump."
find = '''int64_t yrt_real_ns(void) { return (int64_t)yrt__now(); }'''
replace = '''int64_t yrt_real_ns(void) { return yrt__clock(); }'''

# The clock correlation's edge mode (2026-10-22). Its test case lost its
# wall-clock upper bound, which a loaded machine broke; these check that
# the lower bounds and the edge count still see a fault. Test "rt" is the
# whole test (about 6 s alone, 70 to 130 s with 128 busy threads on 16
# logical processors).

[[mutant]]
id = "corr-01"
name = "edge mode takes 3 edges by default"
test = "rt"
why = "The default is 4 edges, the tightest kept; the test's rc check sees the count."
find = '''    tries = d->tries > 0 ? d->tries : (d->edge ? 4 : 16);'''
replace = '''    tries = d->tries > 0 ? d->tries : (d->edge ? 3 : 16);'''

[[mutant]]
id = "corr-02"
name = "edge mode's default timeout 10 ms"
test = "rt"
why = "The default timeout is 100 ms; a frozen clock must take that long to give up."
find = '''        uint64_t timeout = d->timeout_ns > 0 ? (uint64_t)d->timeout_ns : 100000000ull;'''
replace = '''        uint64_t timeout = d->timeout_ns > 0 ? (uint64_t)d->timeout_ns : 10000000ull;'''

[[mutant]]
id = "corr-03"
name = "edge mode counts a read that did not change"
test = "rt"
why = "An edge is a change of the value; 4 reads of one tick take far less than 3 ms."
find = '''            if (v != v_old) {
                w = b - a_old;'''
replace = '''            if (1) {
                w = b - a_old;'''

# v0.9.1: yrt_sleep_ns() near INT64_MAX on the virtual clock (docs/rt.md,
# "A virtual wait without end").

[[mutant]]
id = "ovf-01"
name = "the virtual sleep's deadline is the plain sum"
test = "rt"
why = "now + INT64_MAX overflows into the past: the wait returned at once and the virtual clock stood still."
find = '''        return yrt__v_wait(ns > 0 && now > INT64_MAX - ns ? INT64_MAX : now + (ns > 0 ? ns : 0));'''
replace = '''        return yrt__v_wait(now + (ns > 0 ? ns : 0));'''

[[mutant]]
id = "ovf-02"
name = "only INT64_MAX itself saturates"
test = "rt"
why = "Any sum past INT64_MAX saturates: the test sleeps INT64_MAX - 1 ms too."
find = '''        return yrt__v_wait(ns > 0 && now > INT64_MAX - ns ? INT64_MAX : now + (ns > 0 ? ns : 0));'''
replace = '''        return yrt__v_wait(ns == INT64_MAX ? INT64_MAX : now + (ns > 0 ? ns : 0));'''
