# ysp/experiment.h mutants: refusals, the defaults, the canonical bytes, the
# scopes and lookups, and the host's skip records. docs/experiment.md lists
# the results.
header = "ysp/experiment.h"

[test.experiment]
source = "tests/adapt/experiment_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w"]
libs = ["-lm"]
timeout = 60
env = { YEXP_CORPUS = "{repo}/tests/experiment" }

[[mutant]]
id = "e-01"
name = "a newer version accepted"
test = "experiment"
why = "D12: a player must refuse a version it does not read."
find = '''if (version > YEXP_FORMAT_VERSION) {'''
replace = '''if (version > YEXP_FORMAT_VERSION + 1) {'''

[[mutant]]
id = "e-02"
name = "the format string not checked"
test = "experiment"
why = "Another format's JSON would load as a definition."
