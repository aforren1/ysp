# ysp/experiment.h mutants: refusals, the defaults, the canonical bytes, the
# scopes and lookups, and the host's skip records. docs/experiment.md lists
# the results.
header = "ysp/experiment.h"

[test.experiment]
source = "tests/adapt/experiment_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w"]
libs = ["-lm"]
timeout = 120
env = { YEXP_CORPUS = "{repo}/tests/experiment" }

[[mutant]]
id = "e-01"
name = "a newer version accepted"
test = "experiment"
why = "D12: a player must refuse a version it does not read."
find = '''if (version > YEXP_FORMAT_VERSION) {'''
replace = '''if (version > YEXP_FORMAT_VERSION + 1) {'''

[[mutant]]
id = "e-02"
name = "the format string not checked"
test = "experiment"
why = "Another format's JSON would load as a definition."
find = '''if (!fmt || fmt->type != YJS_STRING || !yexp__streq(fmt->u.s, "ysp-experiment")) {'''
replace = '''if (!fmt || fmt->type != YJS_STRING) {'''

[[mutant]]
id = "e-03"
name = "an unknown key ignored"
test = "experiment"
why = "A misspelled key silently takes its default."
find = '''if (ri < 0) { yexp__unknown(c, sect, mask, m, elem); continue; }'''
replace = '''if (ri < 0) { continue; }'''

[[mutant]]
id = "e-04"
name = "name rule: one byte too long"
test = "experiment"
why = "63 bytes is the data writer's column rule."
find = '''if (i >= YEXP__MAX_NAME) return false;'''
replace = '''if (i >= YEXP__MAX_NAME + 1) return false;'''

[[mutant]]
id = "e-05"
name = "a name's first character can be a digit"
test = "experiment"
why = "A name is [A-Za-z_][A-Za-z0-9_]*."
find = '''if (!s || !((s[0] >= 'A' && s[0] <= 'Z') || (s[0] >= 'a' && s[0] <= 'z') || s[0] == '_')) return false;'''
replace = '''if (!s) return false;'''

[[mutant]]
id = "e-06"
name = "a named set's names not checked"
test = "experiment"
why = "A stimulus named 'a-b' would reach the data writer."
find = '''        if (!yexp__name_ok(m->key)) {
            yexp__err(c, m->key_pos, "%s: '%s': a name is'''
replace = '''        if (0) {
            yexp__err(c, m->key_pos, "%s: '%s': a name is'''

