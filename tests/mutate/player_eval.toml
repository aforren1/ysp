# player/eval.c mutants: the evaluator, against the system tests (tests/player/mut_test.c).
header = "eval.c"

[test.player]
source = "tests/player/mut_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-DYSCR_NO_SDL", "-DPIN_A0=\"x3b4a1c5afe219da5\"", "-I$YSP_MINIAUDIO"]
libs = ["-lm", "-lpthread", "-ldl"]
timeout = 300
env = { YPL_REPO = "{repo}", YPL_BIN = "{repo}/build/linux", YPAK = "{repo}/build/linux/pack/ypak" }

[[mutant]]
id = "e-01"
name = "the trial seed is a decimal in text"
test = "player"
why = "Item 20: the x-hex spelling."
find = '''            out->flags = YEXP_VF_INT | PL_VF_SEED;'''
replace = '''            out->flags = YEXP_VF_INT;'''

[[mutant]]
id = "e-02"
name = "an absent field is written 0"
test = "player"
why = "Item 20: an absent optional integer is empty."
find = '''    if (v->flags & PL_VF_ABSENT) return 0;'''
replace = ''''''

[[mutant]]
id = "e-03"
name = "$level aborts on a condition trial"
test = "player"
why = "Item 16: empty on a condition trial."
find = '''only a column or a lookup */
        if (!e->method) { pl_str(out, ""); return 1; }'''
replace = '''only a column or a lookup */
        if (!e->method) { pl_fail(p, "no method"); return -1; }'''

[[mutant]]
id = "e-04"
name = "a lookup finds the wrong entry"
test = "player"
why = "The map is sorted."
find = '''                if (c < 0) hi = mid - 1;'''
replace = '''                if (c > 0) hi = mid - 1;'''

[[mutant]]
id = "e-05"
name = "a long value is cut, not refused"
test = "player"
why = "Item 20."
find = '''snprintf(buf, cap, "%s", v->str ? v->str : "") < cap ? 0 : -2;'''
replace = '''snprintf(buf, cap, "%s", v->str ? v->str : "") < cap ? 0 : 0;'''
