# ysp/trials.h mutants: the v0.1 core (which the v0.1 pins must catch) and
# the v0.2 sampling, groups, units, balance, Latin squares, rules text and
# snapshot. docs/trials.md lists the results.
header = "ysp/trials.h"

[test.trials]
source = "tests/adapt/trials_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 300

# --- v0.1 core: the pins (tests/adapt/trials_pins.h) catch these ------

[[mutant]]
id = "core-01"
name = "repair tries 64 -> 63"
test = "trials"
why = "The partner search of every repair, v0.1 included: any change moves v0.1 orders, which the pins forbid."
find = '#define YTR__REPAIR_TRIES 64'
replace = '#define YTR__REPAIR_TRIES 63'

[[mutant]]
id = "core-02"
name = "v0.1 partner start k + s"
test = "trials"
why = "The v0.1 repair's partner search starts one slot later than the draw says."
find = 'j = (k + 1 + (s + step) % (n - 1)) % n;'
replace = 'j = (k + (s + step) % (n - 1)) % n;'

[[mutant]]
id = "core-03"
name = "Fisher-Yates draws below i"
test = "trials"
why = "The shuffle never leaves an item in place: a biased order, and v0.1 orders change."
find = '''
        j = ytr__draw(t, i + 1);
        tmp = a[i]; a[i] = a[j]; a[j] = tmp;'''
replace = '''
        j = ytr__draw(t, i);
        tmp = a[i]; a[i] = a[j]; a[j] = tmp;'''

[[mutant]]
id = "core-04"
name = "max_run counts one short"
test = "trials"
why = "A run of n + 1 would pass the check."
find = 'for (j = k - 1; j >= seg && cnt <= c->n; j--) {'
replace = 'for (j = k - 1; j >= seg && cnt < c->n; j--) {'

[[mutant]]
id = "core-05"
name = "window one trial short"
test = "trials"
why = "max_in_window looks at w - 1 trials, so a window of w can hold n + 1."
find = 'lo = k - c->window + 1;'
replace = 'lo = k - c->window + 2;'

[[mutant]]
id = "core-06"
name = "snapshot writes n_run for n_done"
test = "trials"
why = "A format-1 snapshot must keep its v0.1 bytes, and load() would restore a wrong count."
find = 'ytr__put_i32(w, t->n_done, "n_done");'
replace = 'ytr__put_i32(w, t->n_run, "n_done");'

# --- v0.2 sampling and groups -------------------------------------------------

[[mutant]]
id = "s-01"
name = "draws: >= in the bisection"
test = "trials"
why = "Row c owns [cum[c-1], cum[c]); >= gives a variate on a running sum to the row before, which can be a zero-weight row (u = 0 does it). The test draws with u fixed at 0 and 0.5."
find = 'if (ytr__cum_get(t, mid) > x) hi = mid;'
replace = 'if (ytr__cum_get(t, mid) >= x) hi = mid;'

[[mutant]]
id = "s-02"
name = "subset: partial Fisher-Yates one short"
test = "trials"
why = "The last eligible row could never be kept: inclusion is no longer uniform."
find = 'j = i + ytr__draw(t, m - i);'
replace = 'j = i + ytr__draw(t, m - i - 1);'

[[mutant]]
id = "s-03"
name = "alternate: groups out of their order"
test = "trials"
why = "ALTERNATE must cycle the groups in the drawn group order."
find = 'for (gi = 0; gi < ng; gi++) base[k * ng + gi] = tmp[gl[order[gi]] + k];'
replace = 'for (gi = 0; gi < ng; gi++) base[k * ng + gi] = tmp[gl[order[(gi + 1) % ng]] + k];'

[[mutant]]
id = "s-04"
name = "groups LIST: a missing group is not an error"
test = "trials"
why = "A group with trials left out of groups.list must fail open(), not run last or vanish."
find = '''
            if (present[l] == 1) {
                memset(present, 0, sizeof(int32_t) * (size_t)nlev);'''
replace = '''
            if (false) {
                memset(present, 0, sizeof(int32_t) * (size_t)nlev);'''

[[mutant]]
id = "t-01"
name = "table levels read 8 bits"
test = "trials"
why = "A level number is 16-bit: a column with more than 256 levels would alias its levels."
find = 'return (int)p[2 * c] | (int)p[2 * c + 1] << 8;'
replace = 'return (int)p[2 * c];'

# --- units ----------------------------------------------------------------------

[[mutant]]
id = "u-01"
name = "unit move: the closing gap is not checked"
test = "trials"
why = "The move repair checks the moved trials and the slot that closes the gap; without the second check it takes moves that break a rule there and needs more of them, which changes the orders the v0.2 digest pins."
find = 'if (fits && g < hi && ytr__violation(t, seq, lo, g) >= 0) fits = false;'
replace = ''

[[mutant]]
id = "u-02"
name = "a track trial inside a unit"
test = "trials"
why = "Inside a unit the next trial of the unit must run; a track trial would split prime and target."
find = 'if (in_unit) use_track = false;'
replace = 'if (false) use_track = false;'

[[mutant]]
id = "u-03"
name = "a block starts inside a unit"
test = "trials"
why = "A rest screen (and warmups) between prime and target."
find = 'if (in_unit) starts_block = false;'
replace = 'if (false) starts_block = false;'

[[mutant]]
id = "u-04"
name = "re-queue copies one trial, not the unit"
test = "trials"
why = "A re-queued target would come back without its prime."
find = '''
    len = ue - us;
    left = t->n_scheduled - t->schedule_pos;'''
replace = '''
    us = cur;
    ue = cur + 1;
    len = 1;
    left = t->n_scheduled - t->schedule_pos;'''

[[mutant]]
id = "u-05"
name = "chunk joins rows that are not next to each other"
test = "trials"
why = "A chunk is contiguous rows; joining across a gap makes units of the wrong rows."
find = 'if (b == a + 1 && ytr__touches(t, r, a) &&'
replace = 'if (ytr__touches(t, r, a) &&'

# --- balance ---------------------------------------------------------------------

[[mutant]]
id = "b-01"
name = "tree arc not last"
test = "trials"
why = "Kandel's method needs each level's tree arc last, or the walk can end before using every arc."
find = '''
            (void)ytr__swap16(a, j, deg - 1);
            ytr__shuffle2(t, a, NULL, deg - 1);'''
replace = '''
            ytr__shuffle2(t, a, NULL, deg);'''

[[mutant]]
id = "b-02"
name = "the tree points the other way"
test = "trials"
why = "The first entry into w must record w's arc toward the walk's previous vertex (an arborescence toward the start)."
find = 'tw[w] = (int16_t)cur;'
replace = 'tw[w] = (int16_t)w;'

[[mutant]]
id = "b-03"
name = "lead-in not flagged"
test = "trials"
why = "The lead-in would be tallied as an ordinary trial and not marked in the data."
find = 'fl[0] = YTR__SLOT_LEADIN;'
replace = 'fl[0] = 0;'

[[mutant]]
id = "b-04"
name = "a level's trials not shuffled into its places"
test = "trials"
why = "Rows of one level would come in row order; the v0.2 digest pins the order."
find = 'ytr__shuffle2(t, arcs, NULL, k);'
replace = ''

[[mutant]]
id = "b-05"
name = "lead-in tallied"
test = "trials"
why = "The lead-in is an extra trial of one level; tallying it unbalances the counts per condition."
find = 'YTR_FLAG_PRACTICE | YTR_FLAG_WARMUP | YTR_FLAG_LEADIN))) {'
replace = 'YTR_FLAG_PRACTICE | YTR_FLAG_WARMUP))) {'

[[mutant]]
id = "b-06"
name = "backward walk picks the wrong predecessor"
test = "trials"
why = "Without self pairs the walk skips the current level; an off-by-one makes the tree non-uniform or broken."
find = 'w = loops ? j : (j >= cur ? j + 1 : j);'
replace = 'w = loops ? j : (j > cur ? j + 1 : j);'

# --- Latin squares ------------------------------------------------------------------

[[mutant]]
id = "l-01"
name = "odd balanced square not mirrored"
test = "trials"
why = "Williams for odd n needs the reversed rows; without them a pair is adjacent once or three times."
find = 'if (r >= n) {           /* the mirrored half of an odd balanced design */'
replace = 'if (false) {           /* the mirrored half of an odd balanced design */'

[[mutant]]
id = "l-02"
name = "Williams first row off by one"
test = "trials"
why = "0, 1, n-1, 2, n-2, ...: n - j/2 - 1 repeats items."
find = 'else v = (j == 0) ? 0 : (j % 2 == 1 ? (j + 1) / 2 : n - j / 2);'
replace = 'else v = (j == 0) ? 0 : (j % 2 == 1 ? (j + 1) / 2 : n - j / 2 - 1);'

# --- rules text --------------------------------------------------------------------

[[mutant]]
id = "r-01"
name = "no COLUMN=VALUE selectors"
test = "trials"
why = "Every level-specific rule would read as an unknown token."
find = "if (part == 0 && i < n && p[i] == '=') {"
replace = "if (false && part == 0 && i < n && p[i] == '=') {"

[[mutant]]
id = "r-02"
name = "OpenSesame mindist read as a gap"
test = "trials"
why = "mindist counts rows (2 = no immediate repeat); a gap of D is one too strict."
find = 'if (!ytr__rl_add(rl, ytr_min_gap(f, YTR_ANY_LEVEL, x - 1))) return false;'
replace = 'if (!ytr__rl_add(rl, ytr_min_gap(f, YTR_ANY_LEVEL, x))) return false;'

[[mutant]]
id = "r-03"
name = "a statement given twice is accepted"
test = "trials"
why = "A second `order` line would silently win; the user meant one of them."
find = 'if (rl->first[which]) {'
replace = 'if (false) {'

[[mutant]]
id = "r-04"
name = "@participant off by one"
test = "trials"
why = "Participant p must get level p mod n of the column."
find = 'return rl->r->participant % nl;'
replace = 'return (rl->r->participant + 1) % nl;'

# --- snapshot format 2 -------------------------------------------------------------

[[mutant]]
id = "v-01"
name = "format 2 loses blk_next"
test = "trials"
why = "A resumed session with units and block_size would start its blocks on the wrong trials."
find = 'ytr__put_i32(w, t->blk_next, "blk_next");'
replace = 'ytr__put_i32(w, 0, "blk_next");'

# --- jitter (v0.2.1) --------------------------------------------------------------

[[mutant]]
id = "j-01"
name = "first frame rounded down"
test = "trials"
why = "The first frame inside [lo, hi] is the first whose nanoseconds reach lo: k rounded up, or a frame before lo is drawn."
find = 'if (ytr__mul64(q, d2).lo != x.lo || ytr__mul64(q, d2).hi != x.hi) q++;'
replace = ''

[[mutant]]
id = "j-02"
name = "last frame includes one that rounds above hi"
test = "trials"
why = "A frame whose time is hi + 0.5 ns rounds to hi + 1 ns and lies outside; without the -1 it is counted in."
find = '''    if (x.lo == 0) x.hi--;
    x.lo--;'''
replace = ''

[[mutant]]
id = "j-03"
name = "snapped uniform never draws the last frame"
test = "trials"
why = "Every frame inside [lo, hi] is equally likely; n - 1 bins leave the last one out."
find = 'if (p->dist == (int)YTR_JITTER_UNIFORM) return klo + (int64_t)ytr__shr(ytr__mul64(u53, n), 53);'
replace = 'if (p->dist == (int)YTR_JITTER_UNIFORM) return klo + (int64_t)ytr__shr(ytr__mul64(u53, n - 1u), 53);'

[[mutant]]
id = "j-04"
name = "exponential not folded into the interval"
test = "trials"
why = "E mod (hi - lo) is what makes it the truncated exponential; without it draws pass hi."
find = 'return hi > lo ? lo + (int64_t)(g % (uint64_t)(hi - lo)) : lo;'
replace = 'return lo + (int64_t)g;'

[[mutant]]
id = "j-05"
name = "log series with the wrong sign"
test = "trials"
why = "ln(1 + t) alternates; a plus makes every -ln(1 - u) wrong by up to t^2, far beyond 2^-58."
find = 's = (((uint64_t)1 << 63) / (uint64_t)k) - ytr__shr(ytr__mul64(t, s), 63);'
replace = 's = (((uint64_t)1 << 63) / (uint64_t)k) + ytr__shr(ytr__mul64(t, s), 63);'

[[mutant]]
id = "j-06"
name = "frames to ns truncated, not rounded"
test = "trials"
why = "71 frames at 60000/1001 Hz is 1184516666.67 ns: 1184516667, not 1184516666."
find = 'return (int64_t)ytr__div(ytr__add64(x, (uint64_t)num), 2u * (uint64_t)num);'
replace = 'return (int64_t)ytr__div(ytr__add64(x, 0u), 2u * (uint64_t)num);'

[[mutant]]
id = "j-07"
name = "choice never draws the last value"
test = "trials"
why = "Each of the n values is equally likely."
find = 'i = (int)ytr__shr(ytr__mul64(u53, (uint64_t)p->n_values), 53);'
replace = 'i = (int)ytr__shr(ytr__mul64(u53, (uint64_t)p->n_values - 1u), 53);'

[[mutant]]
id = "j-08"
name = "columns ignored at draw time"
test = "trials"
why = "A per-condition interval comes from the trial's row; -1 is a track trial's."
find = 'if (t->n_jit > 0) ytr__jit_draw(t, i, cond);'
replace = 'if (t->n_jit > 0) ytr__jit_draw(t, i, -1);'

[[mutant]]
id = "j-09"
name = "snapshot without the draws"
test = "trials"
why = "A resumed session must log the durations its trials ran with."
find = 'ytr__put(w, (uint64_t)t->jit_raw[i][j], 8, "jitter");'
replace = ';'

[[mutant]]
id = "j-10"
name = "data line without the zero padding"
test = "trials"
why = "0.0123 s must print as 0.012300000, not 0.12300000."
find = 'ytr__cat(&s, ",%lld.%09lld", (long long)(v.ns / 1000000000), (long long)(v.ns % 1000000000));'
replace = 'ytr__cat(&s, ",%lld.%lld", (long long)(v.ns / 1000000000), (long long)(v.ns % 1000000000));'

[[mutant]]
id = "j-11"
name = "the hi column not read"
test = "trials"
why = "The row's hi replaces the jitter's own; without it the rows' intervals are refused or wrong."
find = 'if (q->col[1] >= 0) p->hi = ytr__s_ns(ytb_num(tb, cond, q->col[1]));'
replace = ''

[[mutant]]
id = "j-12"
name = "jitter snapshot of a v0.1 desc saved as format 1"
test = "trials"
why = "Format 4 marks the jitter sections; a v0.1 desc with jitters must not claim format 1."
find = 'return t->v6 ? YTR__SNAP_FORMAT5 : t->n_jit > 0 ? YTR__SNAP_FORMAT4'
replace = 'return t->v6 ? YTR__SNAP_FORMAT5 : (t->n_jit > 0 && t->v2) ? YTR__SNAP_FORMAT4'

[[mutant]]
id = "j-13"
name = "no generator required for jitters"
test = "trials"
why = "A SEQUENTIAL session with jitters draws; open() must refuse it without desc.rng instead of crashing at next()."
find = '''        else if (d->n_jitters > 0)
            why = "jitter draws";'''
replace = ''

[[mutant]]
id = "j-14"
name = "duplicate jitter names accepted"
test = "trials"
why = "Two data-line columns of one name cannot be told apart."
find = '''        if (strcmp(t->jit[k].name, s->name) == 0)
            return ytr__fail(t, "desc.jitters[%d] and [%d] are both named '%s'", k, j, s->name);'''
replace = '''        if (false)
            return ytr__fail(t, "desc.jitters[%d] and [%d] are both named '%s'", k, j, s->name);'''

[[mutant]]
id = "j-15"
name = "pending trial redraws"
test = "trials"
why = "next() returns the pending trial again with no draw; a redraw would shift every later draw and change the trial's logged duration."
find = '''        ytr__info(t, t->current, info);
        return t->current;'''
replace = '''        if (t->n_jit > 0) ytr__jit_draw(t, t->current, t->history[t->current].condition);
        ytr__info(t, t->current, info);
        return t->current;'''

[[mutant]]
id = "j-16"
name = "seconds to ns truncated"
test = "trials"
why = "1.2 s is the double 1.19999999999999996; rounded it is 1200000000 ns, truncated one less."
find = 'return (int64_t)ytr__shr_round(ytr__mul64(m, 1000000000u), 1075 - e);'
replace = 'return (int64_t)ytr__shr(ytr__mul64(m, 1000000000u), 1075 - e);'

[[mutant]]
id = "j-17"
name = "log off by one ln 2"
test = "trials"
why = "The exponent counts from 2^53; one ln 2 short shifts every exponential draw by 0.69 scales."
find = 'acc = ytr__mul64((uint64_t)(53 - e), YTR__LN2_Q63);'
replace = 'acc = ytr__mul64((uint64_t)(52 - e), YTR__LN2_Q63);'

# --- conventions (v0.3.0) -------------------------------------------------
# j-18 (seconds by a product with 1e-9) went with ytr_jitter_value.s: the
# seconds are the bindings' now.

[[mutant]]
id = "conv-01"
name = "close keeps the session"
test = "trials"
why = "A closed handle must answer like a zeroed one; every open has a close."
find = 'if (t) memset(t, 0, sizeof(*t));'
replace = 'if (t) t->error[0] = 0;'

[[mutant]]
id = "conv-02"
name = "YTR_DONE written as a failure"
test = "trials"
why = "ytr_next() returns YTR_DONE (-1) at the end of every session; a message there would bury the real last failure."
find = 'return ytr__note(t, ytr__next(t, info), YTR_DONE, "ytr_next");'
replace = 'return ytr__note(t, ytr__next(t, info), 0, "ytr_next");'

[[mutant]]
id = "conv-03"
name = "a zero nanosecond scale accepted"
test = "trials"
why = "An EXPONENTIAL of mean 0 ns is no distribution; the scale check moved from seconds to ns."
find = 'if (p->dist == (int)YTR_JITTER_EXPONENTIAL && (p->scale < 1 || p->scale > mx))'
replace = 'if (p->dist == (int)YTR_JITTER_EXPONENTIAL && (p->scale < 0 || p->scale > mx))'

# --- data writer (v0.4.0) ------------------------------------------------------

[[mutant]]
id = "d-01"
name = "a lone CR left unquoted"
test = "trials"
why = "A field with a CR and no other special byte would split the record on read; the quoting test has lone CRs."
find = '''if (p[k] == ',' || p[k] == '"' || p[k] == '\n' || p[k] == '\r') { quote = true; break; }'''
replace = '''if (p[k] == ',' || p[k] == '"' || p[k] == '\n') { quote = true; break; }'''

[[mutant]]
id = "d-02"
name = "a quote not doubled"
test = "trials"
why = "RFC 4180 doubles a quote inside a quoted field; one quote ends the field early."
find = '''ytr__dput(w, "\"\"", 2);'''
replace = '''ytr__dput(w, "\"", 1);'''

[[mutant]]
id = "d-03"
name = "an invalid byte passed through"
test = "trials"
why = "ysp/table.h refuses a file with bad UTF-8, so one bad byte in a response string would make the whole file unreadable."
find = '''ytr__dput(w, "\xEF\xBF\xBD", 3);'''
replace = '''ytr__dput(w, s + i, 1);'''

[[mutant]]
id = "d-04"
name = "surrogates taken as UTF-8"
test = "trials"
why = "ED A0 80 encodes a surrogate, which ysp/table.h refuses; the writer must replace it."
find = '''if ((c == 0xE0 && p[1] < 0xA0) || (c == 0xED && p[1] > 0x9F)) return 0;'''
replace = '''if (c == 0xE0 && p[1] < 0xA0) return 0;'''

[[mutant]]
id = "d-05"
name = "time truncated, not rounded"
test = "trials"
why = "1.2345678 s at 3 decimals is 1.235; truncation writes 1.234."
find = '''u = u / scale + (u % scale >= (scale + 1u) / 2u && scale > 1u ? 1u : 0u);'''
replace = '''u = u / scale;'''

[[mutant]]
id = "d-06"
name = "time half rounded down"
test = "trials"
why = "0.0005 s at 3 decimals is 0.001 (half away from zero), not 0.000."
find = '''u = u / scale + (u % scale >= (scale + 1u) / 2u && scale > 1u ? 1u : 0u);'''
replace = '''u = u / scale + (u % scale > (scale + 1u) / 2u && scale > 1u ? 1u : 0u);'''

[[mutant]]
id = "d-07"
name = "a sign on a zero time"
test = "trials"
why = "-0.0004 s at 3 decimals rounds to zero; '-0.000' is a different text for the same value."
find = '''if (neg && u != 0) b[n++] = '-';'''
replace = '''if (neg) b[n++] = '-';'''

[[mutant]]
id = "d-08"
name = "doubles always at 17 digits"
test = "trials"
why = "0.1 would be written 0.10000000000000001: exact, but not the shortest text, which the format test expects."
find = '''        for (prec = 15; prec <= 17; prec++) {
            n = snprintf(b, sizeof(b), "%.*g", prec, x);'''
replace = '''        for (prec = 17; prec <= 17; prec++) {
            n = snprintf(b, sizeof(b), "%.*g", prec, x);'''

[[mutant]]
id = "d-09"
name = "doubles at most 16 digits"
test = "trials"
why = "Some doubles need 17 significant digits to read back; the bit-for-bit read-back of 2000 random doubles finds them."
find = '''        for (prec = 15; prec <= 17; prec++) {
            n = snprintf(b, sizeof(b), "%.*g", prec, x);'''
replace = '''        for (prec = 15; prec <= 16; prec++) {
            n = snprintf(b, sizeof(b), "%.*g", prec, x);'''

[[mutant]]
id = "d-10"
name = "fixed decimals keep the locale's comma"
test = "trials"
why = "Under a decimal-comma locale snprintf writes 0,25, which splits the field; the test writes under German where the C library has it (Windows)."
find = '''    if (n <= 0 || n >= (int)sizeof(b)) return;
    for (i = 0; i < n; i++)
        if (!((b[i] >= '0' && b[i] <= '9') || b[i] == 'e' || b[i] == '-' || b[i] == '+')) b[i] = '.';'''
replace = '''    if (n <= 0 || n >= (int)sizeof(b)) return;'''

[[mutant]]
id = "d-11"
name = "a write with a trial pending"
test = "trials"
why = "A write before update() would pair this trial's values with the previous trial's columns, off by one for the rest of the file."
find = '''if (ytr_n_run(w->trials) != last + 1 || last < w->next_trial) return YTR_ERR_ORDER;'''
replace = '''if (last < w->next_trial) return YTR_ERR_ORDER;'''

[[mutant]]
id = "d-12"
name = "a trial written twice"
test = "trials"
why = "Without the cursor a second write repeats the trial's row."
find = '''if (last >= 0) w->next_trial = last + 1;'''
replace = '''(void)last;'''

[[mutant]]
id = "d-13"
name = "a set value kept for the next row"
test = "trials"
why = "addData semantics: a value set for one row must not leak into the next, where the column is missing."
find = '''        w->col[i].set = false;'''
replace = '''        (void)0;'''

[[mutant]]
id = "d-14"
name = "the int sentinel written"
test = "trials"
why = "YTR_MISSING_INT must be an empty field, not -2147483648."
find = '''have = v != YTR_MISSING_INT; break; }'''
replace = '''have = true; break; }'''

[[mutant]]
id = "d-15"
name = "a name may start with a digit"
test = "trials"
why = "ysp/table.h refuses such a header, so the file would not read back."
find = '''              (i > 0 && c >= '0' && c <= '9')))
            return false;'''
replace = '''              (c >= '0' && c <= '9')))
            return false;'''

[[mutant]]
id = "d-16"
name = "duplicate names accepted"
test = "trials"
