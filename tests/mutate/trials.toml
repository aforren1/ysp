[[mutant]]
id = "d-18"
name = "rows written after a failure"
test = "trials"
why = "After a failed write the file has a hole; later rows would land after it as though nothing were lost. Two guards hold the latch (write() returns early, the spill skips), so the mutant removes both: the first form removed one and survived as equivalent."
find = '''    if (!w->open) return YTR_ERR_CLOSED;
    if (w->io_failed) return YTR_ERR_IO;
    if (!row)'''
replace = '''    if (!w->open) return YTR_ERR_CLOSED;
    if (!row)'''
also = [ { find = '''    if (!w->io_failed) {
        bool ok;''', replace = '''    if (true) {
        bool ok;''' } ]

[[mutant]]
