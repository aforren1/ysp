# v0.11.0: the glx- mutants run tests/adapt/screen_glx_test.c, which needs
# an X session with Mesa and takes the screen for about 7 s per mutant.
# Set YSP_SDL3 to an SDL3 install prefix (3.4.18 or later on Xfwm4: 3.4.0
# can end the process on an X error, docs/screen.md). Run them with -j 1.

# ysp/screen.h mutants: the v0.3.1 list (aborts, panic, icon), the 12 of the
# 41 that ysp/screen.h's header comment counts, v0.3.2's 2 (text input,
# both killed on 2026-10-07), v0.3.3's 5 (input), v0.3.4's 3 (devices),
# v0.3.5's 5 (raw mice; the 2 on its queue went with the queue),
# v0.4.0's 6 (the input bridge), v0.4.1's 15 (the key filter, kd-) and
# v0.4.2's 3 (kd-16 to kd-18, the key-up fix) and 13 (the sync guard,
# sg-), v0.4.3's 9 (eg-, held frames), v0.4.4's 20 (dp-, the depth policy, the guessed grid, early flips), v0.5.0's 20 (st-, settling at open), v0.5.1's 7 (fg-, the foreground and the slot held after settling), v0.5.2's 7 (ch-, the context hook; ch-06 runs the gfx test), v0.6.0's 2 (cv-, the messages), v0.10.0's 19 (wt-, the window thread; wt-20 on run tests/adapt/screen_window_test.c on real windows), v0.10.1's 4 (gp-, the grid after a gap), v0.10.2's 1 (fg-08, the next screen's raise, on real windows), v0.10.3's 1 (bf-01, GL between frames on COMPOSITION), v0.10.4's 5 (lk-01, lk-02, the handles; bf-02, bf-03, no free buffer; ds-01, display ids), v0.11.0's 10 (mt-, the METAL backend; mt-08 to mt-10 on run tests/adapt/screen_metal_test.c on a Mac). The 29 earlier mutants (docs/screen.md,
# "Mutations") were run from scripts that were not kept.
header = "ysp/screen.h"

[test.screen]
source = "tests/adapt/screen_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w"]
libs = ["-lm"]
timeout = 300

# The gfx test sees what only a GL context shows (ch-06).
[test.gfx]
source = "tests/adapt/gfx_test.c"
compiler = "msvc"
flags = ["/O1", "/W3", "/D_CRT_SECURE_NO_WARNINGS"]
timeout = 600
env_default = { YSCR_ANGLE_DIR = "C:/Program Files/Docker/Docker/frontend" }

# The window thread on real windows (wt-20 on): this machine's SDL3 VC
# package, ANGLE and display; Windows only. PATH holds SDL3.dll's
# directory and the system's, nothing else.
# Run these with -j 1: in parallel, one test's window takes the
# foreground from another and the text case's keys miss it.
[test.window]
source = "tests/adapt/screen_window_test.c"
compiler = "msvc"
flags = ["/O1", "/W3", "/D_CRT_SECURE_NO_WARNINGS", "/IC:/sdk/SDL3-3.4.0/include"]
libs = ["C:/sdk/SDL3-3.4.0/lib/x64/SDL3.lib", "user32.lib"]
timeout = 300
env_default = { YSCR_ANGLE_DIR = "C:/Program Files/Docker/Docker/frontend" }
env = { PATH = "C:/sdk/SDL3-3.4.0/lib/x64;C:/Windows/System32;C:/Windows" }

[test.screen_glx]
source = "tests/adapt/screen_glx_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-I$YSP_SDL3/include"]
libs = ["-L$YSP_SDL3/lib", "-Wl,-rpath,$YSP_SDL3/lib", "-lSDL3", "-lm", "-lpthread", "-ldl"]
timeout = 120
env = { YSCR_GLX_TEST_REQUIRE = "1" }

[[mutant]]
id = "abort-00"
name = "repeats count"
test = "screen"
why = "Key auto-repeat while the combination is held must not count as more presses (Shift+Esc held with 8 repeats is one abort)."
find = 'int press = down && !*held;'
replace = 'int press = down;'

[[mutant]]
id = "abort-01"
name = "mods ignored"
test = "screen"
why = "The abort needs its modifiers; Esc alone is not an abort."
find = 'if ((mods & yscr__ab.mods) != yscr__ab.mods) return 0;'
replace = ''

[[mutant]]
id = "abort-02"
name = "reported every begin"
test = "screen"
why = "An abort is an edge: reported once, not at every begin()."
find = '''
    s->abort_seen = k - 1;
    if (!mask) return 0;'''
replace = '    if (!mask) return 0;'

[[mutant]]
id = "abort-03"
name = "group begins member 0 first"
test = "screen"
why = "A group's begin must report an abort pending on any member, not only the first."
find = '    for (i = 0; i < n && !yscr__abort_pending(s[i]) && !yscr__released_on(s[i]); i++) { }'
replace = '    i = n;'

[[mutant]]
id = "abort-04"
name = "panic ignores the ack"
test = "screen"
why = "The panic watchdog must not fire when the program acknowledged the abort within the grace period."
find = 'return n >= yscr__ab.presses && (ack == 0 || t - ack > yscr__ab.grace_ns);'
replace = 'return n >= yscr__ab.presses;'

[[mutant]]
id = "abort-05"
name = "panic ignores the window"
test = "screen"
why = "The panic needs its presses within the window, not spread over the whole run."
find = 't - yscr__ab.press[i] < yscr__ab.window_ns) n++;'
replace = '1) n++;'

[[mutant]]
id = "abort-06"
name = "dedup off"
test = "screen"
why = "One physical press seen by two input paths must count once."
find = '    if (!(yscr__ab.last_t && t - yscr__ab.last_t'
replace = '    if (1 || !(yscr__ab.last_t && t - yscr__ab.last_t'

[[mutant]]
id = "abort-07"
name = "MOD_NONE read as shift"
