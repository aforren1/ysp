# --- v0.4.1: the second-report filter (INPUT, "Second key reports"; was
# ysp/response.h's R3 and its d-01 to d-04) ----------------------------------

[[mutant]]
id = "kd-01"
name = "window inclusive"
test = "screen"
why = "Two key-downs exactly the window apart are two presses."
find = '        if (dt >= win || dt <= -win) continue;'
replace = '        if (dt > win || dt < -win) continue;'

[[mutant]]
id = "kd-02"
name = "window one direction"
test = "screen"
why = "The message report can be stamped before the raw one (a tick-quantized time)."
