replace = '    if (e->kind != YIN_KIND_KEYBOARD) return 1;'

[[mutant]]
id = "kd-10"
name = "every kind filtered"
test = "screen"
why = "The double report is the keyboard's; a mouse's two clicks 5 ms apart are two clicks."
find = '    if (e->kind != YIN_KIND_KEYBOARD || win <= 0) return 1;'
replace = '    if (win <= 0) return 1;'

[[mutant]]
id = "kd-11"
name = "desc 0 is off"
