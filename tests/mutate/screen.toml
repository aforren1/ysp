# v0.11.0's 10 (mt-, the METAL backend), v0.12.0's 3 (mt-11 to mt-13, the
# measured constants) and v0.13.0's 3 (mt-14 to mt-16, variable refresh) and v0.13.1's 2 (mt-17, mt-18, the
# period from CADisplayLink). mt-01 to mt-07 and mt-11 to mt-13 run the core test
# on any platform; mt-08 to mt-10 run tests/adapt/screen_metal_test.c on
# this Mac's window server with ANGLE (the screen may be locked: the sync
# and code read-backs run without a shown frame).
[test.metal]
source = "tests/adapt/screen_metal_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-fblocks", "-I/Users/brainworks/sdl3/include"]
libs = ["-L/Users/brainworks/sdl3/lib", "-lSDL3", "-Wl,-rpath,/Users/brainworks/sdl3/lib", "-lm",
        "-framework", "ApplicationServices", "-lobjc"]
timeout = 300
env_default = { YSCR_ANGLE_DIR = "/Users/brainworks/ysp-deps/angle-electron-43.8.3" }

[[mutant]]
id = "mt-01"
