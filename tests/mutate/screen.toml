find = '#define YSCR__MTL_TARGET_LEAD 0.5'
replace = '#define YSCR__MTL_TARGET_LEAD 1.0'

[[mutant]]
id = "mt-02"
name = "target after the planned vblank"
test = "screen"
why = "A target after the planned vblank shows a vblank late on a display that shows the first vblank at or after it."
find = '#define YSCR__MTL_TARGET_LEAD 0.5'
replace = '#define YSCR__MTL_TARGET_LEAD -0.25'

[[mutant]]
id = "mt-03"
name = "tier 1 without a photodiode"
test = "screen"
why = "presentedTime is an OS time for the vblank shown (tier 2); tier 1 needs a photodiode run and a path the header can verify (TIERS; docs/screen_macos_probe.md)."
