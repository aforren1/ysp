# --- v0.4.1: the second-report filter (INPUT, "Second key reports"; was
# ysp/response.h's R3 and its d-01 to d-04) ----------------------------------

[[mutant]]
id = "kd-01"
name = "window inclusive"
test = "screen"
why = "Two key-downs exactly the window apart are two presses."
find = '        if (dt >= win || dt <= -win) continue;'
replace = '        if (dt > win || dt < -win) continue;'

[[mutant]]
id = "kd-02"
name = "window one direction"
test = "screen"
why = "The message report can be stamped before the raw one (a tick-quantized time)."
find = '        if (dt >= win || dt <= -win) continue;'
replace = '        if (dt >= win || dt < 0) continue;'

[[mutant]]
id = "kd-03"
name = "default 30 ms"
test = "screen"
why = "A second report came 34.2 ms after the first in the measurement; 30 ms would pass it as a press."
find = '#define YSCR__KEY_DEDUP_NS  50000000'
replace = '#define YSCR__KEY_DEDUP_NS  30000000'

[[mutant]]
id = "kd-04"
name = "repeats dropped"
test = "screen"
why = "An OS repeat is SDL's mark of a held key; the consumer's held-key rule reads it, so it must pass."
find = '    if (e->type != YIN_PRESS || (e->flags & YIN_REPEAT)) return 1;'
replace = '    if (e->type != YIN_PRESS) return 1;'

[[mutant]]
id = "kd-05"
name = "dropped report's key-up passes"
test = "screen"
why = "The consumer must see one key-down and one key-up per press."
find = '''            yscr__a_inc(&yscr__in.key_double_ups);
            return 0;'''
replace = '''            yscr__a_inc(&yscr__in.key_double_ups);
            return 1;'''

[[mutant]]
id = "kd-06"
name = "keyboards merged"
test = "screen"
why = "Two keyboards pressing one key within 50 ms are two participants, two presses."
find = 'static int yscr__key_dev(uint32_t a, uint32_t b) { return a == b || a == 0 || b == 0; }'
replace = 'static int yscr__key_dev(uint32_t a, uint32_t b) { (void)a; (void)b; return 1; }'

[[mutant]]
id = "kd-07"
name = "device 0 not a wildcard"
test = "screen"
why = "The raw report has the keyboard's id and the message report 0: one press."
find = 'static int yscr__key_dev(uint32_t a, uint32_t b) { return a == b || a == 0 || b == 0; }'
replace = 'static int yscr__key_dev(uint32_t a, uint32_t b) { return a == b; }'

[[mutant]]
id = "kd-08"
name = "one report decoded twice is dropped"
test = "screen"
why = "Two calls on one SDL event must give the event twice, not drop it as its own second report."
find = '        if (dt == 0 && k->device == e->device) return 1;      /* the kept report again */'
replace = ''

[[mutant]]
id = "kd-09"
name = "off ignored"
test = "screen"
why = "desc.key_dedup_ns < 0 gives every report as SDL gave it."
