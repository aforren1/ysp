name = "the OS's count"
test = "screen"
why = "DXGI's refresh count lost a vblank about 1 in 25 held frames; on its count, on-time frames were flagged EARLY (145 of 1200 on hardware)."
find = '''
            count = nc;
            yscr__anchor(s, t, count, 0);'''
replace = '''
            count = v->count;
            yscr__anchor(s, t, count, 0);'''

[[mutant]]
id = "eg-02"
name = "anchor on any time"
test = "screen"
why = "A grid moved to an off-grid OS time wakes the next hold before the real vblank, and that frame shows a vblank early (63 of 1200 on hardware)."
