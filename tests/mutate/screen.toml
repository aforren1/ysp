[[mutant]]
id = "br-00"
name = "overwrites not counted"
test = "screen"
why = "A record overwritten before anyone decoded it is a lost event; the ring record and the stats must count it (v0.4.0)."
find = '    if (yscr__a_load(&sl->state) == 1) yscr__a_inc(&yscr__in.overwritten);'
replace = ''

[[mutant]]
id = "br-01"
name = "decode ignores the sequence"
test = "screen"
why = "A doorbell must find its own record: decoded late or out of order, it must not take another producer's (v0.4.0)."
find = '''    if (yscr__a_load(&sl->seq) != seq) return 0;
    copy = sl->e;
    o = sl->origin;
    if (yscr__a_load(&sl->seq) != seq) return 0;           /* torn: rewritten meanwhile */'''
replace = '''    copy = sl->e;
    o = sl->origin;'''
[[mutant.also]]
find = '''    if (!yscr__a_cas(&sl->state, 1, 2)) return yscr__a_load(&sl->seq) == seq ? -1 : 0;
    if (yscr__a_load(&sl->seq) != seq) return 0;'''
replace = '''    if (!yscr__a_cas(&sl->state, 1, 2)) return yscr__a_load(&sl->seq) == seq ? -1 : 0;'''

[[mutant]]
id = "br-02"
name = "a record decoded twice"
test = "screen"
why = "Each record is delivered once; a second decode of its doorbell must return nothing (v0.4.0)."
find = '    if (!yscr__a_cas(&sl->state, 1, 2)) return yscr__a_load(&sl->seq) == seq ? -1 : 0;'
replace = '    yscr__a_store(&sl->state, 2);'

[[mutant]]
id = "br-03"
name = "refused doorbells never rung again"
test = "screen"
why = "When SDL's queue is full, the record waits and its doorbell must be pushed again, or the event never reaches the loop (v0.4.0)."
find = '        if (!YSCR__DOORBELL(seq)) { waiting = 1; break; }'
replace = '        waiting = 1; break;'

[[mutant]]
id = "br-04"
name = "lost decodes not counted"
test = "screen"
why = "A doorbell whose record was overwritten is a lost event; the count goes in the ring record (v0.4.0)."
