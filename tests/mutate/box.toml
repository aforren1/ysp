# ysp/box.h mutants: the XID frame and timer answer, the line protocol's
# rules, the photodiode frame, resynchronization and the output reserve;
# since v0.2.0 the StimTracker 2 frame, the O report and the encoders.
# docs/box.md lists the results.
header = "ysp/box.h"

[test.box]
source = "tests/adapt/box_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 120

[[mutant]]
id = "box-01"
name = "XID key 0 kept as 0"
test = "box"
why = "pyxid2 maps key 0 to 8: an RB-x40's eighth button would be lost."
find = '''(info & 0x10u) ? (uint8_t)YIN_PRESS : (uint8_t)YIN_RELEASE,
                                           key == 0 ? 8u : key);'''
replace = '''(info & 0x10u) ? (uint8_t)YIN_PRESS : (uint8_t)YIN_RELEASE,
                                           key);'''

[[mutant]]
id = "box-02"
name = "XID port bits not checked"
test = "box"
why = "pyxid2 rejects a frame with port bits 2 or 3 set; without the check a shifted stream gives false presses."
find = '''            if (d->n < 6) return (d->n >= 2 && (b[1] & 0x0Cu) != 0) ? -1 : 0;'''
replace = '''            if (d->n < 6) return 0;'''

[[mutant]]
id = "box-03"
name = "XID press bit inverted"
test = "box"
why = "Bit 4 set is a press; inverted, every RT is from the release."
find = '''                yin_event* e = ybox__event(d, out, t, ms, (info & 0x10u) ? (uint8_t)YIN_PRESS : (uint8_t)YIN_RELEASE,'''
replace = '''                yin_event* e = ybox__event(d, out, t, ms, (info & 0x10u) ? (uint8_t)YIN_RELEASE : (uint8_t)YIN_PRESS,'''

[[mutant]]
id = "box-04"
name = "big-endian time"
test = "box"
why = "XID and the photodiode frame send the time little-endian ('<I')."
find = '''    return (uint32_t)b[0] | ((uint32_t)b[1] << 8) | ((uint32_t)b[2] << 16) | ((uint32_t)b[3] << 24);'''
replace = '''    return (uint32_t)b[3] | ((uint32_t)b[2] << 8) | ((uint32_t)b[1] << 16) | ((uint32_t)b[0] << 24);'''

[[mutant]]
id = "box-05"
name = "timer answer not checked for '5'"
test = "box"
why = "Only '_e5' carries the timer; another '_' answer read as one gives a false pair."
find = '''        if (d->n >= 3 && b[2] != '5') return -1;'''
replace = ''

[[mutant]]
id = "box-06"
name = "no resync inside a broken frame"
test = "box"
why = "A frame that starts inside a broken one must be found; dropping the whole broken frame loses it."
find = '''            for (k = 0; k < m; k++) rest[k] = d->buf[1 + k];'''
replace = '''            m = 0;'''

[[mutant]]
id = "box-07"
name = "line seq 0 accepted"
test = "box"
why = "Query numbers start at 1: 0 means a frame the device sent on its own."
find = '''        if (!ybox__u64(&p, &a) || !ybox__u64(&p, &b) || !ybox__end(p) || a == 0 || a > 0xFFFFFFFFu) return false;'''
replace = '''        if (!ybox__u64(&p, &a) || !ybox__u64(&p, &b) || !ybox__end(p) || a > 0xFFFFFFFFu) return false;'''

[[mutant]]
id = "box-08"
name = "line channel 0 accepted"
test = "box"
why = "Channels are 1 to 255, as XID keys are 1-based."
find = '''        if (b < 1 || b > 255 || c > 1) return false;'''
replace = '''        if (b > 255 || c > 1) return false;'''

[[mutant]]
id = "box-09"
name = "line u64 overflow wraps"
test = "box"
why = "A time past 64 bits is garbage, not a small time."
find = '''        if (v > (UINT64_MAX - dgt) / 10u) return false;'''
replace = ''

[[mutant]]
id = "box-10"
name = "trailing fields accepted"
test = "box"
why = "A line with an extra field is not the protocol: a future version or noise."
find = '''        if (!ybox__u64(&p, &a) || !ybox__u64(&p, &b) || !ybox__u64(&p, &c) || !ybox__end(p)) return false;'''
replace = '''        if (!ybox__u64(&p, &a) || !ybox__u64(&p, &b) || !ybox__u64(&p, &c)) return false;'''

[[mutant]]
id = "box-11"
name = "one past the output"
test = "box"
why = "The caller's arrays have cap entries; one more is a write past them."
find = '''        if (out->n_ev >= out->ev_cap || out->n_pair >= out->pair_cap || out->has_out) break;'''
replace = '''        if (out->n_ev > out->ev_cap || out->n_pair > out->pair_cap || out->has_out) break;'''

[[mutant]]
id = "box-12"
name = "photo level 2 accepted"
test = "box"
why = "Level is 0 or 1; anything else is a misaligned stream."
find = '''    if (d->n >= 2 && b[1] > 1u) return -1;'''
replace = ''

[[mutant]]
id = "box-13"
name = "an overlong line not dropped"
test = "box"
why = "The rest of an overlong line would be read as a new line."
find = '''            d->n = 0;
            d->skip = 1;
            continue;'''
replace = '''            d->n = 0;
            continue;'''

[[mutant]]
id = "box-14"
name = "XID mh bytes high first"
test = "box"
why = "pyxid2 sends 'mh' + chr(lo) + chr(hi): swapped bytes raise the wrong lines."
find = '''        buf[n + 2] = (uint8_t)(code & 0xFFu);
        buf[n + 3] = (uint8_t)(code >> 8);'''
replace = '''        buf[n + 2] = (uint8_t)(code >> 8);
        buf[n + 3] = (uint8_t)(code & 0xFFu);'''

[[mutant]]
id = "box-15"
name = "XID width truncated to ms"
test = "box"
why = "A 4.6 ms pulse is nearer 5 ms than 4 ms."
find = '''        uint32_t ms = (uint32_t)((width_ns + 500000) / 1000000);'''
replace = '''        uint32_t ms = (uint32_t)(width_ns / 1000000);'''

[[mutant]]
id = "box-16"
name = "XID pulse of 0 ms"
test = "box"
why = "Cedrus: mp 0 makes mh hold the lines; a short pulse would never end."
find = '''        if (op == YBOX_OP_PULSE && ms == 0) ms = 1;'''
replace = ''

[[mutant]]
id = "box-17"
name = "TriggerBox closed with 0"
test = "box"
why = "Brain Products: write 0xFF to reset the output lines to their default levels when finished."
find = '''        buf[0] = 0xFF;            /* the box's default levels */'''
replace = '''        buf[0] = 0x00;            /* the box's default levels */'''

[[mutant]]
id = "box-18"
name = "StimTracker 2 null byte not checked"
test = "box"
why = "The terminating 0 is how a misaligned 'o' frame shows."
find = '''            if (b[8] != 0u) return -1;'''
replace = ''

[[mutant]]
id = "box-19"
name = "StimTracker 2 press inverted"
test = "box"
why = "'1' is pressed (pyxid2: pressed == b'1')."
find = '''                int pressed = b[3] == '1';'''
replace = '''                int pressed = b[3] == '0';'''

[[mutant]]
id = "box-20"
name = "decoding goes on after an O report"
test = "box"
why = "ybox_out holds one report: a second O line in the same call would overwrite the first."
find = '''        if (out->n_ev >= out->ev_cap || out->n_pair >= out->pair_cap || out->has_out) break;'''
replace = '''        if (out->n_ev >= out->ev_cap || out->n_pair >= out->pair_cap) break;'''

[[mutant]]
id = "box-21"
name = "output-only families decoded as photodiode frames"
test = "box"
why = "A TriggerBox's input byte is not a photodiode frame; it must give no event and no pair."
find = '''        if (!(ybox_caps(d->family) & YBOX_CAP_IN)) {
            /* an output-only family: nothing to decode */'''
replace = '''        if (0) {
            /* an output-only family: nothing to decode */'''

[[mutant]]
id = "box-22"
name = "DTR and RTS take a byte"
test = "box"
why = "The serial-lines family has two outputs: a code above 3 names lines that do not exist."
find = '''    if (family == YBOX_LINES) return 3u;'''
replace = '''    if (family == YBOX_LINES) return 255u;'''

[[mutant]]
id = "box-23"
name = "single-byte boxes claim a device-timed pulse"
test = "box"
why = "No TriggerBox, BioSemi, MMBT-S or parallel port times a pulse of a chosen width; the host must."
find = '''    if (op == YBOX_OP_PULSE) return 0;
    if (cap < 1) return YBOX_ERR_ARG;'''
replace = '''    if (cap < 1) return YBOX_ERR_ARG;'''

[[mutant]]
id = "box-24"
name = "O report with a code past 32 bits"
test = "box"
why = "A report's code is a 32-bit output state; more digits are a broken line."
find = '''        if (!ybox__u64(&p, &a) || !ybox__u64(&p, &b) || !ybox__end(p) || b > 0xFFFFFFFFu) return false;
        ybox__pair(out, a, 0);
        out->has_out = 1;'''
replace = '''        if (!ybox__u64(&p, &a) || !ybox__u64(&p, &b) || !ybox__end(p)) return false;
        ybox__pair(out, a, 0);
        out->has_out = 1;'''

[[mutant]]
id = "box-25"
name = "width not range-checked (v0.3.0)"
test = "box"
why = "A negative width_ns or one past the 32-bit wire field would wrap into a different pulse instead of failing."
find = '''    if (op != YBOX_OP_SET && (width_ns < 0 || width_ns > (int64_t)0xFFFFFFFF * 1000)) return YBOX_ERR_ARG;'''
replace = ''

[[mutant]]
id = "box-26"
name = "LINE pulse width rounded up, not to the nearest us (v0.3.0)"
test = "box"
why = "width_ns goes to the board's whole microseconds, rounded to the nearest: rounding up makes 499 ns a 1 us pulse instead of an error."
find = '''            int64_t us = (width_ns + 500) / 1000;'''
replace = '''            int64_t us = width_ns / 1000 + (width_ns % 1000 != 0);'''
