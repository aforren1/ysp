# ysp/audio.h mutants: the v0.2.1 list, yau_wav_probe() and the parse split
# it made (docs/audio.md, "The WAV probe"). Earlier lists were not kept.
header = "ysp/audio.h"

[test.audio]
source = "tests/adapt/audio_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 300

[[mutant]]
id = "p-01"
name = "the probe checks the device rate"
test = "audio"
why = "The probe has no device; the caller compares the rate with the project's. A 44100 Hz file must give its info, not a refusal."
find = '''    rc = yau__wav_scan(&src, info, err, cap);
    yau__wsrc_close(&src);'''
replace = '''    rc = yau__wav_scan(&src, info, err, cap);
    if (rc == 0 && info->rate != 48000) rc = YAU_ERR_FORMAT;
    yau__wsrc_close(&src);'''

[[mutant]]
id = "p-02"
name = "the scan leaves the info empty"
test = "audio"
why = "The probe reports rate, channels and frames from the scan."
find = '''    out->frames = data_size / block;
    out->channel_mask = mask;'''
replace = '''    out->frames = 0;
    out->channel_mask = mask;'''

[[mutant]]
id = "p-03"
name = "the open skips the device checks"
test = "audio"
why = "After the split, yau_wav_open() must still refuse a rate that is not the device's."
find = '''    if (rc < 0) return rc;
    rate = out->rate;'''
replace = '''    if (rc < 0) return rc;
    return 0;
    rate = out->rate;'''

[[mutant]]
id = "p-04"
name = "the probe leaves a path open"
test = "audio"
why = "The probe opens and closes a path; a file left open cannot be removed on Windows."
find = '''    rc = yau__wav_scan(&src, info, err, cap);
    yau__wsrc_close(&src);
    return rc;'''
replace = '''    rc = yau__wav_scan(&src, info, err, cap);
    return rc;'''

# v0.3.0: the WASAPI shared queue (docs/audio.md, "Periods and buffers").
# The gate's wait on the WASAPI event and the exclusive one-period buffer
# run only on hardware; audio_clockstats --queue and --exclusive measure
# them, so they have no mutant here.

[[mutant]]
id = "q-01"
name = "queue 3 accepted"
test = "audio"
why = "A queue of 3 periods does not fit a 1056-frame buffer; the open must refuse it, not run ungated."
find = '''|| d.queue < 0 || d.queue > 2) {'''
replace = '''|| d.queue < 0 || d.queue > 3) {'''

[[mutant]]
id = "q-02"
name = "no default queue"
test = "audio"
why = "A zeroed desc must get the measured default of 2 periods, not miniaudio's own order, which costs 10 ms of lead."
find = '''    if (!d.queue) d.queue = 2;'''
replace = ''''''

[[mutant]]
id = "q-03"
name = "queue not passed to the device"
test = "audio"
why = "The device, not the core, keeps the queue; it must receive desc.queue."
find = '''    in.queue = d.queue;'''
replace = '''    in.queue = 0;'''

[[mutant]]
id = "q-04"
name = "gate threshold one period high"
test = "audio"
why = "The gate opens at queue - 1 periods left in the buffer; one more keeps an extra period queued, 10 ms more lead."
find = '''     ? -1 : ((queue) - 1) * (period))'''
replace = '''     ? -1 : (queue) * (period))'''

[[mutant]]
id = "q-05"
name = "gate without the room check"
test = "audio"
why = "Without room for a period when the gate opens, miniaudio waits on the event the gate already took and the stream stalls."
find = '''     || (int64_t)(buffer) - (period) < (int64_t)((queue) - 1) * (period)              \
'''
replace = ''''''

[[mutant]]
id = "q-06"
name = "gate in exclusive mode"
test = "audio"
why = "Exclusive mode takes a whole buffer per event; a padding gate there would wait on the wrong condition."
find = '''    ((exclusive) || (queue) <= 0 || (period) <= 0                                     \'''
replace = '''    ((queue) <= 0 || (period) <= 0                                                   \'''

[[mutant]]
id = "q-07"
name = "caps.queue not reported"
test = "audio"
why = "The describe line and yau_get_caps() must say which queue ran, so a log shows the lead it had."
find = '''    out->queue = au->dcaps.queue;'''
replace = ''''''

# v0.3.1: an underrun of about a period, found from reports that stay late
# against the fit (docs/audio.md, "Halts"). test_halt in the core test.

[[mutant]]
id = "h-01"
name = "late threshold two periods"
test = "audio"
why = "A halt of one period makes every later report a period late; a threshold above that never sees it, and later onsets are off by the halt while they say tier 2."
find = '''            double half = 0.5 * (double)au->dcaps.period * au->fit.k;
            if (r > half) {'''
replace = '''            double half = 0.5 * (double)au->dcaps.period * au->fit.k;
            if (r > 4.0 * half) {'''

[[mutant]]
id = "h-02"
name = "two late reports make a halt"
test = "audio"
why = "Two reports in a row late by most of a period, with no halt, must not restart the fit or flag sounds."
find = '''#define YAU__HALT_REPORTS 3 '''
replace = '''#define YAU__HALT_REPORTS 2 '''

[[mutant]]
id = "h-03"
name = "an on-time report does not end the run"
test = "audio"
why = "Late reports one at a time, with on-time reports between them, are not a halt."
find = '''            } else {
                au->early_run = 0;
                au->late_run = 0;
            }'''
replace = '''            } else {
                au->early_run = 0;
            }'''

[[mutant]]
id = "h-04"
name = "late reports confirm onsets"
test = "audio"
why = "A report of a halt not yet confirmed must not confirm a sound tier 2 on the old timing."
find = '''            if (pw <= v->start || au->late_run > 0) continue;'''
replace = '''            if (pw <= v->start) continue;'''

[[mutant]]
id = "h-05"
name = "the halt's first report counts in its length"
test = "audio"
why = "The first late report can be the halt half over; the record's halt must come from a report after the device played again."
find = '''                else if (au->late_run == 2 || r < au->late_min) au->late_min = r;'''
replace = '''                if (au->late_run == 1 || r < au->late_min) au->late_min = r;'''

[[mutant]]
id = "h-06"
name = "the fit keeps its points after a halt"
test = "audio"
why = "After a halt every frame plays later by the halt; a fit of the old points puts later onsets off by it."
find = '''                    yau__xrun_rec(au, now_t, 0, 1, (int64_t)au->late_min, au->late_w0, au->late_again);
                    au->first_block = 0;
                    au->fit.w0 = pw; au->fit.t0 = tk->pos_t; au->fit.k = yau__k_nom(au);'''
replace = '''                    yau__xrun_rec(au, now_t, 0, 0, (int64_t)au->late_min, au->late_w0, au->late_again);'''

[[mutant]]
id = "h-07"
name = "the fit starts over on the next callback"
test = "audio"
why = "The sounds the halt moved complete in the callback that finds it; their times must come from the new timing, not the old fit."
find = '''                    au->first_block = 0;
                    au->fit.w0 = pw; au->fit.t0 = tk->pos_t; au->fit.k = yau__k_nom(au);
                } else {'''
replace = '''                } else {'''

[[mutant]]
id = "h-08"
name = "the XRUN record without the halt"
test = "audio"
why = "The record says how long the device stood, so the analysis can move the times of what played after it."
find = '''    u.i64[2] = halt_ns;'''
replace = '''    u.i64[2] = 0;'''

[[mutant]]
id = "h-09"
name = "an underrun counted twice"
test = "audio"
why = "Measured at queue 2: the report before a halt can be early by most of a period, which has its own XRUN record; the halt that follows is the same underrun and must not count again."
find = '''    if (!again) au->xruns++;'''
replace = '''    au->xruns++;'''

# v0.4.0 conventions: messages and a close that never fails.

[[mutant]]
id = "conv-01"
name = "a failing frame-thread call writes no message"
test = "audio"
why = "Every failing call of the frame thread writes yau_error() (README Conventions, Errors)."
find = '    if (rc < 0 && au && au->err_n == n0) yau__err(au, "ysp_audio: %s: %s", what, yau_strerror((int)rc));'
replace = '    (void)n0; (void)what;'

[[mutant]]
id = "conv-02"
name = "close does not cancel a playing stream"
test = "audio"
why = "A close that only waits leaves the play running: the device would read the stream after the caller frees it."
find = '        if (id > 0) (void)yau__cancel_rc(au, id);'
replace = '        (void)id;'

[[mutant]]
id = "conv-03"
name = "a timed-out close frees the arena hold"
test = "audio"
why = "The device may still read a detached stream: an arena ring must stay held until yau_close()."
find = '''
                st->au_ = NULL;   /* detached: memory and hold stay (above) */
                return;'''
replace = '''
                if (st->in_arena_) au->arena_streams--;
                st->in_arena_ = 0;
                st->au_ = NULL;
                return;'''

# v0.5.0: capture (docs/audio.md, "Capture"). The miniaudio input and the
# duplex device run only on hardware (audio_capstats measures them) or on
# the null backend (the compile check), so they have no mutant here.

[[mutant]]
id = "cap-01"
name = "a closed gap carries no frames"
test = "audio"
why = "The capture frames jump by the frames dropped at the gap, so every later sample keeps its frame."
find = '            g->frames = c->gap_frames;'
replace = '            g->frames = 0;'

[[mutant]]
id = "cap-02"
name = "room only for the fastest reader"
test = "audio"
why = "The device must not overwrite what the slowest reader has not read."
find = '        if (p < m) m = p;'
replace = '        if (p > m || m == INT64_MAX) m = p;'

[[mutant]]
id = "cap-03"
name = "dropped frames not counted"
test = "audio"
why = "Every frame the ring had no room for is counted (yau_capture_info.dropped)."
find = '        yau__st64(&c->dropped, c->dropped + (n - k));'
replace = '        (void)k;'

[[mutant]]
id = "cap-04"
name = "a read crosses a gap"
test = "audio"
why = "acquire stops at the next gap, so the frames after it get their jumped frame numbers."
find = '        if (gp - r->pos < n) n = gp - r->pos;'
replace = '        (void)gp;'

[[mutant]]
id = "cap-05"
name = "reports fed whatever their stamp"
test = "audio"
why = "Measured on WASAPI capture, the position moves every 10 ms and its stamp every 20 ms; only a new stamp pairs with its position."
find = '        if (tk->pos_t != c->last_stamp && pw > c->last_pos) {'
replace = '        if (pw > c->last_pos) {'

[[mutant]]
id = "cap-06"
name = "a loss counted at once"
test = "audio"
why = "A stall the device rides out moves q up for a few blocks; only 200 ms of it is a loss."
find = '''            if (now_t - c->loss_since >= YAU__LOSS_NS) {
                int64_t lost'''
replace = '''            if (1) {
                int64_t lost'''

[[mutant]]
id = "cap-07"
name = "a counted loss leaves the frames as they were"
test = "audio"
why = "The frames after a loss are numbered across it, so the fit, on device frames, stays right."
find = '        c->f += lost;'
replace = '        (void)0;'

[[mutant]]
id = "cap-08"
name = "late blocks without reports never restart the fit"
test = "audio"
why = "Without reports, a loss shows only as blocks late against the fit; the fit must start over."
find = '        if (r > 0.5 * (double)period * c->fit.k) {'
replace = '        if (r > 1e18) {'

[[mutant]]
id = "cap-09"
name = "the voice key reports a candidate shorter than min_ns"
test = "audio"
why = "A click is not a voice onset: the level must hold over off_db for min_ns."
find = '            if (f - vk->cand_i_ + 1 >= vk->min_) {'
replace = '            if (1) {'

[[mutant]]
id = "cap-10"
name = "no hysteresis"
test = "audio"
why = "A dip under on_db but over off_db does not end a sound."
find = '    vk->off2_ = yau__db_pow((float)off);'
replace = '    vk->off2_ = yau__db_pow(d->on_db);'

[[mutant]]
id = "cap-11"
name = "the onset is not interpolated"
test = "audio"
why = "The onset is the crossing between frames, as the definition (and ref_onset) puts it."
find = '                vk->cand_ = yau__cross(f, vk->prev_, p, vk->on2_);'
replace = '                vk->cand_ = (double)f;'

[[mutant]]
id = "cap-12"
name = "an edge without a crossing"
test = "audio"
why = "A level held past the dead time is one edge, not one per dead time."
find = '        if (a >= e->level_ && a0 < e->level_ && f >= e->until_) {'
replace = '        if (a >= e->level_ && f >= e->until_) {'

[[mutant]]
id = "cap-13"
name = "no dead time"
test = "audio"
why = "A click's ringing must not be a second edge."
find = '            e->until_ = f + e->dead_;'
replace = '            e->until_ = f;'

[[mutant]]
id = "cap-14"
name = "16-bit input widened by 32767"
test = "audio"
why = "Widening is exact: an s16 sample s is s / 32768."
find = '        for (i = 0; i < ns; i++) dst[i] = (float)s[i] / 32768.0f;'
replace = '        for (i = 0; i < ns; i++) dst[i] = (float)s[i] / 32767.0f;'

[[mutant]]
id = "cap-15"
name = "24-bit WAV output without its top byte"
test = "audio"
why = "The writer's s24 must read back bit for bit through the parser."
find = 'o[3 * i + 2] = (unsigned char)((iv >> 16) & 0xFF); }'
replace = 'o[3 * i + 2] = 0; }'

[[mutant]]
id = "cap-16"
name = "the WAV sizes not written at close"
test = "audio"
why = "A file whose data size stays 0 reads back empty."
find = '    yau__wavw_header(w, h, data);'
replace = '    yau__wavw_header(w, h, 0);'

[[mutant]]
id = "cap-17"
name = "a saved gap has no silence"
test = "audio"
why = "The file's sample s is capture frame first + s, also across a gap."
find = '            while (z > 0) {'
replace = '            while (z > 0 && 0) {'

[[mutant]]
id = "cap-18"
name = "capture times without desc.offset_ns"
test = "audio"
why = "desc.offset_ns, from a line-in test, is added to every capture time."
find = '    return yau__fit_time(&c->fit_ft, frame) + c->desc.offset_ns;'
replace = '    return yau__fit_time(&c->fit_ft, frame);'

[[mutant]]
id = "cap-19"
name = "callback points from the block's first frame"
test = "audio"
why = "A block has arrived when its last frame has: the point is the frame after it at the callback's entry."
find = '        yau__cfeed(c, fend, now_t);'
replace = '        yau__cfeed(c, fend - frames, now_t);'

[[mutant]]
id = "cap-20"
name = "a halt is never found"
test = "audio"
why = "Measured on WASAPI capture, a stall longer than the buffer makes the reports late for good: the position stood while nothing was recorded."
find = '                    if (c->halt_run >= YAU__CAP_HALT_REPORTS) {'
replace = '                    if (0) {'

[[mutant]]
id = "cap-21"
name = "a halt does not count the position on"
test = "audio"
why = "After a halt the position must count the frames it left out, or every later report is late again."
find = '                        c->p_off += lost;'
replace = '                        (void)0;'

[[mutant]]
id = "cap-22"
name = "late blocks without reports restart the fit instead of counting"
test = "audio"
why = "The blocks' delay is the loss: the frames jump by it and the fit goes on."
find = '                yau__cxrun(c, now_t, (int64_t)floor(c->late_min / c->fit.k + 0.5), c->loss_f0);'
replace = '                yau__cxrun(c, now_t, 0, c->loss_f0);'
