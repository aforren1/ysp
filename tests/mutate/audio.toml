name = "values on a bool"
test = "audio"
why = "v0.7.0: values belong to enum rows only; a loader would take names for a bool."
find = '"WASAPI exclusive mode; silences every other program", NULL },'
replace = '"WASAPI exclusive mode; silences every other program", "off=0,on=1" },'

# The real-thread cases on a loaded machine (2026-10-22): their waits count
# the other thread's progress, not wall time. These mutants check that each
# case still sees its faults, and that a wait that cannot end fails at the
# wait instead of hanging.

[[mutant]]
id = "ld-01"
name = "a seek leaves the WAV read position"
test = "audio"
why = "The stream restarts at the seek but the file is read from where it was: every frame of the play is wrong."
find = '''    w->pos_ = sample;
    yau__st64(&w->seek_, -1);'''
replace = '''    yau__st64(&w->seek_, -1);'''

[[mutant]]
id = "ld-02"
name = "the pump's message ignores a seek"
test = "audio"
why = "A seek through yau_wav_on_msg must reach the stream; the wav pump case waits for it and fails at the wait."
find = '''        yau__st64(&w->seek_, m.seek);
        (void)yau__wav_seek_now(w, m.seek);'''
replace = ''

[[mutant]]
id = "ld-03"
name = "a reset keeps the old first sample"
test = "audio"
why = "A play must start at the sample of the last reset or seek, which yau_stream_get_info reports as first."
find = '''    yau__st64(&st->first_, first);
    yau__st64(&st->id_, 0);'''
replace = '''    yau__st64(&st->id_, 0);'''

[[mutant]]
id = "ld-04"
name = "a stream play's sample is one late"
test = "audio"
why = "Each play of the wav pump case must record the sample it started at: its seek."
find = '''    if (yau__is_stream(v) && v->start < 0) return -1;
    return v->first;'''
replace = '''    if (yau__is_stream(v) && v->start < 0) return -1;
    return yau__is_stream(v) ? v->first + 1 : v->first;'''

# v0.7.2: a wait without end (docs/audio.md, "A wait without end").

[[mutant]]
id = "wt-01"
name = "the wait's deadline is the plain sum"
test = "audio"
why = "now + INT64_MAX overflows: the virtual null case's wait with INT64_MAX must wait for the onset, not time out at once."
find = '''    int64_t end = yau__deadline(YAU__NOW(), timeout_ns);'''
replace = '''    int64_t end = YAU__NOW() + timeout_ns;'''

[[mutant]]
id = "wt-02"
name = "only INT64_MAX itself is forever"
test = "audio"
why = "Any timeout whose sum passes INT64_MAX saturates: the case waits with INT64_MAX - 1 ms too."
find = '''    if (timeout_ns > 0 && now > INT64_MAX - timeout_ns) return INT64_MAX;'''
replace = '''    if (timeout_ns == INT64_MAX) return INT64_MAX;'''

# 2026-10-27: the lead on the null device (docs/audio.md, "The lead on the
# null device"). The header did not change; these keep the lead's
# definition under test.

[[mutant]]
id = "le-01"
name = "the lead is clamped at 0"
test = "audio"
why = "A late callback makes the lead negative, and a sound at now + lead still starts on its frame: the late-callback case reads -2 ms."
find = '''    w = yau__ld64(&au->w_pub);
    return yau__fit_time(&au->fit_ft, w + au->dcaps.period) - YAU__NOW();'''
replace = '''    w = yau__ld64(&au->w_pub);
    w = yau__fit_time(&au->fit_ft, w + au->dcaps.period) - YAU__NOW();
    return w < 0 ? 0 : w;'''

[[mutant]]
id = "le-02"
name = "the lead has no period of margin"
test = "audio"
why = "The lead leaves one period for a callback that runs between the read and the handover: the late-callback case reads 10 ms just before an on-time callback."
find = '''    return yau__fit_time(&au->fit_ft, w + au->dcaps.period) - YAU__NOW();'''
replace = '''    return yau__fit_time(&au->fit_ft, w) - YAU__NOW();'''

# v0.7.3: WAV paths are UTF-8 (docs/audio.md, "UTF-8 paths").

[[mutant]]
id = "pa-01"
name = "a WAV path in the ANSI code page"
test = "audio"
why = "fopen() on Windows reads the path in the ANSI code page: the writer and the probe must open a file in a folder named with Omega, Zhe, a CJK ideograph and U+1F3AC."
find = '''        f = _wfsopen(w, m, mode[0] == 'r' ? _SH_DENYNO : _SH_DENYWR);'''
replace = '''        (void)w; (void)m;
        f = fopen(path, mode);'''

[[mutant]]
id = "pa-02"
name = "a missing file is not named as one"
test = "audio"
why = "A missing WAV file says \"no such file\" in the message, from the probe and from the writer."
find = '''        if (errno == ENOENT || errno == ENOTDIR) *why = "no such file";'''
replace = '''        if (errno == ENOENT && errno == ENOTDIR) *why = "no such file";'''

[[mutant]]
id = "pa-03"
name = "a path that is not UTF-8 is opened anyway"
test = "audio"
why = "On Windows a path that is not UTF-8 is refused with YAU_ERR_ARG, not tried as a file."
find = '''            *why = "the path is not valid UTF-8 or longer than 1023 characters";
            return YAU_ERR_ARG;'''
replace = '''            *why = "cannot open";
            return YAU_ERR_IO;'''
