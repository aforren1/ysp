# v0.6.0, capture on Linux (docs/audio.md, "Linux: capture"): ALSA
# exclusive on hw:, PulseAudio's record stream, the suspension narrowed to
# one card, and the core's watchdog and device loss count. alsa-1x need
# hw:0,0's input; pulse-05 to pulse-12 a running PulseAudio and, for part
# 4, hw:0,0. Not listed: AUTO's input on the card's last device and the
# first of several name matches, which share alsa-10's and alsa-04's line
# with the output (the capture test passes on those lines too); the duplex
# input on another card, which needs a second card with an input.

[[mutant]]
