                au->early_run = 0;
                au->late_run = 0;
            }'''
replace = '''            } else {
                au->early_run = 0;
            }'''

[[mutant]]
id = "h-04"
name = "late reports confirm onsets"
test = "audio"
why = "A report of a halt not yet confirmed must not confirm a sound tier 2 on the old timing."
find = '''            if (pw <= v->start || au->late_run > 0) continue;'''
replace = '''            if (pw <= v->start) continue;'''

[[mutant]]
id = "h-05"
name = "the halt's first report counts in its length"
test = "audio"
why = "The first late report can be the halt half over; the record's halt must come from a report after the device played again."
find = '''                else if (au->late_run == 2 || r < au->late_min) au->late_min = r;'''
replace = '''                if (au->late_run == 1 || r < au->late_min) au->late_min = r;'''

[[mutant]]
id = "h-06"
name = "the fit keeps its points after a halt"
test = "audio"
why = "After a halt every frame plays later by the halt; a fit of the old points puts later onsets off by it."
find = '''                    yau__xrun_rec(au, now_t, 0, 1, (int64_t)au->late_min, au->late_w0, au->late_again);
                    au->first_block = 0;
                    au->fit.w0 = pw; au->fit.t0 = tk->pos_t; au->fit.k = yau__k_nom(au);'''
replace = '''                    yau__xrun_rec(au, now_t, 0, 0, (int64_t)au->late_min, au->late_w0, au->late_again);'''

[[mutant]]
id = "h-07"
name = "the fit starts over on the next callback"
test = "audio"
why = "The sounds the halt moved complete in the callback that finds it; their times must come from the new timing, not the old fit."
find = '''                    au->first_block = 0;
                    au->fit.w0 = pw; au->fit.t0 = tk->pos_t; au->fit.k = yau__k_nom(au);
                } else {'''
replace = '''                } else {'''

[[mutant]]
id = "h-08"
name = "the XRUN record without the halt"
test = "audio"
why = "The record says how long the device stood, so the analysis can move the times of what played after it."
find = '''    u.i64[2] = halt_ns;'''
replace = '''    u.i64[2] = 0;'''

[[mutant]]
id = "h-09"
name = "an underrun counted twice"
test = "audio"
why = "Measured at queue 2: the report before a halt can be early by most of a period, which has its own XRUN record; the halt that follows is the same underrun and must not count again."
find = '''    if (!again) au->xruns++;'''
replace = '''    au->xruns++;'''

# v0.4.0 conventions: messages and a close that never fails.

[[mutant]]
id = "conv-01"
name = "a failing frame-thread call writes no message"
test = "audio"
why = "Every failing call of the frame thread writes yau_error() (README Conventions, Errors)."
find = '    if (rc < 0 && au && au->err_n == n0) yau__err(au, "ysp_audio: %s: %s", what, yau_strerror((int)rc));'
replace = '    (void)n0; (void)what;'

[[mutant]]
id = "conv-02"
name = "close does not cancel a playing stream"
test = "audio"
why = "A close that only waits leaves the play running: the device would read the stream after the caller frees it."
find = '        if (id > 0) (void)yau__cancel_rc(au, id);'
replace = '        (void)id;'

[[mutant]]
id = "conv-03"
name = "a timed-out close frees the arena hold"
test = "audio"
why = "The device may still read a detached stream: an arena ring must stay held until yau_close()."
find = '''
                st->au_ = NULL;   /* detached: memory and hold stay (above) */
                return;'''
replace = '''
                if (st->in_arena_) au->arena_streams--;
                st->in_arena_ = 0;
                st->au_ = NULL;
                return;'''

