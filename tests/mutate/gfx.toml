find = '''    "        bool fall = (s1 && !s3) || two, rise = (!s1 && s3) || two;\n"'''
replace = '''    "        bool fall = (s1 && !s3), rise = (!s1 && s3) || two;\n"'''

[[mutant]]
id = "v06-03"
