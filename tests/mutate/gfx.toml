env = { YGFX_TEST_PARTS = "v0.4 cache", YGFX_TEST_DEVICES = "hardware" }
why = "The second key hash and the material length guard against a key collision and a truncated record."
find = 'hd.key2 == r->key2 && hd.material_bytes == r->material &&'
replace = ''

