# The v0.6 list (docs/gfx.md, "v0.6 mutations"). The text part computes
# its exact references once per run (about 4 min on the Iris Xe); the blur
# part takes seconds; "none" runs the CPU half alone.

[[mutant]]
id = "v06-00"
name = "a ray's band one off"
test = "gfx"
env = { YGFX_TEST_PARTS = "v0.6 text", YGFX_TEST_DEVICES = "hardware" }
why = "A ray must read the band its pixel row is in, or it misses the curves it crosses."
find = '''    "    int kb = clamp(int(floor((ac - lo) * float(nb) / (hi - lo))), 0, nb - 1);\n"'''
replace = '''    "    int kb = clamp(int(floor((ac - lo) * float(nb) / (hi - lo))) + 1, 0, nb - 1);\n"'''

[[mutant]]
