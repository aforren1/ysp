
# ysp/gfx.h mutants: the v0.4 list (docs/gfx.md, "v0.4 mutations"), then
# later lists by prefix (pr-: v0.11 prime; os-: v0.11.1 open start; cv-:
# v0.12.0 messages; cp-: v0.13.0 capture; ft-: v0.15.0 first trial).
# The v0.3 list (mutate03.py) was lost; docs/gfx.md keeps its table.
# YGFX_TEST_PARTS limits a run to the parts that can see the fault, and
# "none" runs the CPU half alone. YGFX_TEST_DEVICES=hardware is the GPU
# the v0.4 run used (an Intel Iris Xe through ANGLE on D3D11). With a part
# filter, six summary checks of parts that did not run fail (S2.alpha_control,
# S2.epoch_control_bad, S2.lost_ok, S3.vtx_blur, S5.t3_connect, S5.t4_fd);
# the baseline has the same failures, so the runner ignores them.
header = "ysp/gfx.h"

[test.gfx]
source = "tests/adapt/gfx_test.c"
compiler = "msvc"
flags = ["/O1", "/W3", "/D_CRT_SECURE_NO_WARNINGS"]
timeout = 600
env_default = { YSCR_ANGLE_DIR = "C:/Program Files/Docker/Docker/frontend" }

[[mutant]]
id = "v04-00"
name = "payload hash not checked"
test = "gfx"
env = { YGFX_TEST_PARTS = "v0.4 cache", YGFX_TEST_DEVICES = "hardware" }
why = "A corrupted program-cache file must be refused, not handed to the driver as a binary."
find = 'hd.payload_hash == ygfx__fnv64(buf + YGFX__PROG_HEAD, hd.payload_bytes)'
replace = '1'

[[mutant]]
id = "v04-01"
name = "key without GL_RENDERER"
test = "gfx"
env = { YGFX_TEST_PARTS = "none", YGFX_TEST_DEVICES = "none" }
why = "A cached binary from one GPU must not load on another GPU. Caught after the fake backend varied its renderer string."
find = '''
        ygfx__h2_str(&h, g->caps.renderer);
'''
replace = ''

[[mutant]]
id = "v04-02"
name = "key without GL_VERSION"
test = "gfx"
env = { YGFX_TEST_PARTS = "none", YGFX_TEST_DEVICES = "none" }
why = "A driver update must make cached binaries stale. Caught after the fake backend varied its version string."
find = '''
        ygfx__h2_str(&h, g->caps.version);
'''
replace = ''

[[mutant]]
id = "v04-03"
name = "bindings not set after a binary load"
test = "gfx"
env = { YGFX_TEST_PARTS = "v0.4 cache", YGFX_TEST_DEVICES = "hardware" }
why = "A program loaded from the cache must bind its uniform blocks and samplers as a compiled one does, or it draws with the wrong inputs."
find = '''
            gl->f.GenVertexArrays(1, &p->vao);
            ygfx__gl_slots(gl, p);'''
replace = '            gl->f.GenVertexArrays(1, &p->vao);'

[[mutant]]
id = "v04-04"
name = "a refused binary not compiled"
test = "gfx"
env = { YGFX_TEST_PARTS = "v0.4 cache", YGFX_TEST_DEVICES = "hardware" }
why = "When the driver refuses a cached binary, open must compile the source, not fail."
find = '''
        gl->f.DeleteProgram(p->prog);
        p->prog = 0;
        while (gl->f.GetError() != YGFX__GL_NO_ERROR) {}
'''
replace = '''
        gl->f.DeleteProgram(p->prog);
        p->prog = 0;
        return YGFX_ERR_GL;
'''

[[mutant]]
id = "v04-05"
name = "second hash and length not checked"
