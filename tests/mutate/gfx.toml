why = "A curve just behind the pixel center still covers part of the pixel: the loop may stop only past the window."
find = '''    "        if (max(max(u.x, u.y), u.z) < cut) break;\n"'''
replace = '''    "        if (max(max(u.x, u.y), u.z) < 0.0) break;\n"'''

