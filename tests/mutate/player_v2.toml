# player/v2.c mutants: version 2's lowering and run (tests/player/mut_test.c,
# whose system tests run tests/player/player_test.py's t_v2_ cases with the
# mutated player). The comparison with the C programs (compare.py) is not in
# this test: a mutant that only it sees survives here.
header = "v2.c"

[test.player]
source = "tests/player/mut_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-DYSCR_NO_SDL", "-DPIN_A0=\"x3b4a1c5afe219da5\"", "-I$YSP_MINIAUDIO"]
libs = ["-lm", "-lpthread", "-ldl"]
timeout = 300
env = { YPL_REPO = "{repo}" }
env_default = { YPL_BIN = "{repo}/build/linux", YPAK = "{repo}/build/linux/pack/ypak" }

[[mutant]]
id = "v2-01"
name = "max_visits counts one visit more"
test = "player"
why = "D20 rule 12: t_v2_states sees c, c and over."
find = '''if (st->max_visits > 0 && v->visits[r->def] > st->max_visits) {'''
replace = '''if (st->max_visits > 0 && v->visits[r->def] > st->max_visits + 1) {'''

