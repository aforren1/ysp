# ysp/response.h mutants: the window and its bounds, onset refinement, held
# keys, releases, crossings, the trace, the log reserve and sources. The
# double-report rule's mutants moved to screen.toml (kd-, v0.2.0). docs/response.md lists the results.
header = "ysp/response.h"

[test.response]
source = "tests/adapt/response_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 300

# --- the window ------------------------------------------------------------

[[mutant]]
id = "w-01"
name = "minimum exclusive"
test = "response"
why = "A press exactly at minimum_valid_rt is a response; > would call it an anticipation."
find = 'if (rt < c->min_rt_ns) return YRSP_E_ANTICIPATION;'
replace = 'if (rt <= c->min_rt_ns) return YRSP_E_ANTICIPATION;'

[[mutant]]
id = "w-02"
name = "deadline inclusive"
test = "response"
why = "The window is half-open: a press exactly at the deadline is late."
find = 'if (c->duration_ns > 0 && rt >= c->duration_ns) return YRSP_E_LATE;'
replace = 'if (c->duration_ns > 0 && rt > c->duration_ns) return YRSP_E_LATE;'

[[mutant]]
id = "w-03"
name = "early against arm"
test = "response"
why = "EARLY is before the stimulus onset, not before the window opened at the fixation."
find = '''    rt = t - c->onset.t_ns;
    if (rt < 0) return YRSP_E_EARLY;'''
replace = '''    rt = t - c->onset.t_ns;
    if (t < c->t_arm) return YRSP_E_EARLY;'''

[[mutant]]
id = "w-04"
name = "deadline from arm"
test = "response"
why = "duration runs from the onset; from arm() the window would close a fixation early."
find = 'if (c->have_onset && c->duration_ns > 0 && now_ns >= c->onset.t_ns + c->duration_ns) {'
replace = 'if (c->have_onset && c->duration_ns > 0 && now_ns >= c->t_arm + c->duration_ns) {'

[[mutant]]
id = "w-06"
name = "negative duration accepted"
test = "response"
why = "v0.3.0: desc durations are int64_t ns from the caller; a negative one must be refused at open (the seconds rounding moved to the script layer)."
find = '    if (ns < 0 || ns > YRT_S(1e6))'
replace = '    if (ns > YRT_S(1e6))'

[[mutant]]
id = "w-07"
name = "rt sign"
test = "response"
why = "RT is response minus onset."
find = 'r->rt_ns = e->t - c->onset.t_ns;'
replace = 'r->rt_ns = c->onset.t_ns - e->t;'

[[mutant]]
id = "w-08"
name = "anticipation ends the window"
test = "response"
why = "Anticipations are logged, never responses: they must not end the trial."
find = '    if (rt < c->min_rt_ns) return YRSP_E_ANTICIPATION;'
replace = '    if (rt < c->min_rt_ns) return 0;'

[[mutant]]
id = "w-09"
name = "first arrival, not earliest"
test = "response"
why = "A box report read late but stamped earlier is the response; arrival order is not time order."
find = '''            if (best < 0 || e->t < c->log[best].t) best = i;
        }
        if (e->flags & YRSP_E_EARLY) r->n_early++;'''
replace = '''            if (best < 0) best = i;
        }
        if (e->flags & YRSP_E_EARLY) r->n_early++;'''

[[mutant]]
id = "w-10"
name = "max_responses off by one"
test = "response"
why = "persist with max_responses 2 ends at the second response."
find = '    need = c->d.persist ? c->d.max_responses : 1;'
replace = '    need = c->d.persist ? c->d.max_responses + 1 : 1;'

[[mutant]]
id = "w-11"
name = "after-end not marked"
test = "response"
why = "A press after the one that ended the trial is no response (jsPsych cancels the listener)."
find = '''        in->t >= c->t_end)
        flags |= YRSP_E_AFTER_END;'''
replace = '''        in->t >= c->t_end)
        flags |= 0;'''

[[mutant]]
id = "w-12"
name = "timeout without a deadline"
test = "response"
why = "TIMEOUT means a deadline passed; with no deadline there is none."
find = '''    } else if (c->duration_ns > 0) {
        r->flags |= YRSP_R_TIMEOUT;'''
replace = '''    } else {
        r->flags |= YRSP_R_TIMEOUT;'''

[[mutant]]
id = "w-13"
name = "kinds 0 means all"
test = "response"
why = "In ALL mode kinds 0 is the keyboard only, so a focus click does not end a keyboard trial."
find = 'if (c->d.kinds == 0) c->d.kinds = YRSP_KIND_BIT(YRSP_KIND_KEYBOARD);'
replace = 'if (c->d.kinds == 0) c->d.kinds = YRSP_KINDS_ALL;'

[[mutant]]
id = "w-14"
name = "keycode reads the scancode"
test = "response"
why = "match = KEYCODE matches the layout's key, a different field."
find = 'if (h->match == YRSP_MATCH_KEYCODE ? h->code == in->code : h->control == in->control) return i;'
replace = 'if (h->control == in->control) return i;'

[[mutant]]
id = "w-15"
name = "device filter ignored"
test = "response"
why = "A choice on one box must not take another box's button."
find = '''        if (h->device && h->device != in->device) continue;
        if (h->match'''
replace = '        if (h->match'

# --- onset refinement --------------------------------------------------------

[[mutant]]
id = "o-01"
name = "no reclassification"
test = "response"
why = "The final onset (a frame later after a drop) must move every entry's class."
find = '''    c->have_onset = 1;
    yrsp__reclassify(c);'''
replace = '    c->have_onset = 1;'
[[mutant.also]]
find = '''    memset(r, 0, sizeof *r);
    r->rt_ns = r->rt_key_duration_ns = YRSP_NO_TIME;
    r->response = -1;
    r->entry = -1;
    r->onset_frame = -1;
    r->plan_residual = c->have_plan ? c->plan.residual_ns : YRSP_NO_TIME;
    yrsp__reclassify(c);'''
replace = '''    memset(r, 0, sizeof *r);
    r->rt_ns = r->rt_key_duration_ns = YRSP_NO_TIME;
    r->response = -1;
    r->entry = -1;
    r->onset_frame = -1;
    r->plan_residual = c->have_plan ? c->plan.residual_ns : YRSP_NO_TIME;'''

[[mutant]]
id = "o-02"
name = "ended early never set"
test = "response"
why = "The data row must say when the trial ended on a press that no longer counts."
find = '        r->flags |= YRSP_R_ENDED_EARLY;'
replace = ''

[[mutant]]
id = "o-03"
name = "a plan replaces the final onset"
test = "response"
why = "A late plan must not overwrite the flip record's onset."
find = 'if (c->have_onset && c->onset.final && !o->final) return c->status;'
replace = ''

[[mutant]]
id = "o-04"
name = "set_onset does not end"
test = "response"
why = "A press that arrived before its onset was known ends the window when the onset comes."
find = '''    yrsp__reclassify(c);
    yrsp__check_end(c);
    return c->status;'''
replace = '''    yrsp__reclassify(c);
    return c->status;'''

[[mutant]]
id = "o-05"
name = "plan flag lost"
test = "response"
why = "An RT measured from a prediction must say so."
find = '        if (!c->onset.final) r->flags |= YRSP_R_ONSET_PLAN;'
replace = ''

# --- held keys -------------------------------------------------------------

[[mutant]]
id = "d-05"
name = "repeat not held"
test = "response"
why = "R1: an OS repeat of a key held from before the window is not a press (jsPsych allow_held_key false)."
find = '    held = repeat || yrsp__is_down(c, in);'
replace = '    held = yrsp__is_down(c, in);'

[[mutant]]
id = "d-06"
name = "release does not clear"
test = "response"
why = "After a release the key can be pressed again."
find = '''    yrsp__set_down(c, in, false);
    if (!c->armed) return;'''
replace = '    if (!c->armed) return;'

[[mutant]]
id = "d-07"
name = "allow_held_key inverted"
test = "response"
why = "allow_held_key true lets a held key's report be the response."
find = 'if (choice >= -1 && c->d.allow_held_key) {'
replace = 'if (choice >= -1 && !c->d.allow_held_key) {'

[[mutant]]
id = "d-08"
name = "held at open lost"
test = "response"
why = "The data row says when a choice key was already down as the window opened."
find = '''                    yrsp__same_dev(c->held[k].device, h->device))
                    c->held_at_open = 1;'''
replace = '''                    yrsp__same_dev(c->held[k].device, h->device))
                    (void)0;'''

# --- devices (v0.1.1) -------------------------------------------------------

[[mutant]]
id = "dv-01"
name = "devices ignored"
test = "response"
why = "Two keyboards pressing one key within 50 ms are two participants' presses, not one press reported twice."
find = 'static bool yrsp__same_dev(uint32_t a, uint32_t b) { return a == b || a == 0 || b == 0; }'
replace = 'static bool yrsp__same_dev(uint32_t a, uint32_t b) { (void)a; (void)b; return true; }'

[[mutant]]
id = "dv-02"
name = "device 0 is a device"
test = "response"
why = "SDL's message path carries device 0: its report of a raw-path press must merge with it."
find = 'static bool yrsp__same_dev(uint32_t a, uint32_t b) { return a == b || a == 0 || b == 0; }'
replace = 'static bool yrsp__same_dev(uint32_t a, uint32_t b) { return a == b; }'

[[mutant]]
id = "dv-03"
name = "repeat from another keyboard held"
test = "response"
why = "SDL keeps one key state for all keyboards: keyboard B's first press of a key A holds comes as a repeat."
find = '    if (repeat && !yrsp__is_down(c, in) && yrsp__down_elsewhere(c, in)) repeat = false;'
replace = ''

# --- releases ---------------------------------------------------------------

[[mutant]]
id = "r-01"
name = "a release closes one entry"
test = "response"
why = "A press and its HELD repeats are one press: the release closes them all, so the response's duration is right."
find = '''            c->ended_by = 1;
        }
    }
}'''
replace = '''            c->ended_by = 1;
        }
        return;
    }
}'''

[[mutant]]
id = "r-02"
name = "wait_for_key_release ignored"
test = "response"
why = "With wait_for_key_release the trial ends at the release, so the hold is measured."
find = '''    if (c->d.wait_for_key_release && !(c->log[best].flags & YRSP_E_CROSSING) &&'''
replace = '''    if (0 && c->d.wait_for_key_release && !(c->log[best].flags & YRSP_E_CROSSING) &&'''

[[mutant]]
id = "r-03"
name = "max_hold default 0"
test = "response"
why = "max_hold 0 means 2 s; 0 ns would end every waiting trial at once."
find = 'if (c->max_hold_ns == 0) c->max_hold_ns = YRT_S(2);'
replace = ''

# --- crossings, trace, log ---------------------------------------------------

[[mutant]]
id = "x-01"
name = "no hysteresis"
test = "response"
why = "Jitter around the level must not give a second crossing."
find = 'return h->cross == YRSP_CROSS_FALLING ? v > h->level + h->hysteresis : v < h->level - h->hysteresis;'
replace = 'return h->cross == YRSP_CROSS_FALLING ? v > h->level : v < h->level;'

[[mutant]]
id = "x-02"
name = "rising exclusive"
test = "response"
why = "A sample at the level crosses."
find = 'return h->cross == YRSP_CROSS_FALLING ? v <= h->level : v >= h->level;'
replace = 'return h->cross == YRSP_CROSS_FALLING ? v <= h->level : v > h->level;'

[[mutant]]
id = "x-03"
name = "held channel crosses"
test = "response"
why = "A trigger already pressed at arm() is held, like a key."
find = '            else if (yrsp__past(h, ch->v)) ch->armed = 0;'
replace = '            else ch->armed = 1;'

[[mutant]]
id = "x-04"
name = "distance from the first sample"
test = "response"
why = "Movement onset is measured from where the pointer was at arm()."
find = '            ch->has_ref = ch->has;'
replace = '            ch->has_ref = 0;'

[[mutant]]
id = "t-01"
name = "trace kinds ignored"
test = "response"
why = "trace_kinds limits the trace to the kinds asked for."
find = '(c->d.trace_kinds == 0 || ((c->d.trace_kinds >> in->kind) & 1u))'
replace = '(1)'

[[mutant]]
id = "l-01"
name = "no reserve"
test = "response"
why = "Presses of other keys must not push the response out of the log."
find = 'int cap = match ? YRSP_LOG_CAP : YRSP_LOG_CAP - YRSP_LOG_RESERVE;'
replace = 'int cap = YRSP_LOG_CAP;'

[[mutant]]
id = "s-01"
name = "kind's source wins"
test = "response"
why = "A device's own source entry is more specific than its kind's."
find = '        if (c->src[i].device == device && device != 0) return &c->src[i];'
replace = ''

[[mutant]]
id = "s-02"
name = "stamp override keeps the table's bounds"
test = "response"
why = "Bounds belong to the tier they were measured for."
find = '        if (s && s->tier == e->stamp) {'
replace = '        if (s) {'

[[mutant]]
id = "n-01"
name = "US layout: z and y swapped"
test = "response"
why = "Key names resolve to US-layout scancodes; a lookup off by one is a wrong key."
find = '''if (ch >= 'a' && ch <= 'z') { *sc = (uint32_t)(4 + ch - 'a'); *kc = (uint32_t)ch; return true; }'''
replace = '''if (ch >= 'a' && ch <= 'z') { *sc = (uint32_t)(3 + ch - 'a'); *kc = (uint32_t)ch; return true; }'''

# --- raw mice (v0.1.2) -------------------------------------------------------

[[mutant]]
id = "ms-01"
name = "raw mouse buttons in bit order"
test = "response"
why = "Buttons follow SDL's numbers (left 1, middle 2, right 3), so a raw click and an SDL click of one button are one choice."
file = "ysp/input.h"
find = '''    static const uint8_t bit[5] = { YIN_MOUSE_LEFT, YIN_MOUSE_MIDDLE, YIN_MOUSE_RIGHT,
                                    YIN_MOUSE_X1, YIN_MOUSE_X2 };'''
replace = '''    static const uint8_t bit[5] = { YIN_MOUSE_LEFT, YIN_MOUSE_RIGHT, YIN_MOUSE_MIDDLE,
                                    YIN_MOUSE_X1, YIN_MOUSE_X2 };'''

[[mutant]]
id = "ms-02"
name = "cursor gain ignored"
test = "response"
why = "The gain is the design's counts-to-pixels ratio, stated in the data."
find = '    c->x += g * in->x;'
replace = '    c->x += in->x;'

[[mutant]]
id = "ms-03"
name = "cursor takes every mouse"
test = "response"
why = "One participant's cursor moves with that participant's mouse only."
find = '    if (c->device && in->device != c->device) return 0;'
replace = ''

[[mutant]]
id = "ms-04"
name = "SDL absolute mouse not tier 3"
test = "response"
why = "SDL's absolute-mode mouse events carry the window message's time; the record must say so."
file = "ysp/input.h"
find = '    return (uint8_t)(which ? 0 : YIN_TIER_3);'
replace = '    return (uint8_t)0 * which;'

# --- v0.1.4: SYNC in ALL mode ---------------------------------------------------

[[mutant]]
id = "sync-01"
name = "every kind takes SYNC"
test = "response"
why = "A scanner pulse or a photodiode edge in an ALL_KEYS trial must not end it."
find = '    if (c->d.kinds == YRSP_KINDS_ALL) c->d.kinds = (uint16_t)(c->d.kinds & ~YRSP_KIND_BIT(YRSP_KIND_SYNC));'
replace = '    (void)0;'

# v0.3.0 conventions: messages and close.

[[mutant]]
id = "conv-01"
name = "a failing call writes no message"
test = "response"
why = "Every failing call writes yrsp_error() (README Conventions, Errors)."
find = '    if (c) snprintf(c->error, sizeof c->error, "ysp_response: %s: %s", what, yrsp_strerror(rc));'
replace = '    (void)what;'

[[mutant]]
id = "conv-02"
name = "close leaves the collector open"
test = "response"
why = "After yrsp_close() every call must be YRSP_ERR_STATE."
find = '    if (c) c->ok = 0;'
replace = '    (void)c;'

# v0.4.0 the frame loop and the data columns (fl-).

[[mutant]]
id = "fl-01"
name = "a later plan replaces the landing's"
test = "response"
why = "A never-shown frame's record is a plan too; the landing residual in the data must stay the first plan's."
find = '    if (!o->final && !c->have_plan) {'
replace = '    if (!o->final) {'

[[mutant]]
id = "fl-02"
name = "the plan frame after the final onset"
test = "response"
why = "Once the record made the onset final, no other record may replace it: yrsp_plan_frame() is -1."
find = '    if (!c || !c->ok || !c->armed || !c->have_onset || c->onset.final) return -1;'
replace = '    if (!c || !c->ok || !c->armed || !c->have_onset) return -1;'

[[mutant]]
id = "fl-03"
name = "the record of the wrong frame"
test = "response"
why = "Only the record of the frame the stimulus landed on is its onset; the frame before is not."
find = '        if (f->done[i].index == k) {'
replace = '        if (f->done[i].index + 1 == k) {'

[[mutant]]
id = "fl-04"
name = "any event of the channel is its landing"
test = "response"
why = "An OFFSET (or SET) of the stimulus's channel is not its onset."
find = '        if (fired[i].kind == YTL_ONSET && fired[i].target == channel) {'
replace = '        if (fired[i].target == channel) {'

[[mutant]]
id = "fl-05"
name = "the deadline a nanosecond late"
test = "response"
why = "yrsp_update_frame() is yrsp_update() at the frame's predicted onset, not another clock."
find = '    return yrsp_update(c, f->onset);'
replace = '    return yrsp_update(c, f->onset - 1);'

[[mutant]]
id = "fl-06"
name = "onset columns without an onset"
test = "response"
why = "A row with no onset must leave its source, tier and residual empty, not write 0 (0 is a tier)."
find = '    bool on = r && r->t_onset != 0;'
replace = '    bool on = r != NULL;'

[[mutant]]
id = "fl-07"
name = "a stamp tier without a response"
test = "response"
why = "rsp_tier describes the response's press; a row without one has none."
find = '(r->flags & YRSP_R_RESPONDED) ? (int)r->stamp_tier : YTR_MISSING_INT'
replace = '(int)r->stamp_tier'

[[mutant]]
id = "fl-08"
name = "landing_residual from the final onset"
test = "response"
why = "landing_residual is the plan's residual; the final onset's is onset_residual."
find = '    YRSP__DSET("landing_residual_s", ytr_data_set_time_ns(w, col, r->plan_residual))'
replace = '    YRSP__DSET("landing_residual_s", ytr_data_set_time_ns(w, col, r->onset_residual))'

# v0.5.0: the columns of seconds end in _s.

[[mutant]]
id = "fl-09"
name = "rt set under its old name"
test = "response"
why = "yrsp_data_set() finds the columns by name; looking for rt finds no column, so the row's rt_s stays empty."
find = '    YRSP__DSET("rt_s", ytr_data_set_time_ns(w, col, r->rt_ns))'
replace = '    YRSP__DSET("rt", ytr_data_set_time_ns(w, col, r->rt_ns))'

[[mutant]]
id = "fl-10"
name = "onset_residual declared without _s"
test = "response"
why = "A column of seconds without _s reads as ms to a jsPsych habit; ysp/trials.h refuses it at open."
find = '    YTR_COL_SET("onset_residual_s", YTR_COL_TIME_NS), \'
replace = '    YTR_COL_SET("onset_residual", YTR_COL_TIME_NS), \'

# --- the parameter table (v0.6.0) -------------------------------------------

[[mutant]]
id = "pm-01"
name = "trace_kinds 0 left as 0"
test = "response"
why = "The table says a zero trace_kinds is every kind; the handle must say so too, as kinds does."
find = '    if (c->d.trace_kinds == 0) c->d.trace_kinds = YRSP_KINDS_ALL;'
replace = '    /* trace_kinds kept */'

[[mutant]]
id = "pm-02"
name = "max_hold_ns default 1 s"
test = "response"
why = "A row's default is what a zero field means: open makes it 2 s."
find = '{ "max_hold_ns", "i64", 0, 1e15, 2e9, "ns",'
replace = '{ "max_hold_ns", "i64", 0, 1e15, 1e9, "ns",'

[[mutant]]
id = "pm-03"
name = "cross values without distance"
