[[mutant]]
id = "pm-04"
name = "kinds default 0"
test = "response"
why = "A zero kinds is the keyboard bit after open, not no kind."
find = '{ "kinds", "u16", 0, 65535, 1, "",'
replace = '{ "kinds", "u16", 0, 65535, 0, "",'

[[mutant]]
id = "pm-05"
name = "choice kinds without user"
test = "response"
why = "The kind row lists every yin_kind."
find = '"keyboard=0,mouse=1,touch=2,pen=3,gamepad=4,box=5,eye=6,sync=7,user=8"'
replace = '"keyboard=0,mouse=1,touch=2,pen=3,gamepad=4,box=5,eye=6,sync=7"'
