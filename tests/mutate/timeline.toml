# v0.5.0 conventions: messages and close.

[[mutant]]
id = "conv-01"
name = "a failing int call writes no message"
test = "timeline"
why = "Every failing int call writes ytl_error() (README Conventions, Errors)."
find = '    if (rc < 0 && tl) snprintf(tl->error, sizeof(tl->error), "ysp_timeline: %s: %s", what, ytl_strerror(rc));'
replace = '    (void)what;'

[[mutant]]
id = "conv-02"
name = "close leaves the handle open"
test = "timeline"
why = "After ytl_close() every call must be YTL_ERR_CLOSED."
find = '    if (tl) tl->open = false;'
replace = '    (void)tl;'

[[mutant]]
id = "conv-03"
name = "a sequence error writes no message"
test = "timeline"
why = "A sequence call that sets q.err writes the timeline message too."
find = '''
        q->err_call = q->n_calls - 1;
        ytl__seq_msg(q);
    }
    return rc;'''
replace = '''
        q->err_call = q->n_calls - 1;
    }
    return rc;'''

# --- TARGETS (v0.6.0) -------------------------------------------------------

[[mutant]]
id = "tgt-00"
name = "the first started tween drives, not the latest"
test = "timeline"
why = "A later tween takes the field over from its start (the overwrite rule)."
find = '        while (nx >= 0 && tw[nx].start_ns <= now) {'
replace = '        while (nx >= 0 && c < 0 && tw[nx].start_ns <= now) {'

[[mutant]]
id = "tgt-01"
name = "the cursor survives a rewind"
test = "timeline"
why = "After the base goes back, an earlier tween drives the field again."
find = '        if (c >= 0 && tw[c].start_ns > now) c = -1;   /* the base went back */'
replace = ''

[[mutant]]
id = "tgt-02"
name = "no look-ahead for STEP tweens"
test = "timeline"
why = "A set lands on the frame where an event at its time lands, up to the window end."
find = '            if (tw[w].flags & YTL__TW_STEPPED) e = w;'
replace = '            if (tw[w].flags & YTL__TW_STEPPED && 0) e = w;'

[[mutant]]
id = "tgt-03"
name = "a STEP tween read at the onset"
test = "timeline"
why = "A STEP tween is read at the window end, as a STEP track is."
find = '            ytl__tw_at(&tw[e], g->n, tw[e].flags & YTL__TW_STEPPED ? hi : now, v);'
replace = '            ytl__tw_at(&tw[e], g->n, now, v);'

[[mutant]]
id = "tgt-04"
name = "every start value is the rest value"
test = "timeline"
why = "A tween starts from the tween before it at its start (the takeover)."
