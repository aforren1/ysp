
# ysp/timeline.h mutants: RATE (v0.4.0), the sequence code (ytl_seq) and
# TARGETS (v0.6.0). docs/timeline.md: 24 RATE mutants, 21 caught and 3
# equivalent; 19 sequence mutants, all caught; 20 target mutants (tgt-*),
# all caught. The v0.3.0 list (23) was not kept.
header = "ysp/timeline.h"

[test.timeline]
source = "tests/adapt/timeline_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O2", "-w"]
libs = ["-lm"]
timeout = 300

[[mutant]]
id = "rate-00"
name = "floor correction removed (truncation)"
test = "timeline"
why = "Base time of a negative scaled interval must floor, not truncate (117 checks fail)."
find = '''
    if (r < 0) {
        q--;
        r += b;
    }
'''
replace = ''

[[mutant]]
id = "rate-01"
name = "r <= 0 for r < 0"
test = "timeline"
expect = "survived"
why = "r = 0 gives q - 1 and r = den, and (q - 1) num + den num / den is q num."
note = "Equivalent: it cannot change a result (docs/timeline.md)."
find = '''
    if (r < 0) {
        q--;'''
replace = '''
    if (r <= 0) {
        q--;'''

[[mutant]]
id = "rate-02"
name = "inverse rounds down"
test = "timeline"
why = "rt_time() must invert bt with the matching rounding direction."
find = 'x = ytl__scale(b->anchor_bt - t, b->den, b->num, b->lim_d, &s);'
replace = 'x = -ytl__scale(t - b->anchor_bt, b->den, b->num, b->lim_d, &s);'

[[mutant]]
id = "rate-03"
name = "quotient bound q >= lim"
test = "timeline"
expect = "survived"
why = "At q = lim the scaled part is more than 2^63 - 2^32, so the sum is out of range whether or not the scale saturates."
note = "Equivalent: it cannot change a result (docs/timeline.md)."
find = '    if (q > lim) {'
replace = '    if (q >= lim) {'

[[mutant]]
id = "rate-04"
name = "rate through ytl_anchor"
test = "timeline"
why = "A rate change re-anchors in place; ytl_anchor() also changes state the rate change must keep."
find = '''
        b->anchor_rt = rt;
        b->anchor_bt = bt;
        b->now_bt = bt;
    }
    b->num = num;'''
replace = '''
        ytl_anchor(tl, base, rt, bt);
    }
    b->num = num;'''

[[mutant]]
id = "rate-05"
name = "rate leaves now_bt"
test = "timeline"
why = "now_bt must follow the re-anchor, or the next evaluate sees a jump."
find = '''
        b->anchor_bt = bt;
        b->now_bt = bt;
    }
    b->num = num;'''
replace = '''
        b->anchor_bt = bt;
    }
    b->num = num;'''

[[mutant]]
id = "rate-06"
name = "no gcd reduction"
test = "timeline"
why = "num and den are reduced by their gcd, so equal rates compare equal and the overflow bound is as wide as it can be."
find = '''
    num /= x;
    den /= x;
'''
replace = ''

[[mutant]]
id = "rate-07"
name = "pause at rate 1"
test = "timeline"
why = "Pause must freeze the scaled base time, not add the RT difference."
find = '        b->anchor_bt = ytl__bt_s(b, rt, &sat);'
replace = '        b->anchor_bt += rt - b->anchor_rt;'

[[mutant]]
id = "rate-08"
name = "next_due at rate 1"
test = "timeline"
why = "ytl_next_due() must map event times through the rate."
find = '            t = ytl__rt_s(b, e->time_ns, &sat);'
replace = '            t = b->anchor_rt + (e->time_ns - b->anchor_bt);'

[[mutant]]
id = "rate-09"
name = "peek copy at rate 1"
test = "timeline"
why = "A peeked copy's onset must be mapped through the rate."
find = '            c.onset = ytl__rt_s(b, e->time_ns, &sat);'
replace = '            c.onset = b->anchor_rt + (e->time_ns - b->anchor_bt);'

[[mutant]]
id = "rate-10"
name = "report key onset - residual"
test = "timeline"
why = "A key's reported onset on a scaled running base must take the rounding residual into account."
find = '        if (b->scaled && b->state == YTL__RUNNING) {'
replace = '        if (0) {'

[[mutant]]
id = "rate-11"
name = "evaluate window bt(onset) + L"
test = "timeline"
why = "The evaluate window ends at the base time of onset plus the lead in RT, not at base time plus an RT lead."
find = '        hi_t = ytl__bt_s(b, f->onset + lead_ns, &sat);'
replace = '        hi_t = now + lead_ns;'

[[mutant]]
id = "rate-12"
name = "ytl_window rounds the lead"
test = "timeline"
why = "ytl_window() must use the same lead in ns as evaluate (ytl__lead_ns), or the two disagree by 1 ns."
find = '    x = ytl__bt_s(b, f->onset + ytl__lead_ns(tl, f->period), &sat);'
replace = '    x = ytl__bt_s(b, f->onset + (int64_t)(tl->lead * (double)f->period + 0.5), &sat);'

[[mutant]]
id = "rate-13"
name = "scaled flag num != 1"
test = "timeline"
why = "After the gcd reduction, num == den only at rate 1; num != 1 calls rate 1/2 unscaled."
find = '    b->scaled = (uint8_t)(num != den);'
replace = '    b->scaled = (uint8_t)(num != 1);'

[[mutant]]
id = "rate-14"
name = "anchor resets the rate"
test = "timeline"
why = "ytl_anchor() must keep the base's rate."
find = '''
    b->state = YTL__RUNNING;
    b->anchor_rt = rt;
    b->anchor_bt = base_time;'''
replace = '''
    b->state = YTL__RUNNING;
    b->num = b->den = 1;
    b->scaled = 0;
    b->anchor_rt = rt;
    b->anchor_bt = base_time;'''

[[mutant]]
id = "rate-15"
name = "rate re-anchors a paused base"
test = "timeline"
expect = "survived"
why = "A paused base's time does not read its anchor's RT time, the resume sets it again, and its now is already the frozen time."
note = "Equivalent: it cannot change a result (docs/timeline.md)."
find = '''
    if (b->state == YTL__RUNNING) {
        bool sat = false;
        int64_t bt = ytl__bt_s(b, rt, &sat);'''
replace = '''
    if (b->state != YTL__STOPPED) {
        bool sat = false;
        int64_t bt = ytl__bt_s(b, rt, &sat);'''

[[mutant]]
id = "rate-16"
name = "same rate re-anchors"
test = "timeline"
why = "Setting the same rate again must not re-anchor; each re-anchor can round."
find = '''
    if (num == b->num && den == b->den) return 0;
'''
replace = ''

[[mutant]]
id = "rate-17"
name = "clamps not counted"
test = "timeline"
why = "Saturated conversions must be counted in the base's clamp record."
find = 'if (sat && b->clamped < INT32_MAX) b->clamped++;'
replace = '(void)sat;'
count = 2

[[mutant]]
id = "rate-18"
name = "clamp boundary > for >="
test = "timeline"
why = "A time of exactly 2^62 must clamp. Caught after a check for it was added."
find = '    if (x >= 0 ? x >= YTL__LIMIT - a : x <= -YTL__LIMIT - a) {'
replace = '    if (x >= 0 ? x > YTL__LIMIT - a : x < -YTL__LIMIT - a) {'

[[mutant]]
id = "rate-19"
name = "rt_time on a paused base"
test = "timeline"
why = "ytl_rt_time() must refuse a paused base: no RT time maps to its base time."
find = '''
    b = &tl->bases[base];
    if (b->state != YTL__RUNNING) return false;
    x = ytl__rt_s(b, bt, &sat);'''
replace = '''
    b = &tl->bases[base];
    if (b->state == YTL__STOPPED) return false;
    x = ytl__rt_s(b, bt, &sat);'''

[[mutant]]
id = "rate-20"
name = "rate accepts |rt| >= 2^62"
test = "timeline"
why = "A rate change at an RT time beyond the 2^62 limit must be refused."
find = '''
    if (rt >= YTL__LIMIT || rt <= -YTL__LIMIT) return YTL_ERR_ARG;
    /* Reduced'''
replace = '    /* Reduced'

[[mutant]]
id = "rate-21"
name = "lim_d from num"
test = "timeline"
why = "The overflow bound divides by den, the multiplier of the inverse."
find = '    b->lim_d = YTL__QMAX / den;'
replace = '    b->lim_d = YTL__QMAX / num;'

[[mutant]]
id = "rate-22"
name = "queries accept a clamped time (base_time)"
test = "timeline"
why = "A query whose result saturated must return false, not a clamped time."
find = '''
    if (sat || x >= YTL__LIMIT || x <= -YTL__LIMIT) return false;
    *out = x;
    return true;
}

static int ytl__rate'''
replace = '''
    *out = x;
    return true;
}

static int ytl__rate'''

[[mutant]]
id = "rate-23"
name = "rate-1 path unchecked"
test = "timeline"
why = "Rate 1 must also saturate at the limit. Caught after the clamp record of a base at rate 1 was checked."
find = '    if (!b->scaled) return ytl__add_clamp(b->anchor_bt, rt - b->anchor_rt, sat);'
replace = '    if (!b->scaled) return b->anchor_bt + (rt - b->anchor_rt);'

[[mutant]]
id = "seq-00"
name = "the draft's overwrite: every tween a new block"
test = "timeline"
why = "Consecutive tweens on one channel must extend the pending block, not start a new block each time."
find = '''
    if (id == 0 || c->seq_id != id) return NULL;
    if (c->has_pend && c->pend_arena) return &c->poff;'''
replace = '''
    if (1) return NULL;
    if (c->has_pend && c->pend_arena) return &c->poff;'''

