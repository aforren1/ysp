# pack/derive.c mutants: the texts the pack tool takes from an experiment
# definition for its glyph runs (gap G9). The test compiles the mutated
# file into itself (tests/adapt/derive_test.c), with ysp/json.h and
# ysp/table.h. docs/pack.md lists the results.
header = "derive.c"

[test.derive]
source = "tests/adapt/derive_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w"]
libs = ["-lm"]
timeout = 60

# --- what gives texts --------------------------------------------------------------

[[mutant]]
id = "d-01"
name = "no $$ escape"
test = "derive"
why = "\"$$5 prize\" is the literal \"$5 prize\"; read as a variable it names nothing."
find = "if (x[0] == '$' && x[1] == '$')"
replace = "if (0)"

[[mutant]]
id = "d-02"
name = "the escape keeps both dollars"
test = "derive"
why = "The block would hold \"$$5 prize\", which the player never asks for."
find = "return add_text(d, s, x + 1, v->n - 1);"
replace = "return add_text(d, s, x, v->n);"

[[mutant]]
id = "d-03"
name = "the first map value dropped"
test = "derive"
why = "Every value of a lookup must have a block, whichever key the trials reach."
find = "for (k = 0; k < map->n; k++) {"
replace = "for (k = 1; k < map->n; k++) {"

[[mutant]]
id = "d-04"
name = "a vars choice taken as one value"
test = "derive"
why = "A {\"choice\": [...]} is each of its items, not an object."
find = "if (ch && ch->type == YJS_ARRAY) {"
replace = "if (0) {"

[[mutant]]
id = "d-05"
name = "a column only in the first table that has it"
test = "derive"
why = "A column's levels come from every table a node names; stopping at a table without the column misses the next."
find = "if (col < 0) continue;"
replace = "if (col < 0) break;"

[[mutant]]
id = "d-06"
name = "a child node's tables not seen"
test = "derive"
why = "A container's children name tables too."
find = "rc = walk(d, yjs_get(node, \"timeline\"), depth + 1);"
replace = "rc = 0;"

[[mutant]]
id = "d-07"
name = "a table opened for every lookup"
test = "derive"
why = "Each lookup would check the whole table block again: one view per table."
find = "d->tvt[i] = t;"
replace = "(void)0;"

[[mutant]]
id = "d-08"
name = "a table recorded once per lookup"
test = "derive"
why = "The runs' 'from' lists each table once."
find = "if (!strcmp(m->tab[i], name)) return 0;"
replace = "if (0) return 0;"

[[mutant]]
id = "d-09"
name = "the text taken as the whole key"
test = "derive"
why = "The text is the key's last field; the rest is the style."
find = "t->text = key + (size_t)kn - n;"
replace = "t->text = key;"

