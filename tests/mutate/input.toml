# ysp/input.h mutants: the SDL adapter's OS stamps (v0.5.0). The test is
# tests/adapt/input_test.c with its SDL part (YIN_TEST_SDL: SDL3's headers,
# no SDL call); in-03 is macOS code and runs on a Mac.
header = "ysp/input.h"

[test.input]
source = "tests/adapt/input_test.c"
compiler = "gcc"
# YSP_SDL3: an SDL3 prefix elsewhere (3.4.16 or later for in-09)
flags = ["-std=c11", "-O1", "-w", "-DYIN_TEST_SDL", "-I/Users/brainworks/sdl3/include", "-I$YSP_SDL3/include"]
libs = ["-lm"]
timeout = 120

[[mutant]]
id = "in-01"
name = "the OS time ignored"
test = "input"
why = "ctx.t_os is the event's own OS time (NSEvent.timestamp on macOS); SDL 3.4's stamp there is late by a per-process offset (v0.5.0)."
find = '    in.t = ctx && ctx->t_os ? ctx->t_os : t_rt;'
replace = '    in.t = t_rt;'

[[mutant]]
id = "in-02"
name = "the fallback not flagged"
test = "input"
why = "With OS stamps on, a key or button without one carries SDL's biased stamp and must say so (tier 3) (v0.5.0)."
find = '    bool fallback = ctx && ctx->os_stamps && !ctx->t_os;'
replace = '    bool fallback = false;'

[[mutant]]
id = "in-03"
name = "the macOS source entry ignores the OS stamps"
test = "input"
why = "The measured bounds belong to NSEvent stamps; SDL's own Cocoa stamps are tier 3 with their own bounds (v0.5.0)."
find = '    if ((kind == YIN_KIND_KEYBOARD || kind == YIN_KIND_MOUSE) && ctx && ctx->os_stamps) {'
replace = '    if ((kind == YIN_KIND_KEYBOARD || kind == YIN_KIND_MOUSE) && ctx && !ctx->os_stamps) {'

# input.h 0.5.1: the raw mouse note by platform (in-04 runs on a Mac).
[[mutant]]
id = "in-04"
name = "macOS gets Windows' raw mouse note"
test = "input"
why = "On macOS the stamp is the HID driver's, 55 us (minimum) to 122 us (median) before the read, not Windows' read time with injected input (v0.5.1)."
find = '''#if defined(__APPLE__)
    s.note = "ysp_screen raw mice (macOS)'''
replace = '''#if 0
    s.note = "ysp_screen raw mice (macOS)'''

# input.h 0.6.0, from the task examples: pen_state and the eraser on every
# pen event, the Linux source entries (in-07 and in-08 run on Linux; in-09
# needs SDL 3.4.16's headers or later).
[[mutant]]
id = "in-05"
name = "pen motion without pen_state"
test = "input"
why = "A consumer reads whether the pen draws from pen_state's DOWN bit on each sample (v0.6.0)."
find = "        in.code = (uint32_t)ev->pmotion.pen_state;"
replace = ""

[[mutant]]
id = "in-06"
name = "the eraser on down and up only"
test = "input"
why = "A sample or an axis from the eraser end must say so, or the eraser's strokes read as ink (v0.6.0)."
find = "    return (uint8_t)((pen_state & SDL_PEN_INPUT_ERASER_TIP) ? YIN_ERASER : 0u);"
replace = "    return (uint8_t)(pen_state & 0u);"

[[mutant]]
id = "in-07"
name = "Linux raw mice get Windows' note"
test = "input"
why = "On Linux the stamp is the kernel's evdev time, not the read time measured on Windows (v0.6.0)."
find = """#elif defined(__linux__) && !defined(__ANDROID__) && !defined(__EMSCRIPTEN__)
    s.note = "ysp_screen raw mice (Linux)"""
replace = """#elif 0
    s.note = "ysp_screen raw mice (Linux)"""

[[mutant]]
id = "in-08"
name = "SDL's X11 mouse stamps not tier 3"
test = "input"
why = "SDL 3.4 stamps X11 mouse events at its pump, once a frame: 1.5 to 16.6 ms after XTEST clicks (v0.6.0)."
find = """ if (kind == YIN_KIND_MOUSE) {
        s.tier = (uint8_t)YIN_TIER_3;
        s.partial = 1;
        s.lo_ns = YIN__X11_BUTTON_LO_NS;"""
replace = """ if (kind == YIN_KIND_MOUSE) {
        s.tier = (uint8_t)YIN_TIER_UNKNOWN;
        s.partial = 1;
        s.lo_ns = YIN__X11_BUTTON_LO_NS;"""

[[mutant]]
id = "in-09"
name = "proximity without pen_state"
test = "input"
why = "SDL 3.4.16 gives proximity events the pen's state, the eraser among it (v0.6.0)."
find = "        in.code = (uint32_t)ev->pproximity.pen_state;"
replace = ""

# input.h 0.7.0: Linux keys by their stamp (B7; in-10 and in-11 run on
# Linux).
[[mutant]]
id = "in-10"
name = "Linux keys with the kernel's time get tier 3"
test = "input"
why = "A key with the kernel's evdev time is not a tick or a poll; tier 3 hid the stamp ysp/screen.h measured inside the write() (v0.7.0)."
find = """    if (kind == YIN_KIND_KEYBOARD && ctx && ctx->os_stamps) {
        s.tier = (uint8_t)YIN_TIER_UNKNOWN;"""
replace = """    if (kind == YIN_KIND_KEYBOARD && ctx && ctx->os_stamps) {
        s.tier = (uint8_t)YIN_TIER_3;"""

[[mutant]]
id = "in-11"
name = "Linux keys with the X server's time get the kernel's entry"
test = "input"
why = "The X server's time is a ms tick, 0.96 to 1.99 ms behind the kernel's: tier 3 (v0.7.0)."
find = """    if (kind == YIN_KIND_KEYBOARD && ctx && ctx->os_stamps) {"""
replace = """    if (kind == YIN_KIND_KEYBOARD) {"""
