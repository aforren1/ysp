# player/run.c mutants: the trial's lowering decisions: after's start time,
# requeue, a loop, the method's update, the outcome, the rows. The rr-
# mutants are the real path's (test "real": tests/player/mut_real.c, a
# window, uinput and a pty pair; run them one at a time, -j 1).
header = "run.c"

[test.player]
source = "tests/player/mut_test.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-DYSCR_NO_SDL", "-DPIN_A0=\"x3b4a1c5afe219da5\"", "-I$YSP_MINIAUDIO"]
libs = ["-lm", "-lpthread", "-ldl"]
timeout = 300
env = { YPL_REPO = "{repo}" }
env_default = { YPL_BIN = "{repo}/build/linux", YPAK = "{repo}/build/linux/pack/ypak" }


[test.real]
source = "tests/player/mut_real.c"
compiler = "gcc"
flags = ["-std=c11", "-O1", "-w", "-I$YSP_SDL3/include", "-I$YSP_MINIAUDIO"]
libs = ["-L$YSP_SDL3/lib", "-Wl,-rpath,$YSP_SDL3/lib", "-lSDL3", "-lm", "-lpthread", "-ldl"]
timeout = 900
env = { YPL_REPO = "{repo}" }
env_default = { YPL_BIN = "{repo}/build/linux" }
[[mutant]]
id = "r-01"
name = "after starts at the response's end alone"
test = "player"
why = "2.5: after starts at max(end, events_end); the test responds early."
find = '''if (pl_build_after(p, bt > p->events_end ? bt : p->events_end) < 0) return -1;'''
replace = '''if (pl_build_after(p, bt) < 0) return -1;'''

