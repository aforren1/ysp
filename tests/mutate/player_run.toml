[[mutant]]
id = "rr-10"
name = "the writer is not drained before session.json"
test = "real"
why = "Every row on disk before session.json says the session closed."
find = '''    if (pl_writer_close(p) < 0) return -1;   /* every row on disk before session.json says so */'''
replace = ''''''
expect = "survived"
note = "A race the writer wins: it writes each frame's queue within a frame, so the last rows are on disk before yds_finish() in every run; pl_close() drains it too. A guard against a disk slower than the end of the run."

